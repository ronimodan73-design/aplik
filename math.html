<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>המסע שלי במתמטיקה</title>
<style>
:root{
  --bg:#f6f8fc; --card:#ffffff; --ink:#1f2a44; --soft:#6b7690; --line:#e3e8f2;
  --ok:#2e9e5b; --okbg:#e8f7ee; --help:#e07b1a; --helpbg:#fff4e8; --main:#2f6fd6;
  --p0:#2e9e5b; --p1:#2f6fd6; --p2:#e07b1a; --p3:#8a4fd1; --p4:#d6428a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;font-size:19px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:14px 16px 24px;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h1{font-size:22px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;min-width:48px;height:48px;font-size:22px;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(30,50,90,.07);margin-bottom:14px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;background:var(--main);color:#fff;margin-top:12px;font-family:inherit}
.btn.ok{background:var(--ok)}
.btn.ghost{background:var(--card);color:var(--main);border:2px solid var(--main)}
.hidden{display:none!important}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
/* worlds */
.world{margin-bottom:12px}
.world h2{font-size:19px;margin-bottom:8px}
.station{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;font-size:18px;margin-bottom:8px;font-family:inherit;color:var(--ink);cursor:pointer}
.station.on{border-color:var(--main)}
.station.off{opacity:.45;cursor:default}
.stars{color:#f2b705;letter-spacing:2px;white-space:nowrap}
/* house */
.house{direction:ltr;display:flex;justify-content:center;gap:6px;margin:10px auto 4px}
.roomwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.room{width:64px;border:3px solid;border-radius:12px;overflow:hidden;background:#fff;transition:all .3s}
.room .lbl{font-size:14px;font-weight:700;color:#fff;text-align:center;padding:3px 2px;direction:rtl;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.room .dg{font-size:34px;font-weight:800;text-align:center;height:56px;line-height:56px}
.room.hl{transform:translateY(-4px);box-shadow:0 0 0 5px rgba(255,200,0,.55)}
.room.dim{opacity:.3}
.val{font-size:16px;font-weight:700;min-height:22px;opacity:0;transition:opacity .5s}
.val.show{opacity:1}
.roof{text-align:center;font-size:15px;color:var(--soft)}
.rowlab{text-align:center;font-weight:700;margin-top:6px}
/* question */
.prog{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.qcount{font-size:15px;color:var(--soft);text-align:center}
.prompt{font-size:22px;font-weight:700;text-align:center;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;font-size:26px;font-weight:800;padding:14px 6px;cursor:pointer;font-family:inherit;color:var(--ink);direction:ltr;min-height:66px}
.opt:disabled{opacity:.3;cursor:default;text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--okbg);opacity:1;text-decoration:none}
.fb{border-radius:16px;padding:14px 16px;margin-top:14px;font-size:19px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.help{background:var(--helpbg);border:2px solid var(--help)}
.fb h3{font-size:20px;margin-bottom:4px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font-size:17px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center}
.lv b{display:block;font-size:20px;color:#f2b705}
.lv.done{border-color:var(--ok);background:var(--okbg)}
.big{font-size:60px;text-align:center}
.center{text-align:center}
input.name{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:14px;font-family:inherit;text-align:center}
footer{text-align:center;font-size:13px;color:var(--soft);padding:10px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
.fam{display:flex;flex-direction:column;align-items:stretch}
.famroof{position:relative;height:58px;display:flex;align-items:flex-end;justify-content:center}
.famroof svg{position:absolute;inset:0;width:100%;height:100%}
.famroof span{position:relative;font-size:13px;font-weight:800;color:#fff;padding-bottom:6px;direction:rtl;white-space:nowrap}
.rooms{display:flex;gap:3px;background:#fff;border:3px solid var(--fc);border-top:none;border-radius:0 0 12px 12px;padding:4px}
.house{gap:10px}
.room{width:50px;border-radius:9px}
.room .lbl{font-size:12px;min-height:40px}
.room.empty{border-style:dashed;opacity:.55}
@media (max-width:420px){.house{gap:6px}.rooms{gap:2px;padding:3px}.room{width:45px}.room .dg{font-size:28px;height:50px;line-height:50px}.room .lbl{font-size:11px}.val{font-size:11.5px}}
.nl{width:100%;max-width:560px;display:block;margin:6px auto;direction:ltr}
.nl .arc{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .5s forwards}
.nl .arct{opacity:0;animation:fadein .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}
.qbox{display:inline-block;min-width:1.6em;border:3px dashed var(--help);border-radius:8px;color:var(--help);text-align:center;padding:0 4px}
.eq{font-size:min(5.2vw,24px);line-height:1.8}
.opts.wide{grid-template-columns:1fr}.opts.wide .opt{font-size:min(5.6vw,24px)}
.vt{direction:ltr;margin:8px auto;border-collapse:collapse;font-size:30px;font-weight:800}
.vt td{width:34px;height:42px;text-align:center;padding:0}
.vt td.op{width:30px;color:var(--ink)!important}
.vt tr.bar td{height:7px;border-radius:4px}.vt tr.bar td:first-child{background:none}
.vt tr.cr td{height:22px;font-size:17px;color:var(--help);vertical-align:bottom}
.vt tr.line td{border-top:3px solid var(--ink)}.vt tr.line td:first-child{border-top:none}
.vt td.hl{background:#fff3c4;border-radius:8px}
.vt td.qcell{text-align:center}
.vlab{font-weight:700;color:var(--soft);margin-top:6px}
.shop{margin:8px auto;border-collapse:collapse;font-size:19px;min-width:200px}
.shop th{background:var(--main);color:#fff;padding:6px 14px}.shop td{border:2px solid var(--line);padding:6px 14px;text-align:center}
.shop tr.hl td{background:#fff3c4;font-weight:800}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px;direction:ltr}
.fr b{border-bottom:3px solid currentColor;padding:0 4px}.fr i{font-style:normal}
.mx{display:inline-flex;align-items:center;gap:2px;direction:ltr;vertical-align:middle}
.fps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0;direction:ltr}
.fp{width:110px;height:auto}.fp.bar{width:200px}
.opt .fp{width:100px}.opt .fp.bar{width:180px}
.clk{width:150px;height:150px}
.fps .clk{width:120px;height:120px}
.conv{font-size:20px;margin:4px 0}
.gs{width:100%;max-width:220px;display:block;margin:6px auto}
.opt .gs{max-width:170px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="בית">🏠</button>
    <h1 id="title">המסע שלי במתמטיקה</h1>
    <button class="iconbtn" id="soundBtn" aria-label="צליל">🔇</button>
  </div>
  <div id="screen"></div>
</div>
<footer>ערכה: רוני מודן</footer>

<script>
/* ===== נתונים קבועים ===== */
const PN=['אחדות','עשרות','מאות','אלפים','עשרות אלפים','מאות אלפים'];
const PC=['var(--p0)','var(--p1)','var(--p2)','var(--p3)','var(--p4)','#b8860b'];
const WORLDS=[
 {name:'🔢 עולם המספרים',st:[{id:'decimal',name:'מבנה עשרוני – בית המספרים'},{id:'expand',name:'פירוק לפי ערך המקום'},{id:'line',name:'ישר המספרים'}]},
 {name:'➕ עולם הפעולות',st:[{id:'ops',name:'ארבע פעולות החשבון'},{id:'cmp',name:'השוואת תרגילים'},{id:'miss',name:'מספר חסר במשוואה'},{id:'dist',name:'כפל בעזרת פילוג'},{id:'times',name:'גדול פי, קטן פי'}]},
 {name:'➗ עולם ההתחלקות',st:[{id:'div56',name:'סימני התחלקות ב־2, 3, 5 ו־6'},{id:'prime',name:'מספרים ראשוניים'}]},
 {name:'📖 עולם הסיפורים',st:[{id:'story',name:'בעיות מילוליות'},{id:'price',name:'בעיות מחירון'}]},
 {name:'🍕 עולם השברים',st:[{id:'frac1',name:'משמעות השבר ושבר בציור'},{id:'frac2',name:'שבר גדול משלם, מספר מעורב והשלמה לשלם'}]},
 {name:'📏 עולם המדידות',st:[{id:'length',name:'מדידות אורך'},{id:'weight',name:'משקל: גרם וק״ג'},{id:'clock',name:'קריאת שעון וחישוב זמנים'}]},
 {name:'📐 עולם הצורות והנתונים',st:[{id:'parallel',name:'צלעות מקבילות ושרטוט מקבילה'},{id:'angles',name:'סוגי זוויות'},{id:'tri',name:'סוגי משולשים'},{id:'quad',name:'מלבן, ריבוע ומעוין'},{id:'perim',name:'היקף ושטח'},{id:'data',name:'דיאגרמה וחקר נתונים'}]}
];
const LEVELS_DEC=[
 {t:'איפה הספרה גרה?',s:'★'},
 {t:'כמה הספרה שווה?',s:'★★'},
 {t:'בונים מספר',s:'★★★'},
 {t:'מי גדול יותר?',s:'★★★★'}
];
const PER=20;

/* ===== שמירה ===== */
let S={name:'',sound:false,done:{}};
try{const x=JSON.parse(localStorage.getItem('roniMathJourney')||'null');if(x)S=Object.assign(S,x);}catch(e){}
function save(){try{localStorage.setItem('roniMathJourney',JSON.stringify(S));}catch(e){}}

/* ===== כלים ===== */
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Number(n).toLocaleString('en-US');
const N=n=>`<span class="n">${fmt(n)}</span>`;
const C=(p,txt)=>`<b style="color:${PC[p]}">${txt}</b>`;
const digs=n=>String(n).split('').reverse().map(Number);           // מקום 0 = אחדות
const fromDigs=d=>Number(d.slice().reverse().join(''));
function distinctDigits(len,min){const pool=shuffle([...Array(10-min)].map((_,i)=>i+min));return pool.slice(0,len);}
function beep(f){if(!S.sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=f||660;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35);o.stop(a.currentTime+.36);}catch(e){}}

/* ===== ציור בית המספרים ===== */
function house(n,opt={}){
  const d=n===null?[]:digs(n);
  const len=Math.max(opt.len||d.length,d.length);
  const room=p=>{
    const used=p<len;
    const cls=(opt.hl&&opt.hl.includes(p))?' hl':((opt.hl&&opt.dimOthers)?' dim':'');
    const dg=(opt.blank||p>=d.length)?'&nbsp;':d[p];
    const v=(opt.vals&&p<d.length)?fmt(d[p]*10**p):'';
    return `<div class="roomwrap"><div class="room${cls}${used?'':' empty'}" style="border-color:${PC[p]}"><div class="lbl" style="background:${PC[p]}">${PN[p]}</div><div class="dg" style="color:${PC[p]}">${dg}</div></div>${opt.vals?`<div class="val" style="color:${PC[p]}" data-p="${p}">${v}</div>`:''}</div>`;
  };
  const fam=(name,col,ps)=>`<div class="fam" style="--fc:${col}"><div class="famroof"><svg viewBox="0 0 100 58" preserveAspectRatio="none"><polygon points="50,2 100,58 0,58" fill="${col}"/></svg><span>${name}</span></div><div class="rooms">${ps.map(room).join('')}</div></div>`;
  let h='<div class="house">';
  if(len>3)h+=fam('משפחת האלפים','#6b4bb8',[5,4,3]);
  h+=fam('משפחת היחידות','#3a7d5c',[2,1,0]);
  return h+'</div>';
}

/* ===== מחוללי שאלות – כל תשובה שגויה מביאה הסבר משלה ===== */
const GEN_DEC=[
 // ★ איפה הספרה גרה
 function(i){
   const len=i<6?3:(i<14?4:(i<18?5:6)), d=distinctDigits(len,1), n=fromDigs(d), p=R(0,len-1);
   const others=shuffle([...Array(len).keys()].filter(q=>q!==p)).slice(0,2);
   const opts=[{v:d[p],ok:true}].concat(others.map(q=>({v:d[q],q})));
   return {
     prompt:`איזו ספרה גרה בבית ה${C(p,PN[p])}?`, show:{n,hl:[p]},
     opts:shuffle(opts).map(o=>({label:o.v,ok:!!o.ok,
       why:o.ok?'':`הספרה ${o.v} גרה בבית ה${C(o.q,PN[o.q])}.<br>אנחנו מחפשים את הבית ה${C(p,'צבעוני הזה – '+PN[p])}. תסתכל על הכותרת של החדר.`,
       hl:o.ok?[p]:[p,o.q]})),
     right:`נכון! הספרה ${C(p,d[p])} גרה בבית ה${C(p,PN[p])}.`
   };
 },
 // ★★ כמה הספרה שווה
 function(i){
   const len=i<5?3:(i<12?4:(i<17?5:6)), d=distinctDigits(len,2), n=fromDigs(d), p=R(1,len-1), dg=d[p], val=dg*10**p;
   let ks=[0,p,p-1>0?p-1:null,p+1<=5?p+1:null].filter(k=>k!==null);
   ks=[...new Set(ks)].slice(0,4);
   if(ks.length<4)ks.push(p+2<=5?p+2:p-2);
   const opts=[...new Set(ks)].map(k=>({v:dg*10**k,k}));
   return {
     prompt:`בתוך המספר ${N(n)}, כמה שווה הספרה ${C(p,dg)}?`, show:{n,hl:[p]},
     opts:shuffle(opts).map(o=>({label:fmt(o.v),ok:o.k===p,
       why:o.k===p?'':(o.k===0
         ?`${dg} זו רק הספרה.<br>היא גרה בבית ה${C(p,PN[p])}, ולכן היא שווה ${C(p,dg+' '+PN[p])} = ${C(p,N(val))}.`
         :`${N(o.v)} זה מה שהספרה הייתה שווה אם היא גרה בבית ה${C(o.k,PN[o.k])}.<br>אבל היא גרה בבית ה${C(p,PN[p])}.`),
       hl:[p]})),
     right:`נכון! ${C(p,dg)} גרה בבית ה${C(p,PN[p])}, ולכן היא שווה ${C(p,N(val))}.`,
     after:{n,vals:true,hl:[p]}
   };
 },
 // ★★★ בונים מספר (עם בית ריק)
 function(i){
   const len=i<8?4:(i<15?5:6), z=R(1,len-2), d=[];
   for(let p=0;p<len;p++)d[p]=p===z?0:R(2,9);
   const n=fromDigs(d);
   const words=[];for(let p=len-1;p>=0;p--)words.push(C(p,d[p]+' '+PN[p]));
   const sum=[];for(let p=len-1;p>=0;p--)if(d[p])sum.push(C(p,N(d[p]*10**p)));
   const form=i%2;
   const prompt=form?`איזה מספר יוצא?<br><span class="n" style="white-space:nowrap;font-size:min(4.6vw,22px)">${sum.join(' + ')}</span>`:`${words.join(', ')}.<br>איזה מספר זה?`;
   const dropped=fromDigs(d.filter((x,p)=>p!==z));
   const reversed=Number(String(n).split('').reverse().join(''));
   const zw=d.slice();const z2=z===1?2:1;if(z2<len-1||len>3){[zw[z],zw[z2]]=[zw[z2],zw[z]];}
   const wrongZero=fromDigs(zw);
   let pool=[{v:n,ok:true},{v:dropped,t:'drop'},{v:reversed,t:'rev'},{v:wrongZero,t:'zw'}];
   const seen=new Set();pool=pool.filter(o=>!seen.has(o.v)&&seen.add(o.v));
   const W={
     drop:`שכחת את הבית הריק.<br>אין ${C(z,PN[z])} – ולכן כותבים ${C(z,'0')} בבית ה${C(z,PN[z])}. בלי האפס, כל הספרות זזות לבית הלא נכון.`,
     rev:`כתבת את הספרות בסדר הפוך.<br>ה${C(0,'אחדות')} תמיד בחדר הכי ימני, וה${C(len-1,PN[len-1])} בחדר הכי שמאלי.`,
     zw:`ה־0 נכנס לבית הלא נכון.<br>הבית הריק הוא בית ה${C(z,PN[z])} – שם צריך לשים ${C(z,'0')}.`
   };
   return {
     prompt, show:{n,blank:true},
     opts:shuffle(pool).map(o=>({label:fmt(o.v),ok:!!o.ok,why:o.ok?'':W[o.t],hl:[z],reveal:true})),
     right:`נכון! כל ספרה בחדר שלה, ובבית ה${C(z,PN[z])} הריק שמנו ${C(z,'0')}.`,
     after:{n,hl:[z]}
   };
 },
 // ★★★★ מי גדול יותר
 function(i){
   let A,B,q,type;
   if(i%4===3){ // אורך שונה
     type='len'; const L=i<10?3:4;
     const da=[];for(let p=0;p<L;p++)da[p]=R(0,2);da[L]=1;A=fromDigs(da);
     const db=[];for(let p=0;p<L;p++)db[p]=R(7,9);B=fromDigs(db);q=L;
   }else{
     type='same'; const L=i<8?4:(i<15?5:6); q=R(1,L-2);
     const da=[],db=[];
     for(let p=L-1;p>q;p--){const x=R(p===L-1?1:0,9);da[p]=x;db[p]=x;}
     const a=R(3,9);da[q]=a;db[q]=R(0,a-1);if(q===L-1&&db[q]===0)db[q]=1;
     for(let p=q-1;p>=0;p--){da[p]=R(0,3);db[p]=R(6,9);}
     A=fromDigs(da);B=fromDigs(db);
   }
   const len=Math.max(String(A).length,String(B).length);
   const top=Math.random()<.5;const first=top?A:B,second=top?B:A;
   const dA=digs(A),dB=digs(B);
   const eq=[];for(let p=len-1;p>q;p--)eq.push(p);
   let why;
   if(type==='len')why=`ל־${N(B)} יש ספרות גדולות, אבל ל־${N(A)} יש בית ${C(q,PN[q])} – ול־${N(B)} אין בכלל!<br>מי שיש לו בית גדול יותר – הוא הגדול.`;
   else why=`הסתכלת על הספרות שבסוף.<br>משווים מהבית ה${C(len-1,'הכי שמאלי')} – הבית הכי גדול.<br>`+(eq.length?eq.map(p=>`בית ה${C(p,PN[p])}: ${dA[p]} = ${dB[p]}, ממשיכים.`).join('<br>')+'<br>':'')+`בית ה${C(q,PN[q])}: ${C(q,dA[q])} גדול מ־${C(q,dB[q])}. סיימנו – ${N(A)} גדול יותר.`;
   return {
     prompt:'איזה מספר גדול יותר?', two:{first,second,len,hl:[q]},
     opts:[first,second].map(v=>({label:fmt(v),ok:v===A,why:v===A?'':why,hl:[q]})),

  for(let mm=0;mm<=100;mm++){const x=X0+mm*S/10,h=mm%10===0?18:(mm%5===0?13:8);s+=`<line x1="${x}" y1="${Y-6}" x2="${x}" y2="${Y-6+h}" stroke="#1f2a44" stroke-width="${mm%10===0?2:1}"/>`;
    if(mm%10===0)s+=`<text x="${x}" y="${Y+30}" text-anchor="middle" font-size="14" font-weight="800" fill="${PC[1]}">${mm/10}</text>`;}

}

    s+=`<polyline points="${vx+u[0]*d},${vy+u[1]*d} ${vx+u[0]*d+v[0]*d},${vy+u[1]*d+v[1]*d} ${vx+v[0]*d},${vy+v[1]*d}" fill="none" stroke="${GO}" stroke-width="3"/>`;}

function chart(cats,vals,step,hl){const n=cats.length,max=Math.ceil(Math.max(...vals)/step)*step+step,H=150,X0=40,W=280,bw=W/n*0.6;
  let s='';for(let v=0;v<=max;v+=step){const y=10+H-H*v/max;s+=ln(X0,y,X0+W,y,'#e3e8f2',1)+`<text x="${X0-6}" y="${y+5}" text-anchor="end" font-size="12" font-weight="700" fill="#6b7690">${v}</text>`;}
  cats.forEach((c,j)=>{const x=X0+W/n*j+W/n*0.2,h=H*vals[j]/max;s+=`<rect x="${x}" y="${10+H-h}" width="${bw}" height="${h}" rx="3" fill="${hl&&hl.includes(j)?GO:GB}"/>`+tx(x+bw/2,H+28,c,GI,13);});
  return SV(340,H+36,ln(X0,10,X0,10+H,GI,2)+ln(X0,10+H,X0+W,10+H,GI,2)+s,'nl');}
function dset(i){const [t,cats]=pick(DSETS),step=i<10?1:pick([2,5]),vals=[];while(vals.length<4){const v=R(1,i<10?9:8)*step+(i>=15&&step>1&&R(0,1)?step/2:0);if(!vals.includes(v))vals.push(v);}return {t,cats:cats.slice(0,4),vals,step};}

  $('title').textContent='המסע שלי במתמטיקה';
  if(!S.name){
    $('screen').innerHTML=`<div class="card center pop"><div class="big">👋</div><p class="prompt">איך קוראים לך?</p><input class="name" id="nm" maxlength="20"><button class="btn" id="nmok">זה השם שלי</button></div>`;
    $('nmok').onclick=()=>{S.name=$('nm').value.trim()||'אלוף';save();home();};
    return;
  }
  let h=`<div class="card pop"><p class="prompt" style="margin:0">שלום ${S.name}! 😊<br><span style="font-size:17px;font-weight:400">בוחרים תחנה ומתחילים.</span></p></div>`;
  WORLDS.forEach(w=>{
    h+=`<div class="world"><h2>${w.name}</h2>`;
    w.st.forEach(s=>{
      const ok=s.id&&STATIONS[s.id], nDone=ok?Object.keys(S.done[s.id]||{}).length:0;
      h+=ok?`<button class="station on" data-id="${s.id}"><span>${s.name}</span><span class="stars">${'★'.repeat(nDone)}${'☆'.repeat(4-nDone)}</span></button>`
           :`<div class="station off"><span>${s.name}</span><span style="font-size:14px">בקרוב 🔒</span></div>`;
    });
    h+='</div>';
  });
  $('screen').innerHTML=h;
  document.querySelectorAll('.station.on').forEach(b=>b.onclick=()=>{SID=b.dataset.id;ST=STATIONS[SID];ST.intro();});
}
function introDecimal(){
  $('title').textContent='בית המספרים';
  $('screen').innerHTML=`<div class="card pop">
   <p class="prompt">בבית המספרים לכל ספרה יש חדר.</p>
   <p class="center">בבית יש שתי משפחות: <b style="color:#3a7d5c">היחידות</b> ו<b style="color:#6b4bb8">האלפים</b>.<br>החדר קובע כמה הספרה שווה.</p>
   ${house(4352,{vals:true})}
   <p class="center" id="ex" style="min-height:60px"></p>
   <button class="btn" id="go">לבחירת שלב</button></div>`;
  const steps=[[3,`${C(3,'4')} גר בבית ה${C(3,'אלפים')} ← שווה ${C(3,'4,000')}`],[2,`${C(2,'3')} גר בבית ה${C(2,'מאות')} ← שווה ${C(2,'300')}`],[1,`${C(1,'5')} גר בבית ה${C(1,'עשרות')} ← שווה ${C(1,'50')}`],[0,`${C(0,'2')} גר בבית ה${C(0,'אחדות')} ← שווה ${C(0,'2')}`]];
  steps.forEach(([p,t],k)=>setTimeout(()=>{const el=document.querySelector(`.val[data-p="${p}"]`);if(el)el.classList.add('show');const ex=$('ex');if(ex)ex.innerHTML=t;},700+k*1500));
  setTimeout(()=>{const ex=$('ex');if(ex)ex.innerHTML=`<span class="n">${C(3,'4,000')} + ${C(2,'300')} + ${C(1,'50')} + ${C(0,'2')} = 4,352</span>`;},700+4*1500);
  $('go').onclick=levels;
}
function introExpand(){
  $('title').textContent='פירוק לפי ערך המקום';
  $('screen').innerHTML=`<div class="card pop">
   <p class="prompt">לפרק מספר = לכתוב כמה שווה כל ספרה.</p>
   ${house(6407,{vals:true})}
   <p class="center">${EQ('6,407 = '+C(3,'6,000')+' + '+C(2,'400')+' + '+C(0,'7'))}</p>
   <p class="center">בבית ה${C(1,'עשרות')} יש ${C(1,'0')} – לא כותבים אותו,<br>אבל הוא שומר על המקום.</p>
   <button class="btn" id="go">לבחירת שלב</button></div>`;
  setTimeout(()=>document.querySelectorAll('.val').forEach(e=>e.classList.add('show')),400);
  $('go').onclick=levels;
}
function introOps(){
  $('title').textContent='ארבע פעולות החשבון';
  $('screen').innerHTML=`<div class="card pop">
   <p class="prompt">בתרגיל במאונך כל עמודה היא בית.</p>
   <p class="center">הצבעים הם אותם צבעים של בית המספרים:<br>${C(0,'אחדות')}, ${C(1,'עשרות')}, ${C(2,'מאות')}, ${C(3,'אלפים')}.</p>
   ${vert([47,38],'+',{res:85,carry:{1:1},hl:[0,1]})}
   <p class="center">מתחילים תמיד מה${C(0,'אחדות')} – מימין.<br><span class="n">${C(0,'7 + 8 = 15')}</span>: כותבים ${C(0,'5')}, ו־${C(1,'1')} עובר ל${C(1,'עשרות')}.</p>
   <button class="btn" id="go">לבחירת שלב</button></div>`;
  $('go').onclick=levels;
}
function introMiss(){
  $('title').textContent='מספר חסר במשוואה';
  $('screen').innerHTML=`<div class="card pop">
   <p class="prompt">כל תרגיל הוא ${K(BC.whole[1],'שלם')} ו${K(BC.known[1],'חלקים')}.</p>
   <p class="center">${EQ(`25 + ${QB} = 40`)}</p>
   ${bars({v:40,t:'40'},[{v:25,t:'25'},{v:15,t:'?',q:1}])}
   <p class="center">${KN(BC.whole[1],40)} הוא השלם. ${KN(BC.known[1],25)} הוא חלק.<br>החלק החסר: <span class="n">40 ${MINUS} 25 = 15</span></p>
   <p class="center">ותמיד בודקים: <span class="n">25 + 15 = 40</span> ✔</p>
   <button class="btn" id="go">לבחירת שלב</button></div>`;
  $('go').onclick=levels;
}
function introLine(){
  $('title').textContent='ישר המספרים';
  const c={start:0,step:10,J:5,labels:[0,1,2,3,4,5]};
  $('screen').innerHTML=`<div class="card pop">
   <p class="prompt">על ישר המספרים כל הקפיצות שוות.</p>
   ${nline(c,{arcs:{from:0,to:5,label:true}})}
   <p class="center">כאן כל ${K(LC.jump,'קפיצה')} שווה ${KN(LC.jump,10)}.</p>
   <p class="center">כדי לדעת כמה שווה קפיצה,<br>מסתכלים על ${K(LC.tick,'המספרים הכתובים')}.</p>
   <button class="btn" id="go">לבחירת שלב</button></div>`;
  $('go').onclick=levels;
}
function levels(){
  $('title').textContent=ST.title;
  const done=S.done[SID]||{};
  let h=`<div class="card pop"><p class="prompt">באיזה שלב נתרגל?</p><div class="levels">`;
  ST.levels.forEach((l,k)=>h+=`<button class="lv${done[k]?' done':''}" data-k="${k}"><b>${l.s}</b>${l.t}${done[k]?' ✅':''}</button>`);
  h+=`</div><button class="btn ghost" id="again">להסבר מההתחלה</button></div>`;
  $('screen').innerHTML=h;
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>startLevel(+b.dataset.k));
  $('again').onclick=()=>ST.intro();
}
let L,qi,cur,firstTry;
function startLevel(k){L=k;qi=0;firstTry=0;next();}
function showVis(html){$('vis').innerHTML=html;setTimeout(()=>document.querySelectorAll('#vis .val').forEach(e=>e.classList.add('show')),50);}
function next(){
  if(qi>=PER)return finish();
  cur=ST.gen[L](qi);cur.lv=L;cur.err=false;
  $('title').textContent=ST.levels[L].s+' '+ST.levels[L].t;
  $('screen').innerHTML=`<div class="card pop">
    <div class="qcount">שאלה ${qi+1} מתוך ${PER}</div>
    <div class="prog"><i style="width:${qi/PER*100}%"></i></div>
    <div id="vis"></div>
    <p class="prompt">${cur.prompt}</p>
    <div class="opts${cur.wide?' wide':''}">${cur.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o.label}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
  showVis(ST.render(cur,'start'));
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j,b));
}
function answer(j,btn){
  const o=cur.opts[j];
  if(o.ok){
    if(!cur.err)firstTry++;
    beep(784);
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    btn.classList.add('right');btn.disabled=false;
    showVis(ST.render(cur,'right',o));
    $('fb').innerHTML=`<div class="fb ok pop"><h3>✅ ${cur.err?'הצלחת!':'מצוין!'}</h3>${cur.right}</div><button class="btn ok" id="nx">${qi+1<PER?'לשאלה הבאה':'לסיום השלב'}</button>`;
    $('nx').onclick=()=>{qi++;next();};
  }else{
    cur.err=true;btn.disabled=true;
    showVis(ST.render(cur,'wrong',o));
    $('fb').innerHTML=`<div class="fb help pop"><h3>🔍 בוא נבדוק יחד</h3>${o.why}<br><b>עכשיו נסה שוב.</b></div>`;
  }
}
function finish(){
  S.done[SID]=S.done[SID]||{};S.done[SID][L]=true;save();beep(988);
  const last=ST.levels.length-1;
  $('screen').innerHTML=`<div class="card center pop"><div class="big">🏆</div>
   <p class="prompt">כל הכבוד ${S.name}!</p>
   <p>סיימת את שלב ${ST.levels[L].s}<br>הצלחת מיד ב־${firstTry} שאלות מתוך ${PER}.</p>
   ${L<last?`<button class="btn ok" id="nl">לשלב הבא ${ST.levels[L+1].s}</button>`:''}
   <button class="btn ghost" id="bk">לכל השלבים</button></div>`;
  if(L<last)$('nl').onclick=()=>startLevel(L+1);
  $('bk').onclick=levels;
}

$('homeBtn').onclick=home;
$('soundBtn').textContent=S.sound?'🔊':'🔇';
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();$('soundBtn').textContent=S.sound?'🔊':'🔇';beep(660);};
home();

</script>
</body>
</html>
