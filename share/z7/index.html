<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שיעורים · כיתה ז׳</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2541;--mut:#5c6784;--line:#dfe4ef;--d:#0f8a5f;--l:#1e1b4b;--soon:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--ink:#e8ecf5;--mut:#a3adc2;--line:#2c364a;--soon:#232b3b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#065f46,#0f8a5f);color:#fff;border-radius:16px;padding:18px}
header h1{margin:0 0 4px;font-size:1.5rem}header p{margin:0;font-size:.98rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:1.12rem}.card p{margin:0 0 8px;color:var(--mut);font-size:.93rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a,.btns span{text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem;color:#fff}
a.d{background:var(--d)}a.l{background:var(--l)}
.btns span{background:var(--soon);color:var(--mut);font-weight:600}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:.93rem;color:var(--mut);background:var(--card)}
footer{text-align:center;font-weight:700;padding:20px 0 30px}
</style>
</head>
<body><div class="wrap">
<header><h1>📚 שיעורים במתמטיקה · כיתה ז׳</h1><p style="font-weight:700">ערכה: רוני מודן · שחקים</p><p>לכל שיעור: מצגת + יישומון ללוח שהמורה שולטת בו. נפתח ישר מהקישור, בלי התחברות.</p></header>
<div id="app"></div>
<div class="note">💡 <b>במצגת:</b> לוחצים על כפתור המסך המלא להקרנה על הלוח. <b>ביישומון ללוח:</b> גוררים את העיגולים, והציור מתעדכן מול הכיתה.</div>
<footer>ערכה: רוני מודן · שחקים</footer>
</div>
<script>
const B='https://htmlpreview.github.io/?https://github.com/ronimodan73-design/aplik/blob/main/';
const L=[
 ['1','ערך מוחלט: המרחק מ־0','מה זה ערך מוחלט, ולמה הוא אף פעם לא שלילי.','decks/z7_abs_only.html','labs/axes_lab.html'],
 ['2','מספרים מכוונים: חיבור וחיסור','ערך מוחלט כ"שפה אחת לכל המינוסים", וחיבור וחיסור בעזרת חיילים בשני צבעים.','decks/z7_abs.html','labs/directed_lab.html'],
 ['3','שטח והיקף של ריבוע ומלבן','נמלה רצה סביב ההיקף, משבצות ממלאות את השטח, והנוסחה בצבעים.','','labs/area_lab.html'],
 ['4','מלבן על מערכת הצירים','קוראים אורכי צלעות מהצירים, ומחשבים היקף ושטח. אותו היקף ושטח שונה, וחיסור שטחים.','','labs/rect_lab.html'],
 ['5','מדידת זווית במד זווית','מניחים את המד נכון, בוחרים סולם, ונזהרים מהטעות הנפוצה. גם זווית מוטה.','','labs/protractor_lab.html']];
document.getElementById('app').innerHTML=L.map(([n,t,w,d,l])=>`<div class="card"><h2>שיעור ${n} · ${t}</h2><p>${w}</p><div class="btns">${d?`<a class="d" href="${B+d}" target="_blank" rel="noopener">🎞️ מצגת</a>`:'<span>🎞️ מצגת · בקרוב</span>'}${l?`<a class="l" href="${B+l}" target="_blank" rel="noopener">🖥️ יישומון ללוח</a>`:'<span>🖥️ יישומון ללוח · בקרוב</span>'}</div></div>`).join('');
</script>
</body></html>
