<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שיעורים · כיתה ז׳</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2541;--mut:#5c6784;--line:#dfe4ef;--d:#0f8a5f;--l:#1e1b4b;--soon:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--ink:#e8ecf5;--mut:#a3adc2;--line:#2c364a;--soon:#232b3b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#065f46,#0f8a5f);color:#fff;border-radius:16px;padding:18px}
header h1{margin:0 0 4px;font-size:1.5rem}header p{margin:0;font-size:.98rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:1.12rem}.card p{margin:0 0 8px;color:var(--mut);font-size:.93rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.nl{margin-top:12px}.nr{border-top:1px solid #e3e6ee;padding:10px 0}.nr>b{display:block;margin-bottom:6px;font-size:1.02rem}.nr.g>b{color:#0f8a5f}.btns .dlx{background:#f5b83d;color:#111;border:0;cursor:pointer;font-family:inherit}
.dlb button{background:#f5b83d!important;color:#111!important;font-size:1rem!important}
.btns a,.btns span,.btns button{text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem;color:#fff}
a.d,button.d{background:var(--d)}a.l,button.l{background:var(--l)}
.btns span{background:var(--soon);color:var(--mut);font-weight:600}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:.93rem;color:var(--mut);background:var(--card)}
footer{text-align:center;font-weight:700;padding:20px 0 30px}
</style>
</head>
<body><div class="wrap">
<header><h1>📚 שיעורים במתמטיקה · כיתה ז׳</h1><p style="font-weight:700">ערכה: רוני מודן · שחקים</p><p>לכל שיעור: מצגת + יישומון ללוח שהמורה שולטת בו. נפתח ישר מהקישור, בלי התחברות.</p></header>
<div id="app"></div>
<div class="note">💡 <b>במצגת:</b> לוחצים על כפתור המסך המלא להקרנה על הלוח. <b>ביישומון ללוח:</b> גוררים את העיגולים, והציור מתעדכן מול הכיתה.</div>
<footer>ערכה: רוני מודן · שחקים</footer>
</div>
<script>
const B='https://htmlpreview.github.io/?https://github.com/ronimodan73-design/aplik/blob/main/';
const L=[
 ['1','ערך מוחלט: המרחק מ־0','מה זה ערך מוחלט, ולמה הוא אף פעם לא שלילי.','decks/z7_abs_only.html','labs/axes_lab.html'],
 ['2','מספרים מכוונים: חיבור וחיסור','ערך מוחלט כ"שפה אחת לכל המינוסים", וחיבור וחיסור בעזרת חיילים בשני צבעים.','decks/z7_abs.html','labs/directed_lab.html'],
 ['3','שטח והיקף של ריבוע ומלבן','נמלה רצה סביב ההיקף, משבצות ממלאות את השטח, והנוסחה בצבעים.','','labs/area_lab.html','apps/z7_area.html'],
 ['4','מלבן על מערכת הצירים','קוראים אורכי צלעות מהצירים, ומחשבים היקף ושטח. אותו היקף ושטח שונה, וחיסור שטחים.','','labs/rect_lab.html','apps/z7_q1.html'],
 ['5','מדידת זווית במד זווית','מניחים את המד נכון, בוחרים סולם, ונזהרים מהטעות הנפוצה. גם זווית מוטה.','','labs/protractor_lab.html']];
const R='https://raw.githubusercontent.com/ronimodan73-design/aplik/main/';
const NL=[[1, "ערך מוחלט – המרחק מ־0"], [2, "חיבור מספרים מכוונים – תזוזה על הציר"], [3, "כללי הסימנים בחיבור"], [4, "חיבור של כמה מחוברים"], [5, "חיסור הוא חיבור של המספר הנגדי"], [6, "השמטת סוגריים וכתיבה מקוצרת"], [7, "חישוב ביטויים בלי סוגריים"], [8, "זווית כמידת סיבוב"], [9, "זוויות צמודות"], [10, "סוגי משולשים · משולש שווה שוקיים"], [11, "סכום הזוויות במשולש"], [12, "סכום הזוויות במרובע"], [13, "צורות חופפות · הזזה"], [14, "שיקוף"], [15, "סיבוב"]];
const NOV=`<div class="card" style="border:3px solid #f5b83d"><h2>⭐ נובמבר · כל 15 השיעורים במקום אחד</h2><p>מספרים מכוונים (שיעורים 1–7) וגאומטריה (שיעורים 8–15). בכל שיעור: מצגת, משימות לכיתה ולבית עם משימות חובה כמו המודל, והבוחן במודל.</p><div class="btns"><a class="d" href="${B}decks/z7_nov.html" target="_blank" rel="noopener">🎞️ מצגת נובמבר</a><a class="l" href="${B}share/z7/nov_tasks.html" target="_blank" rel="noopener">🖨️ משימות לכיתה ולבית · פתיחה והדפסה</a><a class="l" href="${B}share/z7/nov_teacher.html" target="_blank" rel="noopener">📘 נספח למורה</a></div><div class="nl">${NL.map(([n,t])=>`<div class="nr${n>=8?' g':''}"><b>שיעור ${n} · ${t}</b><div class="btns"><a class="d" href="${B}decks/z7nov/L${n}.html" target="_blank" rel="noopener">🎞️ מצגת</a><button type="button" class="dlx" onclick="dl('decks/z7nov/L${n}.html','מצגת שיעור ${n} – ${t.replace(/['"]/g,'')}.html',this)">⬇️ הורדת מצגת</button><a class="l" href="${B}share/z7/nov/L${n}.html" target="_blank" rel="noopener">🖨️ דף משימות</a><button type="button" class="dlx" onclick="dl('decks/files/z7nov/L${n}.docx','משימות שיעור ${n} – ${t.replace(/['"]/g,'')}.docx',this)">⬇️ הורדת דף (Word)</button></div></div>`).join('')}</div><div style="margin-top:14px;background:#fff6dc;border:2px dashed #f5b83d;border-radius:12px;padding:10px 12px"><p style="margin:0 0 8px;font-weight:900;font-size:1.1rem">⬇️ כל החודש בקובץ אחד – להורדה</p><p style="margin:0 0 8px;font-size:.9rem">לוחצים, והקובץ נשמר אצלכן. המצגת שהורדה עובדת גם בלי אינטרנט בכיתה.</p><div class="btns dlb"><button type="button" class="d" style="border:0;cursor:pointer;font-family:inherit" onclick="dl('decks/z7_nov.html','מצגת ז – נובמבר.html',this)">⬇️ הורדת המצגת</button><button type="button" class="l" style="border:0;cursor:pointer;font-family:inherit" onclick="dl('decks/files/z7_nov_tasks.docx','משימות לכיתה ולבית – ז נובמבר.docx',this)">⬇️ הורדת דף המשימות (Word)</button><button type="button" class="l" style="border:0;cursor:pointer;font-family:inherit" onclick="dl('decks/files/z7_nov_teacher.docx','נספח למורה – ז נובמבר.docx',this)">⬇️ הורדת הנספח למורה (Word)</button></div></div></div>`;
async function dl(path,name,btn){const t=btn.textContent;btn.textContent='⏳ מוריד…';try{const r=await fetch(R+path,{cache:'no-store'});if(!r.ok)throw 0;const b=new Blob([await r.arrayBuffer()],{type:name.endsWith('.html')?'text/html':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();btn.textContent='✅ הורד';}catch(e){btn.textContent='נסו שוב';}setTimeout(()=>btn.textContent=t,4000);}
document.getElementById('app').innerHTML=NOV+L.map(([n,t,w,d,l,a])=>`<div class="card"><h2>שיעור ${n} · ${t}</h2><p>${w}</p><div class="btns">${d?`<a class="d" href="${B+d}" target="_blank" rel="noopener">🎞️ מצגת</a>`:'<span>🎞️ מצגת · בקרוב</span>'}${l?`<a class="l" href="${B+l}" target="_blank" rel="noopener">🖥️ יישומון ללוח</a>`:'<span>🖥️ יישומון ללוח · בקרוב</span>'}${a?`<a class="d" href="${B+a}" target="_blank" rel="noopener">📱 תרגול לתלמידים</a>`:''}</div></div>`).join('');
</script>
</body></html>
