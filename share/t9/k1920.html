<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מפתח והכוונה למורה · גורם משותף</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2541;--mut:#5c6784;--acc:#1d4ed8;--acc2:#e8eefc;--line:#dfe4ef}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;direction:rtl;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header h1{font-size:1.35rem;margin:6px 0 2px}header p{margin:0;color:var(--mut);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.date{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:.9rem}
.card h2{font-size:1.08rem;margin:8px 0 4px}.card p{margin:0 0 10px;color:var(--mut);font-size:.93rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a{display:inline-block;text-decoration:none;background:var(--acc2);color:var(--acc);border-radius:10px;padding:9px 13px;font-weight:600;font-size:.95rem}
.btns a.key{background:transparent;border:1px solid var(--line);color:var(--mut)}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:18px 0 30px}
.bar{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);z-index:2}
.bar a,.bar button{font:inherit;text-decoration:none;background:var(--acc2);color:var(--acc);border:0;border-radius:10px;padding:8px 12px;font-weight:600}
.bar h1{font-size:1rem;margin:0;flex:1}
.pg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
@media print{.bar,footer{display:none}.pg{border:0;box-shadow:none;margin:0;page-break-after:always;border-radius:0}body{background:#fff}.wrap{padding:0;max-width:none}}
