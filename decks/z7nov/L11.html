<style>
/* Layout: one 16:9 stage, content flush right, one dominant visual per slide. Single dark "classroom board" theme. */
:root{
  --bg:#0f1b2d; --stage:#13233a; --ink:#f3f6fb; --muted:#9fb3cc; --line:#2b4466;
  --accent:#ffb020; --ray:#5ec8ff; --ray2:#ff7a8a; --ok:#4fd18b; --chip:#1c3352;
  --display:"Rubik","Heebo",Arial,sans-serif; --body:"Heebo","Rubik",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;direction:rtl;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px;box-sizing:border-box;gap:8px}
.bar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.bar .t{font-family:var(--display);font-weight:700;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.bar button:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{aspect-ratio:16/9;width:min(100%,calc((100vh - 120px)*16/9));max-width:100%;background:var(--stage);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;container-type:inline-size}
.slide{position:absolute;inset:0;padding:4.5cqw 5cqw;display:none;flex-direction:column;gap:2cqw}
.slide.on{display:flex;animation:in .5s ease}
@keyframes in{from{opacity:.0;transform:translateY(1.5cqw)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--display);font-weight:500;color:var(--accent);font-size:1.7cqw;letter-spacing:.04em}
h1{font-family:var(--display);font-weight:900;font-size:5.2cqw;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:3.4cqw;line-height:1.2;margin:0;text-wrap:balance}
p,li{font-size:2.15cqw;line-height:1.45;margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:3cqw;align-items:center;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:1.4cqw;flex:1;min-width:0}
.vis{flex:1.15;min-width:0;display:flex;align-items:center;justify-content:center}
.vis svg{width:100%;height:auto;max-height:34cqw}
.step{opacity:.0;translate:-1cqw 0;transition:opacity .45s,translate .45s}
.step.shown{opacity:1;translate:none}
svg .step{translate:none}
.card{font-size:1.9cqw;line-height:1.4;background:var(--chip);border:1px solid var(--line);border-radius:1.2cqw;padding:1.4cqw 1.8cqw}
.what{border-right:.5cqw solid var(--accent)}
.what b{color:var(--accent)}
.lvl{display:inline-flex;gap:.6cqw;align-items:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.9cqw}
.big{font-family:var(--display);font-weight:900;font-size:7cqw;color:var(--accent);line-height:1}
.ans{color:var(--ok);font-weight:700}
ol,ul{margin:0;padding-right:2.4cqw;display:flex;flex-direction:column;gap:1cqw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.menu{display:flex;flex-direction:column;gap:1.4cqw}.menu button{all:unset;cursor:pointer;display:flex;gap:2cqw;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:1.2cqw;padding:1.4cqw 2cqw;font-size:2.2cqw}.menu button:hover,.menu button:focus-visible{border-color:var(--accent)}.menu small{color:var(--muted);font-size:1.6cqw;margin-inline-start:auto}
.cover h1{font-size:6cqw}.cover .num{font-family:var(--display);font-weight:900;font-size:12cqw;color:var(--accent);line-height:.9}
.ft{border-collapse:collapse;font-size:2cqw}.ft th,.ft td{border:1px solid var(--line);padding:.6cqw 1.6cqw;text-align:center}.ft th{background:var(--chip);color:var(--accent)}
.chip{display:inline-block;background:var(--accent);color:#1b1300;border-radius:99px;padding:.3cqw 1.2cqw;font-weight:700;font-size:1.7cqw}
.nav{display:flex;gap:8px;justify-content:center}
.nav button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 18px;font:inherit;font-size:15px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);text-align:center}
svg text{font-family:var(--display);fill:var(--ink)}
.rot{transform-box:view-box;transition:transform 1.6s cubic-bezier(.6,.05,.3,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.bar .t{font-size:12px}.bar button{padding:5px 8px}}
</style>

<script>
/* ===== WOW engine v1 – Roni Modan. Content = SLIDES array; engine = everything below it. ===== */
const C={ray:'#5ec8ff',ray2:'#ff7a8a',acc:'#ffb020',ok:'#4fd18b',line:'#2b4466',ink:'#f3f6fb'};
// angle(deg, rot, opts): SVG group of an angle with vertex at (0,0); rot = direction of first ray (degrees, CCW from east)
function angle(deg,rot=0,o={}){
  const L=o.len||120,col=o.col||C.ray,r=o.arc||38,rad=a=>a*Math.PI/180;
  const x1=L*Math.cos(rad(rot)),y1=-L*Math.sin(rad(rot)),x2=L*Math.cos(rad(rot+deg)),y2=-L*Math.sin(rad(rot+deg));
  const ax1=r*Math.cos(rad(rot)),ay1=-r*Math.sin(rad(rot)),ax2=r*Math.cos(rad(rot+deg)),ay2=-r*Math.sin(rad(rot+deg));
  const lr=o.lr||r+22;const lab=o.label!=null?`<text x="${lr*Math.cos(rad(rot+deg/2))}" y="${-lr*Math.sin(rad(rot+deg/2))+7}" font-size="${o.fs||20}" text-anchor="middle" style="fill:${o.lc||C.acc}">${o.label}</text>`:'';
  return `<g ${o.attr||''}><path d="M0 0 L${ax1} ${ay1} A${r} ${r} 0 ${deg>180?1:0} 0 ${ax2} ${ay2} Z" fill="${col}" fill-opacity=".22"/>
  <line x1="0" y1="0" x2="${x1}" y2="${y1}" stroke="${col}" stroke-width="${o.w||5}" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${o.w||5}" stroke-linecap="round"/>
  <circle r="5" fill="${C.ink}"/>${lab}</g>`;
}
const svg=(vb,inner)=>`<svg viewBox="${vb}" role="img" aria-hidden="true">${inner}</svg>`;
const what=(n,t)=>`<div class="card what step"><b>מה עשינו? שלב ${n}:</b> ${t}</div>`;
const stars=n=>'★'.repeat(n);

/* ===== HELPERS+ ===== */
// ratio bar: parts=[{n:2,col,label}], unit width u
function ratioBar(parts,o={}){const u=o.u||46,h=o.h||46;let x=0,out='';
 parts.forEach(p=>{for(let i=0;i<p.n;i++){out+=`<rect x="${x}" y="0" width="${u-4}" height="${h}" rx="8" fill="${p.col}" fill-opacity=".85"/>`;x+=u;}
  if(p.label)out+=`<text x="${x-u*p.n/2-2}" y="${h+30}" font-size="22" text-anchor="middle" style="fill:${p.col}">${p.label}</text>`;x+=u*.5;});
 return `<g>${out}</g>`;}

/* ===== ENGINE ===== */
const stage=document.getElementById('stage');
stage.innerHTML=SLIDES.map((s,i)=>`<section class="slide" aria-label="שקופית ${i+1}">${s.html}</section>`).join('');
const els=[...stage.children];let cur=0;
function steps(el){return [...el.querySelectorAll('.step')];}
function rots(el){return [...el.querySelectorAll('.rot')];}
function go(i){i=Math.max(0,Math.min(els.length-1,i));els.forEach(e=>e.classList.remove('on'));const e=els[i];e.classList.add('on');
  steps(e).forEach(s=>s.classList.remove('shown'));rots(e).forEach(r=>{r.style.transform=r.dataset.init||(r.dataset.init=r.style.transform||'none');});
  cur=i;document.getElementById('cnt').textContent=`${i+1} / ${els.length}`;document.getElementById('pg').style.width=((i+1)/els.length*100)+'%';
  try{history.replaceState(null,'','#s'+(i+1))}catch(_){}}
function next(){const e=els[cur],h=steps(e).find(s=>!s.classList.contains('shown'));
  if(h){h.classList.add('shown');const idx=steps(e).indexOf(h);const r=rots(e);if(r.length&&idx===0)r.forEach(x=>x.style.transform=x.dataset.rot);return;}
  if(cur<els.length-1)go(cur+1);}
function prev(){const e=els[cur],sh=steps(e).filter(s=>s.classList.contains('shown'));if(sh.length){sh.at(-1).classList.remove('shown');return;}if(cur>0){go(cur-1);steps(els[cur]).forEach(s=>s.classList.add('shown'));}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
stage.onclick=e=>{const t=e.target.closest('[data-to]');if(t){e.stopPropagation();const k=els.findIndex(x=>x.querySelector('#'+t.dataset.to));if(k>=0)go(k);return;}next();};
addEventListener('keydown',e=>{if(['ArrowLeft',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next();}if(['ArrowRight','Backspace','PageUp'].includes(e.key)){e.preventDefault();prev();}});
document.getElementById('fs').onclick=()=>{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?.())?.catch?.(()=>{});};
const m=(location.hash||'').match(/^#s(\d+)$/);go(m?(+m[1]-1):0);
