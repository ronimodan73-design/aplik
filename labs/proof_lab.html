<!doctype html>
<html lang="he" dir="rtl">

<title>מעבדת ההוכחה: חפיפת משולשים</title>
<style>

*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:22px;min-height:100vh;display:flex;flex-direction:column}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;white-space:nowrap}
svg text{direction:ltr;unicode-bidi:bidi-override}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:28px;margin:0 0 0 auto}
button{font:inherit;font-size:19px;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;background:#312e81;color:#fff}
button.on{background:var(--gold);color:#1f2937;font-weight:700}
button.lt{background:#fff;color:var(--ink);border:2px solid var(--line)}
button:active{transform:scale(.96)}
main{flex:1;display:flex;flex-wrap:wrap;gap:14px;padding:14px;align-items:flex-start;justify-content:center}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0001;padding:14px}
#stage{flex:1 1 560px;max-width:860px}
#side{flex:1 1 300px;max-width:440px;display:flex;flex-direction:column;gap:12px}
#side:empty{display:none}
svg{width:100%;height:auto;touch-action:none;user-select:none;display:block}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.ctl b{min-width:70px}
.big{font-size:30px;font-weight:800;line-height:1.5}
.green{color:var(--green)}.purple{color:var(--purple)}.orange{color:var(--orange)}.blue{color:var(--blue)}.red{color:var(--red)}.pink{color:var(--pink)}.teal{color:var(--teal)}
.hid{filter:blur(9px)}
.chal{border:3px dashed var(--gold);background:#fffbeb}
.okbox{background:#ecfdf5;border:2px solid var(--ok);border-radius:12px;padding:8px 12px;margin-top:8px}
.badbox{background:#fef2f2;border:2px solid var(--bad);border-radius:12px;padding:8px 12px;margin-top:8px}
.tip{font-size:18px;color:var(--muted)}
footer{text-align:center;color:var(--ink);font-size:17px;font-weight:600;padding:10px}
@media print{header,.noprint{display:none!important}body{background:#fff}}
</style>

function svgPt(ev){const r=$('#sv').getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;return {x:(p.clientX-r.left)*ST.vw/r.width,y:(p.clientY-r.top)*ST.vh/r.height};}
/* גרירה: ids = מזהי אלמנטים שאפשר לגרור; fn(id, point) נקרא בכל תזוזה */

function seq(n,total,step,done){ST.busy=true;let i=0;const t=()=>{if(i<n){step(i);i++;setTimeout(t,Math.max(110,total/n));}else{ST.busy=false;done&&done();}};t();}

   {c:'BD = DB',r:SH,k:SH,m:{s:['BD'],n:0,col:'orange'},h:'האלכסון BD שייך לשני המשולשים.'},{c:'△ABD ≅ △CDB',r:'צ.ז.צ',k:'צ.ז.צ',cong:['ABD','CDB'],parts:[0,1,2]},
   {c:'AD = CB',r:CS,k:CS,m:{s:['AD','CB'],n:2,col:'purple'}}]},

   {c:'BC = DC',r:'C אמצע BD',k:MID,m:{s:['BC','DC'],n:1,col:'green'},g:1},{c:'∢ACB = ∢ECD',r:VA,k:VA,m:{a:['ACB','ECD'],n:2,col:'orange'},h:'AE ו־BD נחתכים ב־C.'},
   {c:'△ABC ≅ △EDC',r:'ז.צ.ז',k:'ז.צ.ז',cong:['ABC','EDC'],parts:[0,1,2]},{c:'AB = ED',r:CS,k:CS,m:{s:['AB','ED'],n:2,col:'purple'}}]},

   {c:'AD = AD',r:SH,k:SH,m:{s:['AD'],n:0,col:'orange'}},{c:'△ABD ≅ △ACD',r:'צ.צ.צ',k:'צ.צ.צ',cong:['ABD','ACD'],parts:[0,1,2]},
   {c:'∢BAD = ∢CAD',r:CA,k:CA,m:{a:['BAD','CAD'],n:1,col:'teal'},h:'ולכן AD גם חוצה את זווית הראש.'}]},
 {lvl:4,name:'גובה בשווה־שוקיים (צ.צ.ז)',P:{A:[380,70],B:[170,430],C:[590,430],D:[380,430]},S:['AB','AC','BC','AD'],

   {c:'△ABD ≅ △ACD',r:'צ.צ.ז',k:'צ.צ.ז',cong:['ABD','ACD'],parts:[0,1,2],h:'הזווית הישרה נמצאת מול הצלע הגדולה (היתר AB).'},{c:'BD = CD',r:CS,k:CS,m:{s:['BD','CD'],n:2,col:'pink'},h:'ולכן הגובה AD הוא גם תיכון.'}]},
 {lvl:4,name:'דלתון: הוכחה בשני שלבים',P:{A:[380,60],B:[200,230],C:[380,450],D:[560,230],E:[380,230]},S:['AB','BC','CD','DA','AC','BD'],

const POOL=[G,SH,VA,PA,MID,BIS,ALT,CS,CA];
let ex=0,step=0,classMode=false,shownG=false,shownT=false,pick2=null;
let FIG=null;const E=()=>EX[ex],pt=k=>{const [x,y]=FIG.P[k];return {x,y};};
/* ---------- שרטוט ---------- */
function segMark(a,b,n,col,o=0){let p=pt(a),q=pt(b);{const L0=Math.hypot(q.x-p.x,q.y-p.y),nx=-(q.y-p.y)/L0*o,ny=(q.x-p.x)/L0*o;p={x:p.x+nx,y:p.y+ny};q={x:q.x+nx,y:q.y+ny};}const mx=(p.x+q.x)/2,my=(p.y+q.y)/2,dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;let s=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${COL[col]}" stroke-width="7" stroke-linecap="round" opacity=".85"/>`;
 for(let i=0;i<n;i++){const o=(i-(n-1)/2)*9,cx=mx+ux*o,cy=my+uy*o;s+=`<line x1="${cx-uy*12}" y1="${cy+ux*12}" x2="${cx+uy*12}" y2="${cy-ux*12}" stroke="${COL[col]}" stroke-width="3.5"/>`;}return s;}
function angMark(p,v,q,n,col,right){const P=pt(p),V=pt(v),Q=pt(q),a1=Math.atan2(P.y-V.y,P.x-V.x),a2=Math.atan2(Q.y-V.y,Q.x-V.x);
 if(right){const r=22,u={x:Math.cos(a1),y:Math.sin(a1)},w={x:Math.cos(a2),y:Math.sin(a2)};return `<path d="M${V.x+u.x*r},${V.y+u.y*r}L${V.x+(u.x+w.x)*r},${V.y+(u.y+w.y)*r}L${V.x+w.x*r},${V.y+w.y*r}" fill="${COL[col]}" fill-opacity=".25" stroke="${COL[col]}" stroke-width="3"/>`;}
 let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;let s='';
 for(let i=0;i<Math.max(1,n);i++){const r=30+i*8,sx=V.x+r*Math.cos(a1),sy=V.y+r*Math.sin(a1),ex2=V.x+r*Math.cos(a1+d),ey=V.y+r*Math.sin(a1+d);s+=`<path d="M${sx},${sy}A${r},${r} 0 0 ${d>0?1:0} ${ex2},${ey}" fill="none" stroke="${COL[col]}" stroke-width="4"/>`;}
 const r0=30,s0={x:V.x+r0*Math.cos(a1),y:V.y+r0*Math.sin(a1)},e0={x:V.x+r0*Math.cos(a1+d),y:V.y+r0*Math.sin(a1+d)};
 return `<path d="M${V.x},${V.y}L${s0.x},${s0.y}A${r0},${r0} 0 0 ${d>0?1:0} ${e0.x},${e0.y}Z" fill="${COL[col]}" fill-opacity=".22"/>`+s;}
function markSVG(m){if(m.s)return m.s.map((s,i)=>segMark(s[0],s[1],m.n,m.col,m.o?m.o[i]:0)).join('');return m.a.map(a=>angMark(a[0],a[1],a[2],m.n||1,m.col,m.right)).join('');}
function triPath(t){return t.split('').map((k,i)=>{const p=pt(k);return (i?'L':'M')+p.x+','+p.y;}).join('')+'Z';}
function draw(){const e=E();let s='';
 if(shownT){const c=e.rows.find(r=>r.cong).cong;s+=`<path d="${triPath(c[0])}" fill="${COL.teal}" fill-opacity=".14"/><path d="${triPath(c[1])}" fill="${COL.pink}" fill-opacity=".14"/>`;}
 e.S.forEach(sg=>{const p=pt(sg[0]),q=pt(sg[1]);s+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${COL.ink}" stroke-width="3.5" stroke-linecap="round"/>`;});
 e.rows.forEach((r,i)=>{if(r.m&&((shownG&&r.g)||i<step))s+=markSVG(r.m);});

function setMode(m){const lesson=['acts','tbl','bank','corr','walk'];lesson.forEach(id=>{const e=$('#'+id);if(e)e.style.display=m==='p'?'none':'';});const pq=$('#pq');if(pq)pq.style.display=m==='p'?'':'none';
 $$('#lvs [data-m]').forEach(b=>b.classList.toggle('on',(m==='l'&&b.dataset.m==='l')||(m==='p'&&PR&&b.dataset.m==='p'+PR.lv)));
 if(m==='l'){FIG=EX[ex];draw();}}
function lvCard(){card('lvs','<div class="big" style="font-size:19px">🧭 בחרו:</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+
 '<button class="lt" data-m="l">📋 שיעור: הוכחה מלאה (★★★)</button>'+LV.map(l=>`<button class="lt" data-m="p${l.n}" title="${l.d}">🎯 ${l.t}</button>`).join('')+'<button class="lt" disabled style="opacity:.55">★★★★ חשיבה גבוהה · בשלב הבא</button></div>');
 $('#side').insertBefore($('#lvs'),$('#side').firstChild);
 $$('#lvs [data-m]').forEach(b=>b.onclick=()=>{if(ST.busy)return;const m=b.dataset.m;if(m==='l')setMode('l');else practice(+m.slice(1));});}

if(typeof LAB!=='undefined'){if(LAB.tip)$('#tip').innerHTML=LAB.tip;
 if(LAB.hide){const b=$('#bHide');b.style.display='';b.onclick=()=>{ST.hide=!ST.hide;ST.revealed=false;b.classList.toggle('on',ST.hide);LAB.refresh&&LAB.refresh();};}}
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')$('#bFs').click();});
start();
