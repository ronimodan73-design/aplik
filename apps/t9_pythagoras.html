<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משפט פיתגורס – בחנו את עצמכם</title>
<style>
:root{--a:#2563eb;--b:#ea580c;--c:#9333ea;--ok:#16a34a;--bad:#dc2626;--ink:#1e293b;--soft:#64748b;--bg:#f5f3ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#ede9fe,#e0f2fe);color:var(--ink);min-height:100vh;font-size:18px;line-height:1.55}
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#4c1d95;color:#fff}
.brand{font-weight:800;font-size:19px}
.tools button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:19px;border-radius:10px;padding:5px 10px;margin-inline-start:4px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 16px 30px}
footer{text-align:center;color:var(--soft);font-size:14px;padding:10px 0 18px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(76,29,149,.12);margin-bottom:14px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
h1{font-size:28px;margin:4px 0 8px;color:#4c1d95}
h2{font-size:22px;margin:4px 0 10px;color:#4c1d95}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 20px;font-size:18px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff;margin:6px 0 0 8px;font-family:inherit}
.btn.sec{background:#e9e5ff;color:#4c1d95}
.btn.big{font-size:21px;padding:14px 26px}
.btn:active{transform:scale(.97)}
input.ans{font-size:24px;padding:10px 12px;width:150px;border:3px solid #c4b5fd;border-radius:14px;text-align:center;direction:ltr;font-family:inherit}
input.name{font-size:20px;padding:10px;border:2px solid #c4b5fd;border-radius:12px;width:100%;max-width:320px;font-family:inherit}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-weight:600}
.ca{color:var(--a)}.cb{color:var(--b)}.cc{color:var(--c)}
.fig{max-width:100%;height:auto;direction:ltr;display:block;margin:6px 0}
.figwrap{display:flex;justify-content:flex-start}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{to{opacity:1}}
.cell{opacity:0;transition:opacity .25s}
.cell.on{opacity:1}
.prompt{font-size:20px;font-weight:600;margin:6px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid #c4b5fd;background:#faf5ff;border-radius:14px;padding:10px 16px;font-size:19px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:right}
.opt.wrong{border-color:var(--bad);background:#fef2f2;opacity:.75}
.opt.right{border-color:var(--ok);background:#f0fdf4}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:18px}
.fb.good{background:#f0fdf4;border:2px solid #86efac}
.fb.bad{background:#fff7ed;border:2px solid #fdba74}
.steps{margin-top:10px}
.step{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:7px 10px;border-right:4px solid #c4b5fd;background:#faf5ff;border-radius:8px;margin:6px 0;opacity:0;animation:fade .5s ease forwards}
.step .mline{font-size:21px}
.step .why{color:var(--soft);font-size:15px}
.step .why:before{content:"מה עשינו? "}
.bar{height:12px;background:#ede9fe;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:8px;transition:width .4s}
.stage{display:flex;gap:12px;align-items:center;cursor:pointer}
.stage .ic{font-size:30px;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#ede9fe;flex:none}
.stage .t{flex:1}
.small{font-size:15px;color:var(--soft)}
.warn{background:#fef2f2;border:2px dashed #fca5a5;border-radius:14px;padding:10px 12px;margin-top:10px}
.def{background:#eff6ff;border-radius:14px;padding:10px 12px;margin-top:10px}
.big-formula{font-size:34px;text-align:center;margin:8px 0}
.note{background:#1e293b;color:#f8fafc;border-radius:12px;padding:10px 14px;font-size:20px;direction:ltr;text-align:left;font-family:'Segoe UI',Arial}
.note div{margin:3px 0}
.chips span{display:inline-block;background:#ede9fe;border-radius:10px;padding:4px 12px;margin:3px;font-weight:700;direction:ltr}
.counter{font-size:22px;font-weight:800;text-align:center;min-height:34px}
.qtop{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;color:var(--soft)}
.badge{white-space:nowrap;background:#ede9fe;color:#4c1d95;border-radius:10px;padding:2px 10px;font-weight:700}
table.rep{width:100%;border-collapse:collapse;margin-top:8px}
table.rep td,table.rep th{border-bottom:1px solid #e5e7eb;padding:8px 4px;text-align:right}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.fly{position:fixed;font-size:30px;pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:8}
@keyframes fly{to{transform:translateY(-140px) scale(1.4);opacity:0}}
@media print{header.top,.noprint,footer .noprint,#toast{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header class="top"><div class="brand">📐 משפט פיתגורס</div>
<div class="tools noprint"><button onclick="goMap()" title="מפת המסע">🗺️</button><button onclick="fs()" title="מסך מלא">⛶</button><button onclick="printReport()" title="הדפסת דוח">🖨️</button><button onclick="share()" title="שיתוף">📤</button></div></header>
<main id="app"></main>
<footer>ערכה: רוני מודן · בית ספר שחקים</footer>
<div id="toast"></div>
<script>
"use strict";
/* ===== עזרים ===== */
const COL={a:'#2563eb',b:'#ea580c',c:'#9333ea',n:'#334155',g:'#16a34a'};
const M=s=>`<span class="m" dir="ltr">${s}</span>`;
const A=s=>`<b class="ca">${s}</b>`,B=s=>`<b class="cb">${s}</b>`,C=s=>`<b class="cc">${s}</b>`;
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const near=(v,x)=>isFinite(x)&&Math.abs(v-x)<0.06;
const eqs=r=>Number.isInteger(r)?`= ${r}`:`≈ ${r.toFixed(1)}`;
const fmt=r=>Number.isInteger(r)?String(r):r.toFixed(1);
const r1=x=>Math.round(x*10)/10;
const $=id=>document.getElementById(id);
let TIMERS=[];const later=(f,ms)=>TIMERS.push(setTimeout(f,ms));const clearT=()=>{TIMERS.forEach(clearTimeout);TIMERS=[]};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)}

/* ===== שרטוטים ===== */
function svg(W,H,inner){return `<div class="figwrap"><svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${inner}</svg></div>`}
function seg(p,q,col,w=5,delay=0,dash=false){
  if(dash) return `<path d="M${p[0]},${p[1]} L${q[0]},${q[1]}" stroke="${col}" stroke-width="${w}" stroke-dasharray="7 6" fill="none" class="fade" style="animation-delay:${delay}s"/>`;
  return `<path d="M${p[0]},${p[1]} L${q[0]},${q[1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none" pathLength="1" class="draw" style="animation-delay:${delay}s"/>`}
function tx(x,y,t,col=COL.n,size=18,delay=0.6){return `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial" class="fade" style="animation-delay:${delay}s">${t}</text>`}
const unit=(v)=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
function rmark(P,Q,R,s=12,col=COL.n){const u=unit([Q[0]-P[0],Q[1]-P[1]]),v=unit([R[0]-P[0],R[1]-P[1]]);
  const a=[P[0]+u[0]*s,P[1]+u[1]*s],b=[a[0]+v[0]*s,a[1]+v[1]*s],c=[P[0]+v[0]*s,P[1]+v[1]*s];
  return `<path d="M${a[0]},${a[1]} L${b[0]},${b[1]} L${c[0]},${c[1]}" stroke="${col}" stroke-width="2" fill="none" class="fade" style="animation-delay:.5s"/>`}
function fitPts(P,W,H,pad){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1));const ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;
  return P.map(([x,y])=>[ox+(x-x0)*s,oy+(y-y0)*s])}
/* משולש ישר-זווית: a,b ניצבים, c יתר */
function triSVG(o){let va=o.a,vb=o.b;const k=2.2;if(va/vb>k)vb=va/k;if(vb/va>k)va=vb/k;
  const t=(o.rot||0)*Math.PI/180,f=o.flip?-1:1;
  let P=[[0,0],[va,0],[0,vb]].map(([x,y])=>{x*=f;return[x*Math.cos(t)-y*Math.sin(t),-(x*Math.sin(t)+y*Math.cos(t))]});
  const W=280,H=200;P=fitPts(P,W,H,40);
  const cen=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  const cols=o.col===false?[COL.n,COL.n,COL.n]:[COL.a,COL.b,COL.c];
  const sides=[[0,1,o.la],[0,2,o.lb],[1,2,o.lc]];let s='';
  sides.forEach(([i,j,l],k)=>{s+=seg(P[i],P[j],cols[k],5,k*0.25);
    const mid=[(P[i][0]+P[j][0])/2,(P[i][1]+P[j][1])/2],d=unit([mid[0]-cen[0],mid[1]-cen[1]]);
    if(l!==undefined&&l!=='') s+=tx(mid[0]+d[0]*20,mid[1]+d[1]*20,l,cols[k],19)});
  s+=rmark(P[0],P[1],P[2]);return svg(W,H,s)}
/* ריבועים על הצלעות (צורה קבועה 3-4-5) */
const SQ={u:22,X:x=>14+(x+3)*22,Y:y=>14+(7-y)*22};
function sqPolys(){const bu=[-0.8,0.6],bn=[0.6,0.8],Bp=[4,0];
  const cellsA=[],cellsB=[],cellsC=[];
  for(let j=0;j<3;j++)for(let i=0;i<3;i++)cellsA.push([[-3+i,j],[-2+i,j],[-2+i,j+1],[-3+i,j+1]]);
  for(let j=0;j<4;j++)for(let i=0;i<4;i++)cellsB.push([[i,-1-j],[i+1,-1-j],[i+1,-j],[i,-j]]);
  const pt=(i,j)=>[Bp[0]+i*bu[0]+j*bn[0],Bp[1]+i*bu[1]+j*bn[1]];
  for(let j=0;j<5;j++)for(let i=0;i<5;i++)cellsC.push([pt(i,j),pt(i+1,j),pt(i+1,j+1),pt(i,j+1)]);
  return{cellsA,cellsB,cellsC,sqA:[[-3,0],[0,0],[0,3],[-3,3]],sqB:[[0,0],[4,0],[4,-4],[0,-4]],sqC:[[4,0],[0,3],[3,7],[7,4]]}}
const poly=(pts,fill,stroke,extra='')=>`<polygon points="${pts.map(p=>SQ.X(p[0])+','+SQ.Y(p[1])).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${extra}/>`;
function sqFig(o){const g=sqPolys();let s='';
  s+=poly(g.sqA,'#2563eb22',COL.a)+poly(g.sqB,'#ea580c22',COL.b)+poly(g.sqC,'#9333ea22',COL.c);
  if(o&&o.grid){g.cellsA.forEach((c,i)=>s+=poly(c,COL.a,'#fff',`class="cell" id="ca${i}"`));
    g.cellsB.forEach((c,i)=>s+=poly(c,COL.b,'#fff',`class="cell" id="cb${i}"`));
    g.cellsC.forEach((c,i)=>s+=poly(c,COL.c,'#fff',`class="cell" id="cc${i}"`));}
  const T=[[0,0],[4,0],[0,3]].map(p=>[SQ.X(p[0]),SQ.Y(p[1])]);
  s+=`<polygon points="${T.map(p=>p.join(',')).join(' ')}" fill="#fff" stroke="none"/>`;
  s+=seg(T[0],T[1],COL.b,5,0)+seg(T[0],T[2],COL.a,5,.2)+seg(T[1],T[2],COL.c,5,.4)+rmark(T[0],T[1],T[2]);
  if(o&&o.labels){s+=tx(SQ.X(-1.5),SQ.Y(1.5),o.labels[0],COL.a,22)+tx(SQ.X(2),SQ.Y(-2),o.labels[1],COL.b,22)+tx(SQ.X(3.5),SQ.Y(3.5),o.labels[2],COL.c,24)}
  if(o&&o.sides){s+=tx(SQ.X(0.45),SQ.Y(1.5),'3',COL.a,16)+tx(SQ.X(2),SQ.Y(0.45),'4',COL.b,16)+tx(SQ.X(1.7),SQ.Y(1.2),'5',COL.c,16)}
  return svg(248,270,s)}
function gridSquare(k,lab){const cs=Math.min(20,150/k),W=k*cs+50,H=k*cs+46;let s='';
  for(let j=0;j<k;j++)for(let i=0;i<k;i++)s+=`<rect x="${10+i*cs}" y="${10+j*cs}" width="${cs}" height="${cs}" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" class="fade" style="animation-delay:${((j*k+i)*0.025).toFixed(2)}s"/>`;
  s+=tx(10+k*cs/2,k*cs+30,lab||k,COL.a,18,.3)+tx(k*cs+30,10+k*cs/2,lab||k,COL.a,18,.3);return svg(W,H,s)}
function ladderSVG(d,h,L){const F=[70,180],T=[210,52],G=[210,180];let s='';
  s+=`<rect x="212" y="20" width="26" height="162" fill="#e2e8f0" stroke="#94a3b8"/><text x="225" y="40" font-size="20" text-anchor="middle">🪟</text>`;
  s+=`<path d="M10,182 L245,182" stroke="#94a3b8" stroke-width="3"/>`;
  s+=seg(F,G,COL.a,5,0)+seg(G,T,COL.b,5,.2);
  const dv=unit([T[0]-F[0],T[1]-F[1]]),p=[-dv[1]*6,dv[0]*6];
  s+=seg([F[0]+p[0],F[1]+p[1]],[T[0]+p[0],T[1]+p[1]],COL.c,3,.4)+seg([F[0]-p[0],F[1]-p[1]],[T[0]-p[0],T[1]-p[1]],COL.c,3,.4);
  for(let t=.12;t<.95;t+=.12){const q=[F[0]+(T[0]-F[0])*t,F[1]+(T[1]-F[1])*t];s+=seg([q[0]+p[0],q[1]+p[1]],[q[0]-p[0],q[1]-p[1]],COL.c,2,.6)}
  s+=rmark(G,F,T);s+=tx(140,198,d,COL.a)+tx(194,124,h,COL.b)+tx(118,100,L,COL.c);return svg(250,210,s)}
function rectSVG(w,h,d){let s=`<rect x="30" y="30" width="200" height="120" fill="#f8fafc" stroke="none"/>`;
  s+=seg([30,150],[230,150],COL.a,4,0)+seg([230,150],[230,30],COL.b,4,.2)+seg([30,30],[230,30],COL.n,2,.1)+seg([30,30],[30,150],COL.n,2,.1)+seg([30,150],[230,30],COL.c,4,.4);
  s+=rmark([230,150],[30,150],[230,30])+tx(130,170,w,COL.a)+tx(252,90,h,COL.b)+tx(118,78,d,COL.c);return svg(275,185,s)}
function isoSVG(side,base,hl){const T=[130,25],L=[40,170],R=[220,170],F=[130,170];let s='';
  s+=seg(L,T,COL.n,3,0)+seg(T,R,COL.c,5,.1)+seg(L,F,COL.n,3,0)+seg(F,R,COL.a,5,.2)+seg(T,F,COL.b,4,.3,true);
  s+=rmark(F,R,T)+tx(70,92,side,COL.n)+tx(192,92,side,COL.c)+tx(130,192,base,COL.n)+tx(143,108,hl,COL.b);return svg(260,205,s)}
function rhombSVG(d1,d2){const O=[130,100],Tp=[130,25],R=[230,100],Bt=[130,175],Lf=[30,100];let s='';
  s+=seg(Tp,R,COL.c,5,0)+seg(R,Bt,COL.n,3,0)+seg(Bt,Lf,COL.n,3,0)+seg(Lf,Tp,COL.n,3,0);
  s+=seg(Lf,O,COL.n,2,.2,true)+seg(O,R,COL.a,4,.2)+seg(Tp,O,COL.b,4,.3)+seg(O,Bt,COL.n,2,.3,true);
  s+=rmark(O,R,Tp)+tx(78,88,d1,COL.n,16)+tx(146,150,d2,COL.n,16)+tx(196,50,'?',COL.c,22);return svg(260,200,s)}
function twoTriSVG(p,q,sd){const ac=Math.hypot(p,q),n=[p/ac,q/ac];
  let P=[[0,p],[0,0],[q,0],[q+sd*n[0],sd*n[1]]].map(([x,y])=>[x,-y]);P=fitPts(P,280,230,32);
  const [Ap,Bp,Cp,Dp]=P,cen=[(Ap[0]+Bp[0]+Cp[0]+Dp[0])/4,(Ap[1]+Bp[1]+Cp[1]+Dp[1])/4];let s='';
  s+=seg(Ap,Bp,COL.a,4,0)+seg(Bp,Cp,COL.b,4,.1)+seg(Ap,Cp,COL.g,3,.3,true)+seg(Cp,Dp,COL.n,4,.2)+seg(Ap,Dp,COL.c,5,.4);
  s+=rmark(Bp,Ap,Cp)+rmark(Cp,Ap,Dp);
  const lab=(X,Y,t,c)=>{const m=[(X[0]+Y[0])/2,(X[1]+Y[1])/2];let d=unit([m[0]-cen[0],m[1]-cen[1]]);return tx(m[0]+d[0]*16,m[1]+d[1]*16,t,c,17)};
  s+=lab(Ap,Bp,p,COL.a)+lab(Bp,Cp,q,COL.b)+lab(Cp,Dp,sd,COL.n)+lab(Ap,Dp,'?',COL.c);
  [['A',Ap],['B',Bp],['C',Cp],['D',Dp]].forEach(([l,X])=>{const d=unit([X[0]-cen[0],X[1]-cen[1]]);s+=tx(X[0]+d[0]*14,X[1]+d[1]*14,l,'#0f172a',15,.2)});
  return svg(280,230,s)}
function gridSVG(P,Q){const c=20,o=36,X=x=>o+x*c,Y=y=>o+(10-y)*c;let s='';
  for(let i=0;i<=10;i++){s+=`<path d="M${X(i)},${Y(0)} L${X(i)},${Y(10)}" stroke="${i?'#e2e8f0':'#64748b'}" stroke-width="${i?1:2}"/><path d="M${X(0)},${Y(i)} L${X(10)},${Y(i)}" stroke="${i?'#e2e8f0':'#64748b'}" stroke-width="${i?1:2}"/>`;
    if(i%2===0){s+=`<text x="${X(i)}" y="${Y(0)+13}" font-size="11" text-anchor="middle" fill="#64748b">${i}</text>`;if(i)s+=`<text x="${X(0)-10}" y="${Y(i)+4}" font-size="11" text-anchor="middle" fill="#64748b">${i}</text>`}}
  s+=seg([X(P[0]),Y(P[1])],[X(Q[0]),Y(Q[1])],COL.c,4,.2);
  s+=`<circle cx="${X(P[0])}" cy="${Y(P[1])}" r="5" fill="#0f172a"/><circle cx="${X(Q[0])}" cy="${Y(Q[1])}" r="5" fill="#0f172a"/>`;
  const lx=(Pt,Ot)=>{const dx=Pt[0]>=Ot[0]?18:-18,dy=Pt[1]>=Ot[1]?-12:12;return[X(Pt[0])+dx,Y(Pt[1])+dy]};
  const a=lx(P,Q),b=lx(Q,P);
  s+=`<text x="${a[0]}" y="${a[1]}" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">A(${P[0]},${P[1]})</text><text x="${b[0]}" y="${b[1]}" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">B(${Q[0]},${Q[1]})</text>`;
  return svg(272,272,s)}

/* ===== יצירת שאלות ===== */
const numQ=o=>Object.assign({type:'num',tol:1e-9},o);
const mcQ=o=>Object.assign({type:'mc'},o);
const ROTS=[0,35,90,150,200,270,320];
function stepsHyp(a,b){const s=a*a+b*b,r=Math.sqrt(s);return[
 {m:`${A('a')}² + ${B('b')}² = ${C('c')}²`,w:'כותבים את משפט פיתגורס'},
 {m:`${A(a)}² + ${B(b)}² = ${C('c')}²`,w:'מציבים את הניצבים'},
 {m:`${a*a} + ${b*b} = ${C('c')}²`,w:'מחשבים כל ריבוע'},
 {m:`${s} = ${C('c')}²`,w:'מחברים'},
 {m:`${C('c')} = √${s} ${eqs(r)}`,w:'מוציאים שורש – וזה היתר'}]}
function stepsLeg(c,b){const d=c*c-b*b,r=Math.sqrt(d);return[

 window._ex=ex.steps;window._exi=0;nextEx()}
function nextEx(){const s=window._ex;if(window._exi<s.length){$('exs').insertAdjacentHTML('beforeend',stepHTML(s[window._exi++],0))}
 if(window._exi>=s.length){const b=$('nxs');b.textContent='מתחילים לתרגל! 💪';b.onclick=startStage}}
function startStage(){Q=gen(cur);qi=0;firstOK=0;Q.forEach(q=>{q.att=0;q.done=false});renderQ()}
function renderQ(){const q=Q[qi],g=STAGES[cur];
 show(`<div class="card"><div class="qtop"><span class="badge">${g.lvl} ${g.name}</span><span style="white-space:nowrap">שאלה ${qi+1} מתוך ${Q.length} · ✅ ${firstOK}</span></div>
 <div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
 <div class="prompt">${q.p}</div>${q.fig||''}
 <div id="ansArea">${q.type==='num'?`<input class="ans" id="inp" inputmode="decimal" autocomplete="off" placeholder="?"> <button class="btn" onclick="check($('inp').value)">בדיקה ✔</button>`:
  `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="check(${i})">${o.t}</button>`).join('')}</div>`}</div>
 <div id="fb"></div></div>`);
 const inp=$('inp');if(inp){inp.focus({preventScroll:true});inp.onkeydown=e=>{if(e.key==='Enter')check(inp.value)}}}
const PRAISE=['מעולה! 🌟','בדיוק! 💪','אלופים! 🎯','יפה מאוד! ✨','ככה עושים את זה! 🚀'];
function check(v){const q=Q[qi];if(q.done)return;let res;
 if(q.type==='num'){const x=parseFloat(String(v).replace(',','.'));if(isNaN(x)){toast('כתבו מספר 🙂');return}
  res=Math.abs(x-q.ans)<=q.tol?{ok:true}:((q.diag&&q.diag(x))||{tag:q.tag,msg:'עדיין לא. בדקו את החישוב שוב – אפשר להיעזר ברמז.'})}
 else{const o=q.opts[v];if(o.ok){res={ok:true};$('o'+v).classList.add('right')}else{res={tag:o.tag||q.tag,msg:o.msg||'לא בדיוק. נסו שוב.'};$('o'+v).classList.add('wrong');$('o'+v).disabled=true}}
 q.att++;const fb=$('fb');
 if(res.ok){q.done=true;if(q.att===1)firstOK++;fly();
  fb.innerHTML=`<div class="fb good"><b>${q.att===1?pick(PRAISE):'הצלחתם בניסיון השני – ככה לומדים! 💡'}</b><div class="steps">${q.steps.map(stepHTML).join('')}</div></div>${nextBtn()}`}
 else{S.tags[res.tag]=(S.tags[res.tag]||0)+1;save();
  if(q.att>=2){q.done=true;
   fb.innerHTML=`<div class="fb bad">${res.msg}<br><b>הנה הפתרון המלא${q.type==='num'?` – התשובה: ${M(fmt(q.ans))}`:''}:</b><div class="steps">${q.steps.map(stepHTML).join('')}</div></div>${nextBtn()}`;
   if(q.type==='mc')q.opts.forEach((o,i)=>{if(o.ok)$('o'+i).classList.add('right')})}
  else fb.innerHTML=`<div class="fb bad">${res.msg}<br><b>💡 רמז:</b>${stepHTML(q.hint||q.steps[0],0)}<b>נסו שוב!</b></div>`}
 fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function nextBtn(){return `<button class="btn big" onclick="nextQ()">${qi+1<Q.length?'לשאלה הבאה ←':'סיום השלב 🏁'}</button>`}
function nextQ(){qi++;if(qi<Q.length)renderQ();else endStage()}
function endStage(){const b=S.best[cur];S.best[cur]=b==null?firstOK:Math.max(b,firstOK);save();
 const msg=firstOK>=18?'שליטה מלאה! 🏆':firstOK>=14?'שולטים בשלב! 🎉':firstOK>=10?'בדרך הנכונה! כדאי לתרגל שוב.':'כל ניסיון מחזק את המוח 💪 – נסו את השלב שוב.';
 for(let i=0;i<6;i++)setTimeout(fly,i*150);
 show(`<div class="card"><h2>${STAGES[cur].ic} סיימתם את שלב ${STAGES[cur].lvl}!</h2><div class="big-formula">${firstOK}/20 ${starsOf(firstOK)}</div><p class="prompt">${msg}</p>
 ${cur<4?`<button class="btn big" onclick="intro(${cur+1})">לשלב הבא: ${STAGES[cur+1].lvl} ${STAGES[cur+1].name} ←</button>`:`<button class="btn big" onclick="summary()">📊 לסיכום שלי</button>`}
 <button class="btn sec" onclick="intro(${cur})">לתרגל שוב את השלב</button><button class="btn sec" onclick="goMap()">למפה</button></div>`)}
function fly(){const e=document.createElement('div');e.className='fly';e.textContent=pick(['⭐','🌟','✨','💜']);e.style.left=(20+Math.random()*60)+'%';e.style.top=(55+Math.random()*25)+'%';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function levelText(){let lv=-1;S.best.forEach((b,i)=>{if(b!=null&&b>=14)lv=i});return lv<0?'עוד לא נקבעה – סיימו לפחות שלב אחד עם ⭐⭐':`${STAGES[lv].lvl} ${STAGES[lv].name}`}
function summary(){saveName();const tags=Object.entries(S.tags).sort((a,b)=>b[1]-a[1]).slice(0,3);
 show(`<div class="card"><h2>📊 בחנו את עצמכם – הסיכום</h2><p><b>שם:</b> ${S.name||'__________'} &nbsp; <b>תאריך:</b> ${new Date().toLocaleDateString('he-IL')}</p>
 <table class="rep"><tr><th>שלב</th><th>ציון</th><th></th></tr>${STAGES.map((g,i)=>`<tr><td>${g.lvl} ${g.name}</td><td>${S.best[i]==null?'—':S.best[i]+'/20'}</td><td>${starsOf(S.best[i])}</td></tr>`).join('')}</table>
 <p class="prompt">הרמה שלי: ${levelText()}</p>
 ${tags.length?`<div class="def"><b>מה כדאי לחזק:</b><ul>${tags.map(([k])=>`<li>${TIPS[k]||k}</li>`).join('')}</ul></div>`:''}
 <div class="noprint"><button class="btn" onclick="window.print()">🖨️ הדפסה</button><button class="btn sec" onclick="goMap()">למפה</button><button class="btn sec" onclick="resetAll()">התחלה מחדש</button></div></div>`)}
function resetAll(){if(confirm('למחוק את כל ההתקדמות ולהתחיל מחדש?')){S={name:S.name,best:[null,null,null,null,null],tags:{}};save();goMap()}}
function printReport(){summary();setTimeout(()=>window.print(),400)}
function fs(){const d=document;if(!d.fullscreenElement){(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||function(){}).call(d.documentElement)}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}}
function share(){const u=location.href;if(navigator.share&&!u.startsWith('file')){navigator.share({title:'משפט פיתגורס – בחנו את עצמכם',url:u}).catch(()=>{})}
 else if(u.startsWith('file'))toast('כדי לשתף – שלחו את הקישור מהדרייב בוואטסאפ');
 else{try{navigator.clipboard.writeText(u);toast('הקישור הועתק ✔')}catch(e){toast(u)}}}
startScreen();
</script>
</body>
</html>
