<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Segoe UI",sans-serif;background:linear-gradient(160deg,#1e1b4b,#4c1d95);min-height:100vh;color:#1f2937;padding:14px}
.wrap{max-width:640px;margin:0 auto}
h1{color:#fff;text-align:center;font-size:26px;margin:6px 0 2px}
.sub{color:#ddd6fe;text-align:center;font-size:15px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:bold;margin:10px 0;cursor:pointer;color:#fff;text-align:right}
.b1{background:#7c3aed}.b2{background:#0891b2}.b3{background:#db2777}.b4{background:#16a34a}
.btn small{display:block;font-weight:normal;font-size:14px;opacity:.9;margin-top:3px}
.f{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:bold;color:#6d28d9;font-family:Arial,sans-serif;white-space:nowrap}
.f sub{font-size:.7em}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:8px;font-size:15px}
.back{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar div{height:100%;background:#facc15;transition:width .3s}
.tag{display:inline-block;background:#ede9fe;color:#6d28d9;border-radius:8px;padding:3px 9px;font-size:13px;margin-bottom:8px}
.lvl{float:left;font-size:13px;color:#b45309}
.q{font-size:20px;font-weight:bold;line-height:1.5;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;background:#f5f3ff;border:2px solid #ddd6fe;border-radius:12px;padding:13px;font-size:17px;margin:8px 0;cursor:pointer;color:#1f2937}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fee2e2;border-color:#dc2626}
.exp{border-radius:12px;padding:14px;margin-top:12px;font-size:16px;line-height:1.65}
.exp.ok{background:#f0fdf4;border-right:6px solid #16a34a}
.exp.no{background:#fef2f2;border-right:6px solid #dc2626}
.exp b.h{display:block;font-size:17px;margin-bottom:4px}
.next{background:#7c3aed;color:#fff;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:bold;width:100%;margin-top:12px;cursor:pointer}
.sum h3{color:#6d28d9;font-size:19px;margin-bottom:6px}
.sum p{font-size:16px;line-height:1.65;margin-bottom:6px}
.tip{background:#fef9c3;border-radius:10px;padding:9px 11px;font-size:15px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{border:1px solid #ddd6fe;padding:7px;text-align:center}
th{background:#ede9fe}
.flash{text-align:center;padding:30px 10px}
.flash .big{font-size:56px;font-weight:bold;color:#6d28d9;direction:ltr}
.flash .heb{font-size:32px;font-weight:bold}
.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;direction:ltr;margin:8px 0}
.pt div{height:16px;border-radius:2px}
.m{background:#93c5fd}.n{background:#fca5a5}.g{background:#fde68a}
.score{font-size:46px;font-weight:bold;text-align:center;color:#6d28d9}
.foot{color:#c4b5fd;text-align:center;font-size:13px;margin-top:10px}
.rev{border-bottom:1px solid #eee;padding:10px 0;font-size:15px;line-height:1.6}
.f sup{font-size:.7em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.flash .ans{font-size:24px;font-weight:bold;color:#6d28d9;line-height:1.5}
.flash .heb{font-size:22px;line-height:1.5}
svg{display:block;max-width:100%;margin:6px auto}
.qr{background:#fff;border:2px dashed #c4b5fd;border-radius:10px;padding:9px;margin:6px 0 10px;font-size:15px}
.exp{font-size:17px;line-height:1.8}
.k{display:inline-block;background:#374151;color:#fff;border-radius:6px;padding:1px 7px;margin:2px 1px;font-size:.9em;box-shadow:0 2px 0 #111;font-weight:bold}
.calc{background:#ecfeff;border-right:5px solid #0891b2;border-radius:10px;padding:8px 10px;margin-top:10px;line-height:2}
</style>

<script>
var D={title:"מעגל ועיגול",icon:"⭕",flashSub:"מושג / נוסחה ← תשובה"};
D.svg={c:'<svg viewBox="0 0 220 170" width="220"><circle cx="110" cy="85" r="70" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><circle cx="110" cy="85" r="3" fill="#111"/><line x1="110" y1="85" x2="180" y2="85" stroke="#db2777" stroke-width="3"/><text x="140" y="80" fill="#db2777" font-size="14" font-weight="bold">r</text><line x1="40" y1="85" x2="110" y2="85" stroke="#0891b2" stroke-width="3" stroke-dasharray="5 3"/><line x1="55" y1="43" x2="165" y2="43" stroke="#16a34a" stroke-width="3"/><text x="104" y="38" fill="#16a34a" font-size="12">מיתר</text><text x="118" y="104" font-size="12">מרכז</text><text x="70" y="102" fill="#0891b2" font-size="12" text-anchor="middle">קוטר</text></svg>'};
D.summary=[
["⭕ מעגל או עיגול?","<p><b>מעגל</b> = הקו (ה\"גבול\"). ל<b>מעגל</b> יש <b>היקף</b>.</p><p><b>עיגול</b> = כל השטח שבתוך המעגל. ל<b>עיגול</b> יש <b>שטח</b>.</p>"+D.svg.c+"<p><b>רדיוס r</b> – מהמרכז לנקודה על המעגל. <b>קוטר d</b> – מיתר שעובר במרכז, [[d = 2r]]. <b>מיתר</b> – קטע בין שתי נקודות על המעגל (הקוטר הוא המיתר הארוך ביותר). <b>קשת</b> – חלק מהמעגל.</p>"],
["🥧 מהו π?","<p>בכל מעגל, ההיקף חלקי הקוטר הוא אותו מספר: [[π ≈ 3.14]]</p><div class='tip'>💡 ההיקף ארוך מקצת יותר מפי 3 מהקוטר.</div>"],
["📏 נוסחאות","<p><b>היקף מעגל:</b> [[P = 2πr = πd]]</p><p><b>שטח עיגול:</b> [[S = πr^2]]</p><p>[[r = 10]]: היקף [[20π ≈ 62.8]], שטח [[100π ≈ 314]]</p><div class='tip'>⚠️ קיבלת קוטר? חלק ב-2 לפני חישוב השטח! [[d = 8]] ← [[r = 4]] ← [[S = 16π]].</div>"],
["🧩 חלקים של עיגול","<p><b>חצי עיגול:</b> שטח [[{{πr^2|2}}]]. היקף הצורה הסגורה = חצי היקף + קוטר: [[πr + 2r]].</p><p><b>רבע עיגול:</b> שטח [[{{πr^2|4}}]].</p><p><b>טבעת:</b> שטח גדול פחות שטח קטן: [[πR^2 − πr^2]].</p>"],
["📈 מה קורה כשמגדילים?","<p>רדיוס פי 2 ← היקף <b>פי 2</b>, שטח <b>פי 4</b>.</p><p>רדיוס פי 3 ← היקף פי 3, שטח פי 9.</p>"]
];
D.tips=[
["🔤 מעגל או עיגול",["<b>עי</b>גול = <b>עו</b>גה – יש מה לאכול בפנים ← שטח.","<b>מע</b>גל = <b>מע</b>טפת – רק הקו ← היקף."]],
["📐 לזכור את הנוסחאות",["שטח ← יש ריבוע ([[r^2]]) – כי שטח נמדד ביחידות <b>רבועות</b> (סמ\"ר).","היקף ← אורך, בלי ריבוע (ס\"מ).","היקף: [[2πr]] – \"שני פאי ער\". שטח: [[πr^2]] – \"פאי ער בריבוע\"."]],
["⚠️ מלכודות",["קוטר ≠ רדיוס! תמיד בדוק מה נתון.","היקף של חצי עיגול – לא לשכוח את הקוטר הישר!","\"השאר את התשובה ב-π\" ← כותבים [[9π]] ולא מחשבים."]],
["🔁 מהיקף לשטח",["נתון היקף [[12π]] ← [[2r = 12]] ← [[r = 6]] ← שטח [[36π]].","נתון שטח [[49π]] ← [[r^2 = 49]] ← [[r = 7]] ← היקף [[14π]].","תמיד דרך <b>הרדיוס</b>!"]]
];
D.flash=[["למה יש שטח – למעגל או לעיגול?","לעיגול"],["נוסחת היקף מעגל","[[2πr]]"],["נוסחת שטח עיגול","[[πr^2]]"],["מהו π?","היקף חלקי קוטר ≈ 3.14"],["המיתר הארוך ביותר","הקוטר"],["[[r = 3]] – שטח","[[9π]]"],["[[d = 8]] – שטח","[[16π]]"],["היקף [[12π]] – שטח","[[36π]]"],["שטח [[49π]] – היקף","[[14π]]"],["רדיוס פי 2 ← שטח פי?","פי 4"],["שטח טבעת R=5, r=3","[[16π]]"],["חצי עיגול [[r = 4]] – שטח","[[8π]]"]];
var R=[
["מושגים",1,"למה יש <b>שטח</b>?",["לעיגול","למעגל","לקשת","למיתר"],"🍪 חושבים על עוגייה:<br>• <b>עיגול</b> = כל העוגייה – יש מה לאכול ← יש <b>שטח</b>.<br>• <b>מעגל</b> = רק הקו שמסביב ← יש רק <b>אורך</b> (היקף).<br>✅ לעיגול"],
["מושגים",1,"רדיוס של מעגל הוא 5 ס\"מ. מה הקוטר?",["10 ס\"מ","2.5 ס\"מ","5 ס\"מ","15.7 ס\"מ"],"📏 קוטר = שני רדיוסים בקו ישר (מצד לצד, דרך המרכז).<br>1️⃣ [[5 + 5 = 10]]<br>✅ 10 ס\"מ"],
["מושגים",1,"מהו המיתר הארוך ביותר במעגל?",["הקוטר","הרדיוס","הקשת","אין מיתר ארוך ביותר"],"📏 מיתר = קו ישר בין שתי נקודות על המעגל.<br>1️⃣ ככל שהמיתר קרוב יותר למרכז – הוא ארוך יותר.<br>2️⃣ הכי ארוך = עובר בדיוק במרכז.<br>✅ הקוטר"],
["מושגים",1,"מהו π?",["היחס בין היקף המעגל לקוטר שלו – אותו מספר בכל מעגל","בדיוק 3.14","רדיוס חלקי קוטר","שטח חלקי רדיוס"],"🧵 ניסוי: לוקחים חוט באורך ההיקף של כל עיגול ומודדים כמה קטרים נכנסים בו.<br>1️⃣ תמיד יוצא קצת יותר מ-3: [[3.14...]]<br>2️⃣ למספר הזה קוראים π.<br>✅ היקף חלקי קוטר – אותו מספר בכל מעגל."],
["מושגים",3,"נקודה נמצאת במרחק 7 ס\"מ ממרכז מעגל שהרדיוס שלו 5 ס\"מ. איפה הנקודה?",["מחוץ למעגל","בתוך המעגל","על המעגל","במרכז"],"📏 כל נקודה <b>על</b> המעגל רחוקה מהמרכז בדיוק 5 (הרדיוס).<br>1️⃣ הנקודה רחוקה 7.<br>2️⃣ 7 יותר מ-5 ← היא רחוקה יותר מהקו.<br>✅ מחוץ למעגל"],
["היקף",1,"מהי הנוסחה להיקף מעגל?",["[[2πr]]","[[πr^2]]","[[2r]]","[[πr]]"],"📏 היקף = האורך מסביב.<br>✅ [[P = 2πr]] (\"שני פאי ער\")<br>💡 אין ריבוע – כי זה אורך, לא שטח."],
["היקף",1,"רדיוס 10 ס\"מ. מה ההיקף? ([[π = 3.14]])",["62.8 ס\"מ","31.4 ס\"מ","314 ס\"מ","20 ס\"מ"],"1️⃣ נוסחה: [[P = 2 · π · r]]<br>2️⃣ מציבים: [[2 · 3.14 · 10]]<br>3️⃣ [[2 · 10 = 20]], ואז [[20 · 3.14 = 62.8]]<br>✅ 62.8 ס\"מ"],
["היקף",1,"קוטר 6 ס\"מ. מה ההיקף? (השאר ב-π)",["[[6π]]","[[12π]]","[[3π]]","[[9π]]"],"👀 נתון <b>קוטר</b> ← משתמשים ב-[[P = π · d]].<br>1️⃣ [[π · 6 = 6π]]<br>✅ [[6π]]<br>💡 \"השאר ב-π\" = לא מחשבים 3.14, רק כותבים π."],
["היקף",2,"היקף מעגל 31.4 ס\"מ. מה הרדיוס? ([[π = 3.14]])",["5 ס\"מ","10 ס\"מ","3.14 ס\"מ","15.7 ס\"מ"],"👀 היקף = π · קוטר ← קוטר = היקף : π.<br>1️⃣ [[31.4 : 3.14 = 10]] ← זה הקוטר!<br>2️⃣ רדיוס = חצי קוטר: [[10 : 2 = 5]]<br>✅ 5 ס\"מ"],
["היקף",2,"גלגל שקוטרו 50 ס\"מ עשה 100 סיבובים. כמה מטרים עבר? ([[π = 3.14]])",["157 מ'","15.7 מ'","314 מ'","50 מ'"],"🚲 סיבוב אחד של גלגל = הגלגל \"מתגלגל\" אורך של היקף אחד.<br>1️⃣ היקף: [[3.14 · 50 = 157]] ס\"מ<br>2️⃣ 100 סיבובים: [[157 · 100 = 15700]] ס\"מ<br>3️⃣ מחלקים ב-100 ← 157 מטר<br>✅ 157 מ'"],
["היקף",2,"מחוג הדקות בשעון באורך 10 ס\"מ. כמה עובר קצה המחוג בשעה? ([[π = 3.14]])",["62.8 ס\"מ","31.4 ס\"מ","314 ס\"מ","10 ס\"מ"],"🕐 בשעה מחוג הדקות עושה סיבוב שלם.<br>1️⃣ הקצה מצייר מעגל ברדיוס 10.<br>2️⃣ היקף: [[2 · 3.14 · 10 = 62.8]]<br>✅ 62.8 ס\"מ"],
["היקף",3,"ובאותו שעון – כמה עובר קצה מחוג הדקות ב-15 דקות?",["[[5π]] ס\"מ","[[20π]] ס\"מ","[[15π]] ס\"מ","[[10π]] ס\"מ"],"🕐 15 דקות = רבע שעה = רבע סיבוב.<br>1️⃣ סיבוב שלם: [[20π]]<br>2️⃣ רבע: [[20π : 4 = 5π]]<br>✅ [[5π]] (בערך 15.7 ס\"מ)"],
["היקף",2,"מה אורך הקשת של חצי מעגל עם רדיוס 7? (השאר ב-π)",["[[7π]]","[[14π]]","[[49π]]","[[7π + 14]]"],"🌈 חצי מעגל = חצי מההיקף.<br>1️⃣ היקף שלם: [[2 · π · 7 = 14π]]<br>2️⃣ חצי: [[7π]]<br>✅ [[7π]]"],
["היקף",3,"מהו ההיקף של צורת חצי עיגול סגורה עם רדיוס 10? ([[π = 3.14]])",["51.4","31.4","62.8","41.4"],"🌈 צורה סגורה = הקשת <b>ועוד</b> הקו הישר.<br>1️⃣ קשת = חצי היקף: [[3.14 · 10 = 31.4]]<br>2️⃣ קו ישר = קוטר: 20<br>3️⃣ [[31.4 + 20 = 51.4]]<br>✅ 51.4<br>⚠️ לא לשכוח את הקו הישר!"],
["שטח",1,"מהי הנוסחה לשטח עיגול?",["[[πr^2]]","[[2πr]]","[[πd]]","[[2πr^2]]"],"🟪 שטח = כמה משבצות בפנים ← יש ריבוע.<br>✅ [[S = πr^2]] (\"פאי ער בריבוע\")"],
["שטח",1,"רדיוס 10 ס\"מ. מה השטח? ([[π = 3.14]])",["314 סמ\"ר","62.8 סמ\"ר","31.4 סמ\"ר","100 סמ\"ר"],"1️⃣ נוסחה: [[S = π · r · r]]<br>2️⃣ [[10 · 10 = 100]]<br>3️⃣ [[100 · 3.14 = 314]]<br>✅ 314 סמ\"ר"],
["שטח",1,"רדיוס 3. מה השטח? (השאר ב-π)",["[[9π]]","[[6π]]","[[3π]]","[[18π]]"],"1️⃣ [[r · r = 3 · 3 = 9]]<br>2️⃣ [[S = 9π]]<br>✅ [[9π]]<br>⚠️ [[6π]] זה ההיקף ([[2 · 3]]), לא השטח."],
["שטח",2,"קוטר 8. מה השטח? (השאר ב-π)",["[[16π]]","[[64π]]","[[8π]]","[[32π]]"],"👀 נתון <b>קוטר</b>! קודם מוצאים רדיוס.<br>1️⃣ [[8 : 2 = 4]]<br>2️⃣ [[4 · 4 = 16]]<br>✅ [[16π]]<br>⚠️ [[64π]] = שכחו לחלק ב-2."],
["שטח",2,"שטח עיגול 78.5 סמ\"ר. מה הרדיוס? ([[π = 3.14]])",["5 ס\"מ","25 ס\"מ","12.5 ס\"מ","10 ס\"מ"],"👀 הולכים אחורה בנוסחה.<br>1️⃣ [[78.5 : 3.14 = 25]] ← זה [[r · r]]<br>2️⃣ איזה מספר כפול עצמו = 25? ← 5<br>✅ 5 ס\"מ"],
["שטח",2,"מה שטח חצי עיגול עם רדיוס 4? (השאר ב-π)",["[[8π]]","[[16π]]","[[4π]]","[[2π]]"],"1️⃣ עיגול שלם: [[4 · 4 = 16]] ← [[16π]]<br>2️⃣ חצי: [[16π : 2 = 8π]]<br>✅ [[8π]]"],
["שטח",2,"מה שטח רבע עיגול עם רדיוס 6? (השאר ב-π)",["[[9π]]","[[36π]]","[[3π]]","[[12π]]"],"1️⃣ עיגול שלם: [[6 · 6 = 36]] ← [[36π]]<br>2️⃣ רבע: [[36π : 4 = 9π]]<br>✅ [[9π]]"],
["שטח",2,"מה שטח הטבעת בין מעגל ברדיוס 5 למעגל ברדיוס 3 (מאותו מרכז)?",["[[16π]]","[[4π]]","[[2π]]","[[34π]]"],"🍩 טבעת = עיגול גדול פחות החור.<br>1️⃣ גדול: [[5 · 5 = 25]] ← [[25π]]<br>2️⃣ חור: [[3 · 3 = 9]] ← [[9π]]<br>3️⃣ [[25π − 9π = 16π]]<br>✅ [[16π]]"],

["השוואות",2,"הרדיוס הוכפל פי 2. מה קורה לשטח?",["גדל פי 4","גדל פי 2","גדל פי 8","לא משתנה"],"🟩 נצייר בריבועים: רדיוס 1 ← [[1 · 1 = 1]]. רדיוס 2 ← [[2 · 2 = 4]].<br>✅ השטח גדל <b>פי 4</b>.<br>💡 כי הרדיוס מוכפל פעמיים בנוסחה."],
["השוואות",2,"הרדיוס הוכפל פי 2. מה קורה להיקף?",["גדל פי 2","גדל פי 4","גדל פי π","גדל ב-2 ס\"מ"],"📏 בהיקף הרדיוס מופיע פעם אחת בלבד.<br>1️⃣ רדיוס 1 ← [[2π]]. רדיוס 2 ← [[4π]].<br>✅ גדל <b>פי 2</b>."],

["השוואות",3,"מה ארוך יותר: היקף מעגל ברדיוס 7, או היקף ריבוע שצלעו 11? ([[π = 3.14]])",["היקף הריבוע","היקף המעגל","שווים בדיוק","אי אפשר לדעת"],"1️⃣ מעגל: [[2 · 3.14 · 7 = 43.96]]<br>2️⃣ ריבוע: [[4 · 11 = 44]]<br>3️⃣ 44 קצת יותר מ-43.96<br>✅ היקף הריבוע"],

D.Q=R.map(function(r){return {t:r[0],l:r[1],q:r[2],o:r[3],e:r[4],d:r[5]};});
if(!D.svg)D.svg={};


function F(s){
 s=s.replace(/((?:🔵|🔴)[🔵🔴 ]*(?:🔵|🔴))|(🔵|🔴)/gu,function(m){return '<span dir="ltr" style="unicode-bidi:isolate">'+m+'</span>';});
 return s.replace(/\[\[(.+?)\]\]/g,function(_,x){
  x=x.replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  x=x.replace(/⌈(.+?)⌉/g,'<span class="k">$1</span>');
  return '<span class="f">'+x.replace(/\^(\d+)/g,'<sup>$1</sup>')+'</span>';});}
var Q=D.Q,SYM=D.flash,TIPS=D.tips;
var app=document.getElementById('app'),list=[],i=0,good=0,wrong=[],mode='';
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
function stars(l){return '★'.repeat(l)+'☆'.repeat(3-l);}
function home(){
 app.innerHTML='<h1>'+D.icon+' '+D.title+'</h1><div class="sub">הכנה למבחן – כיתה ח׳ א1</div>'+
 '<button class="btn b1" onclick="summary()">📘 סיכום מהיר<small>כל החומר בדף אחד – קרא קודם</small></button>'+
 '<button class="btn" style="background:#ea580c" onclick="tips()">⚡ טיפים לזכירה מהירה<small>טריקים ומלכודות נפוצות</small></button>'+
 '<button class="btn b2" onclick="flash()">🔤 כרטיסיות<small>'+D.flashSub+'</small></button>'+
 '<button class="btn b3" onclick="start(Q,\'all\')">🧠 כל השאלות לפי סדר הנושאים<small>'+Q.length+' שאלות, הסבר מפורט אחרי כל תשובה</small></button>'+
 '<button class="btn b4" onclick="start(sh(Q).slice(0,15),\'test\')">🏁 מבחן דמה<small>15 שאלות אקראיות + ציון</small></button>';
 window.scrollTo(0,0);
}
function summary(){
 var h='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>סיכום</span></div>';
 D.summary.forEach(function(c){h+='<div class="card sum"><h3>'+c[0]+'</h3>'+F(c[1])+'</div>';});
 app.innerHTML=h+'<button class="btn b4" onclick="start(Q,\'all\')">✅ קראתי – לשאלות!</button>';window.scrollTo(0,0);
}
function tips(){
 var h='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>טיפים לזכירה</span></div>';
 TIPS.forEach(function(b){h+='<div class="card sum"><h3>'+b[0]+'</h3>';b[1].forEach(function(t){h+='<p>• '+F(t)+'</p>';});h+='</div>';});
 app.innerHTML=h+'<button class="btn b4" onclick="start(sh(Q).slice(0,15),\'test\')">🏁 עכשיו למבחן דמה!</button>';window.scrollTo(0,0);
}
var fl=[],fi=0;
function flash(){fl=sh(SYM);fi=0;showFlash(false);}
function showFlash(open){
 var s=fl[fi];
 app.innerHTML='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>'+(fi+1)+' / '+fl.length+'</span></div>'+
 '<div class="card flash"><div class="heb">'+F(s[0])+'</div><div style="margin:14px 0;color:#888">מה התשובה?</div>'+
 (open?'<div class="ans">'+F(s[1])+'</div>':'<button class="next" onclick="showFlash(true)">👀 הצג תשובה</button>')+'</div>'+
 (open?'<button class="next" onclick="'+(fi<fl.length-1?'fi++;showFlash(false)':'home()')+'">'+(fi<fl.length-1?'הבא ←':'סיום ✔')+'</button>':'');
}
function start(arr,m){list=arr;mode=m;i=0;good=0;wrong=[];ask();}
function ask(){
 var x=list[i],opts=sh(x.o.map(function(t,k){return {t:t,c:k===0};}));
 var h='<div class="top"><button class="back" onclick="home()">→ תפריט</button><span>שאלה '+(i+1)+' / '+list.length+' · ✅ '+good+'</span></div>'+
 '<div class="bar"><div style="width:'+(i/list.length*100)+'%"></div></div>'+
 '<div class="card"><span class="tag">'+x.t+'</span><span class="lvl">'+stars(x.l)+'</span><div class="q">'+F(x.q)+'</div>'+(x.d?D.svg[x.d]:'');
 opts.forEach(function(o,k){h+='<button class="opt" data-c="'+(o.c?1:0)+'" onclick="pick(this)">'+F(o.t)+'</button>';});
 app.innerHTML=h+'<div id="ex"></div></div>';
 window.scrollTo(0,0);
}
function pick(b){
 var all=document.querySelectorAll('.opt'),ok=b.dataset.c==='1',x=list[i];
 all.forEach(function(o){o.disabled=true;if(o.dataset.c==='1')o.classList.add('ok');});
 if(ok)good++;else{b.classList.add('no');wrong.push(x);}
 document.getElementById('ex').innerHTML='<div class="exp '+(ok?'ok':'no')+'"><b class="h">'+(ok?'✅ נכון! בואו נבין למה:':'❌ לא נורא! בואו נפתור ביחד:')+'</b><div class="qr">📝 <b>התרגיל:</b> '+F(x.q)+'<br>🎯 <b>התשובה הנכונה:</b> '+F(x.o[0])+'</div><b>👣 הפתרון צעד אחר צעד:</b><br>'+F(x.e)+'</div>'+
 '<button class="next" onclick="nxt()">'+(i<list.length-1?'לשאלה הבאה ←':'לתוצאות 🏁')+'</button>';
}
function nxt(){i++;if(i<list.length)ask();else end();}
function end(){
 var p=Math.round(good/list.length*100),msg=p>=90?'🏆 מוכן למבחן!':p>=70?'💪 טוב מאוד! עבור על הטעויות':'📘 כדאי לקרוא שוב את הסיכום ולתרגל את הטעויות';
 var h='<div class="card"><div class="score">'+p+'</div><div style="text-align:center;font-size:18px;margin:6px 0 14px">'+good+' מתוך '+list.length+' · '+msg+'</div>';
 if(wrong.length){
  h+='<button class="next" style="background:#db2777" onclick="start(wrong.slice(),\'w\')">🔁 תרגל שוב רק את '+wrong.length+' הטעויות</button><h3 style="margin-top:14px;color:#6d28d9">איפה טעיתי:</h3>';
  wrong.forEach(function(w){h+='<div class="rev">📝 '+F(w.q)+(w.d?D.svg[w.d]:'')+'<br>🎯 <b>'+F(w.o[0])+'</b><div class="exp ok" style="margin-top:6px">'+F(w.e)+'</div></div>';});
 }
 app.innerHTML=h+'<button class="next" onclick="home()">חזרה לתפריט</button></div>';
 window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});}
</script>
