 ['lu','מה מסמל הענן השחור הכבד?',['שמחה','מלחמה, סכנה ופחד','מזג אוויר','ילדות'],1,'שחור וכבד = האיום של המלחמה.'],
 ['lu','"קול ענות" לקוח מ...',['סיפור יוסף','ספר שמות — משה ויהושע ליד המחנה','תהלים','שיר השירים'],1,'ספר שמות, חטא העגל: שומעים קול ולא יודעים אם זה ניצחון או תבוסה.'],
 ['lu','מה המשמעות של "קול ענות"?',['קול שמחה בלבד','קול לא ברור — לא יודעים אם זה ניצחון או תבוסה','קול שופר בחג','קול של ילד'],1,'זה בדיוק העניין: הקול לא ברור → אי־ודאות.'],
 ['lu','למה המשוררת חוזרת שוב ושוב על הפזמון?',['כדי למלא מקום','כדי להדגיש את המשאלה — כמו תפילה','כי שכחה','כדי שיתחרז'],1,'חזרה = הדגשה + תפילה.'],
 ['lu','המשאלה ב"לו יהי" היא...',['אישית בלבד','כללית — בשם כל העם (גוף רבים)','אין בו משאלה','משאלה לכסף'],1,'גוף רבים: "נבקש" → בשם כולם.'],
 ['mi','המשאלה ב"משאלות" היא...',['רק אישית','רק כללית','גם אישית וגם כללית','אין משאלה'],2,'"אני רוצה" = אישית; שלום ואחווה לכולם = כללית.'],
 ['mi','"תמרון" של פרחים לבנים הוא דוגמה ל...',['מטאפורה','חריזה','רמז מקראי','ניגוד בלבד'],0,'מעבירים מושג צבאי (תמרון) לעולם הפרחים = מטאפורה.'],
 ['mi','מה המשוררת רוצה בעזרת מטאפורת התמרון?',['עוד תרגילים צבאיים','להחליף חיילים בפרחים — מלחמה בשלום','לגדל גינה','לתאר את הסתיו בלבד'],1,'במקום שורות חיילים — שורות פרחים.'],
 ['mi','מה מאפיין שיר מודרני?',['חריזה קבועה','שורות קצרות, בלי חריזה, משקל חופשי','שפה תנ"כית בלבד','בתים שווים תמיד'],1,'שיר מודרני = חופשי.'],
 ['mi','איך המבנה של "משאלות" מתאים לתוכן?',['הוא רשימה — כמו רשימת משאלות שזורמת בחופשיות','הוא מחורז כמו שיר ילדים','אין קשר','הוא בנוי כמו מכתב רשמי'],0,'רשימה = הרבה משאלות; חופשי = אותנטי.'],
 ['mi','"כתונת פסים" רומזת לסיפור של...',['משה','יוסף','דוד','אברהם'],1,'יעקב נתן ליוסף כתונת פסים.'],
 ['mi','מה מסמלת כתונת הפסים בסיפור המקראי?',['אהבה של אב — שעוררה קנאה ושנאה בין האחים','עושר','מלחמה','חג'],0,'אהבה ← קנאה ← האחים מכרו את יוסף.'],
 ['x','באיזה שיר הדוברת מדברת בגוף יחיד ("אני רוצה")?',['לו יהי','משאלות'],1,'"משאלות" — גוף יחיד.'],
 ['x','באיזה שיר מופיע רמז מספר שמות?',['לו יהי','משאלות'],0,'"קול ענות" — ב"לו יהי".'],
 ['x','באיזה שיר מופיע רמז לסיפור יוסף?',['לו יהי','משאלות'],1,'"כתונת פסים" — ב"משאלות".'],
 ['x','מה משותף לשני השירים?',['שניהם שירי שמחה','שניהם נכתבו בשנת מלחמה ומבטאים משאלה לשלום','שניהם מחורזים','שניהם על טבע בלבד'],1,'1967 ו־1973 — שתי מלחמות, אותה משאלה: שלום.'],
 ['x','מהי "תשובה מלאה" בשאלת ספרות?',['רק ציטוט','טענה + הוכחה מהשיר + הסבר','רק כן או לא','שורה אחת'],1,'הנוסחה: טענה → הוכחה → הסבר.']
];
const norm=s=>s.replace(/[֑-ׇ"'״׳,.\-–!?()]/g,'').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ץ/g,'צ').replace(/ף/g,'פ').replace(/ך/g,'כ').replace(/\s+/g,' ');
const $=s=>document.querySelector(s),A=$('#app');
let ST={};try{ST=JSON.parse(localStorage.getItem('lit_st')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('lit_st',JSON.stringify(ST))}catch(e){}};
const toTop=()=>window.scrollTo(0,0);
function home(){
 const done=Q.filter((q,i)=>ST['q'+i]===3).length;
 A.innerHTML=`<div class="card"><h1>📚 מבחן מחר? בוא נסגור את זה!</h1>
 <p class="muted">שני שירים: <b style="color:var(--a)">לו יהי</b> ו<b style="color:var(--b)">משאלות</b>. עבור לפי הסדר, מ־1 עד 5.</p>
 <div class="bar"><i style="width:${done*10}%"></i></div><p class="muted">שאלות חזרה שסגרת במלואן: ${done} / 10</p></div>
 <button class="btn s" onclick="formula()">1️⃣ איך כותבים תשובה מלאה (30 שניות)</button>
 <button class="btn a" onclick="facts('lu')">2️⃣ כרטיס סיכום: לו יהי</button>
 <button class="btn b" onclick="facts('mi')">3️⃣ כרטיס סיכום: משאלות</button>
 <button class="btn g" onclick="quiz()">4️⃣ שאלון מהיר — 20 שאלות</button>
 <button class="btn a" onclick="list()">5️⃣ שאלות החזרה — כותבים ומקבלים בדיקה</button>`;toTop();}
function formula(){A.innerHTML=`<div class="card"><h2>✍️ הנוסחה לתשובה מלאה</h2>
 <div class="formula"><span style="background:var(--a)">1. טענה</span><span style="background:var(--yel)">2. הוכחה מהשיר</span><span style="background:var(--b)">3. הסבר</span></div>
 <p><b>טענה</b> — עונים ישר על השאלה ("המשאלה כללית").<br><b>הוכחה</b> — מילה או ביטוי מהשיר ("גוף רבים: נבקש").<br><b>הסבר</b> — מה זה אומר ולמה ("היא מבקשת בשם כל העם").</p>
 <p class="muted">⚠️ שאלה עם א׳ ב׳ ג׳ — עונים על <b>כל</b> הסעיפים. "הוכח מן הכתוב" = חייבים מילה מהשיר.</p></div>
 <div class="card"><h2>⚫⚪ ניגוד — בתמונה</h2><div class="vs"><div style="background:#fff;color:#14122b">⛵ מפרש לבן<br><small>תקווה</small></div><div style="align-self:center">מול</div><div style="background:#000;border:1px solid #555">☁️ ענן שחור<br><small>מלחמה</small></div></div></div>
 <button class="btn a" onclick="home()">חזרה לתפריט</button>`;toTop();}
function facts(p){const o=P[p];let i=0;
 const show=()=>{const f=o.facts[i];A.innerHTML=`<div class="card"><span class="tag" style="background:${o.color}">${o.name}</span> <span class="muted">${i+1}/${o.facts.length}</span>
 <h2 style="margin-top:12px">${f[0]}</h2><p style="font-size:1.1em">${f[1]}</p></div>
 <div class="row"><button class="btn s" id="pv">→ הקודם</button><button class="btn a" id="nx">${i<o.facts.length-1?'הבא ←':'סיימתי ✓'}</button></div>
 <button class="btn s" onclick="home()">לתפריט</button>`;
 $('#pv').onclick=()=>{if(i>0){i--;show()}};$('#nx').onclick=()=>{if(i<o.facts.length-1){i++;show()}else home()};toTop();};show();}
function quiz(){let order=MC.map((_,i)=>i).sort(()=>Math.random()-.5),n=0,sc=0,miss=[];
 const show=()=>{if(n>=order.length)return res();const q=MC[order[n]];const nm=q[0]==='x'?'שני השירים':P[q[0]].name,c=q[0]==='x'?'var(--yel)':P[q[0]].color;
 A.innerHTML=`<div class="card"><span class="tag" style="background:${c}">${nm}</span> <span class="muted">${n+1}/${order.length} · ✅ ${sc}</span><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <h2>${q[1]}</h2>${q[2].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<div id="fb"></div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  document.querySelectorAll('.opt')[q[3]].classList.add('right');
  if(j===q[3]){sc++;$('#fb').innerHTML=`<p style="color:var(--ok)"><b>נכון! 🎉</b> ${q[4]}</p>`}else{b.classList.add('wrong');miss.push(q);$('#fb').innerHTML=`<p style="color:var(--bad)"><b>לא בדיוק —</b> <span style="color:var(--txt)">${q[4]}</span></p>`}
  $('#fb').innerHTML+=`<button class="btn a" id="nx">הבא ←</button>`;$('#nx').onclick=()=>{n++;show()};});toTop();};
 const res=()=>{A.innerHTML=`<div class="card"><h2>התוצאה שלך</h2><div class="big">${sc} / ${order.length}</div>
 <p>${sc>=18?'מעולה! אתה מוכן 💪 עכשיו תתרגל לכתוב תשובות מלאות (שלב 4).':sc>=13?'טוב מאוד! עבור על מה שפספסת:':'בוא נחזק — קרא שוב את כרטיסי הסיכום ונסה שוב.'}</p>
 ${miss.map(q=>`<div class="pt no"><b>${q[1]}</b><br>${q[2][q[3]]}</div>`).join('')}</div>
 <button class="btn g" onclick="quiz()">עוד סיבוב</button><button class="btn s" onclick="home()">לתפריט</button>`;toTop();};show();}
function list(){A.innerHTML=`<div class="card"><h2>✍️ שאלות החזרה</h2><p class="muted">כתוב תשובה → "בדוק אותי" → האפליקציה בודקת אם יש בה את 3 הדברים שהמורה מחפשת.</p></div>`+
 Q.map((q,i)=>{const s=ST['q'+i];return`<button class="btn ${q.p==='lu'?'a':'b'}" onclick="ask(${i})">${s===3?'✅':s!=null?'🟡':'⬜'} ${P[q.p].name} — שאלה ${q.p==='lu'?i+1:i-4}</button>`}).join('')+
 `<button class="btn s" onclick="home()">לתפריט</button>`;toTop();}
function ask(i){const q=Q[i];A.innerHTML=`<div class="card"><span class="tag" style="background:${P[q.p].color}">${P[q.p].name}</span>
 <h2 style="margin-top:10px">${q.t}</h2><textarea id="ans" placeholder="כתוב כאן את התשובה שלך...">${ST['a'+i]||''}</textarea>
 <button class="btn g" id="chk">🔍 בדוק אותי</button><button class="btn s" id="hint">💡 רמז</button><div id="out"></div></div>
 <div class="row"><button class="btn s" onclick="list()">לרשימה</button>${i<Q.length-1?`<button class="btn a" onclick="ask(${i+1})">לשאלה הבאה ←</button>`:''}</div>`;
 let h=0;$('#hint').onclick=()=>{$('#out').innerHTML=`<div class="pt">💡 ${q.k[h%3][2]}</div>`;h++;};
 $('#chk').onclick=()=>{const v=$('#ans').value;ST['a'+i]=v;const t=norm(v);
  if(t.trim().length<8){$('#out').innerHTML='<div class="pt no">כתוב קודם תשובה — לפחות משפט אחד 🙂</div>';return;}
  let got=0;const rows=q.k.map(k=>{const ok=k[1].some(w=>t.includes(norm(w)));if(ok)got++;return`<div class="pt ${ok?'ok':'no'}">${ok?'✅':'❌'} ${k[0]}${ok?'':`<br><small class="muted">${k[2]}</small>`}</div>`}).join('');
  ST['q'+i]=Math.max(ST['q'+i]||0,got);save();
  $('#out').innerHTML=`<p><b>${got===3?'🏆 תשובה מלאה!':got===2?'כמעט! חסר דבר אחד:':'חסרים כמה דברים — הנה מה לחזק:'}</b> (${got}/3)</p>${rows}
  <div class="model"><b>📗 תשובה לדוגמה:</b><br>${q.m}</div><p class="muted">שים לב: הבדיקה מחפשת מילות מפתח. תשווה בעצמך לתשובה לדוגמה.</p>`;};toTop();}
/* offline */
const ONSITE=/github\.io$/.test(location.hostname)&&location.hostname!=='htmlpreview.github.io';
if(ONSITE&&'serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});}
home();
</script>
