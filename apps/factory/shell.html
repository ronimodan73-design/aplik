<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/*ID*/.webmanifest"><link rel="apple-touch-icon" href="icon-/*ID*/-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="/*SHORT*/"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f1b2d">
<title>/*TITLE*/</title>
<style>
/*FONTS*/
:root{--bg:#0f1b2d;--card:#13233a;--chip:#1c3352;--ink:#f3f6fb;--muted:#9fb3cc;--line:#2b4466;--acc:#ffb020;--blue:#5ec8ff;--red:#ff7a8a;--ok:#4fd18b;--pu:#c084fc}
*{box-sizing:border-box}html,body{margin:0;height:100%}html{-webkit-text-size-adjust:100%}button,input{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:"Heebo","Rubik",Arial,sans-serif;direction:rtl}
.app{max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.top b{color:var(--ink);font-family:Rubik;font-size:17px;flex:1}
.top button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-family:Rubik;font-weight:900;font-size:32px;margin:0 0 6px}
h2{font-family:Rubik;font-size:23px;margin:0 0 10px}
p{font-size:19px;line-height:1.55;margin:0}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.levels button{all:unset;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.levels button:hover,.levels button:focus-visible{border-color:var(--acc)}
.levels .st{color:var(--acc);font-size:22px}.levels .t{font-family:Rubik;font-weight:700;font-size:19px}.levels .d{color:var(--muted);font-size:15px}.levels .best{color:var(--ok);font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.hero button{all:unset;cursor:pointer;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:var(--chip)}
.hero button:focus-visible{outline:3px solid var(--acc)}
.hero .ic{font-size:30px}.hero b{display:block;font-family:Rubik;font-size:21px}.hero small{color:var(--muted);font-size:15px}
#go-recap{border-color:var(--ok)!important}#go-test{border-color:var(--pu)!important}
.last{margin-top:10px;color:var(--muted);font-size:15px}
.inst{margin-top:14px;background:#5ec8ff1f;border:2px dashed var(--blue);border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.55}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:15px}
.kind{display:inline-block;background:var(--chip);color:var(--acc);border-radius:99px;padding:3px 12px;font-size:14px;font-family:Rubik;margin-bottom:8px}
.qtext{font-size:22px;line-height:1.6}
.m{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-family:Rubik;font-weight:700}
.dia{display:flex;justify-content:center;margin:4px 0 8px}.dia svg{width:100%;max-width:400px;height:auto;direction:ltr}
.inputs{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;align-items:flex-end}
.inp{display:flex;flex-direction:column;gap:4px;font-size:17px;font-weight:700}
.inp input{width:120px;font:700 26px Rubik;text-align:center;padding:8px;border-radius:10px;border:2px solid var(--line);background:#0b1626;color:var(--ink);direction:ltr}
.inputs.tpl{direction:ltr;justify-content:center;align-items:center;gap:5px;font:800 28px Rubik;flex-wrap:nowrap}.tin{width:68px;font:700 26px Rubik;text-align:center;padding:8px;border-radius:10px;border:3px solid var(--line);background:#0b1626;color:var(--ink);direction:ltr}.tin.bad{border-color:var(--red)!important;background:#ff7a8a22}.tin.good{border-color:var(--ok)!important}
.inp input.bad{border-color:var(--red)}.inp input.good{border-color:var(--ok)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choices .lab{font-size:16px;color:var(--muted);font-weight:700}
.choices button{all:unset;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:12px 16px;font-size:19px;min-height:24px}
.choices button.sel{border-color:var(--acc);background:#ffb0201f}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:700 19px Rubik;border:none;border-radius:12px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.main{background:var(--acc);color:#1b1300}.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:19px;line-height:1.5;display:none}
.fb.ok{display:block;background:#4fd18b22;border:2px solid var(--ok)}
.fb.no{display:block;background:#ff7a8a1c;border:2px solid var(--red)}
.fb.saved{display:block;background:#c084fc22;border:2px solid var(--pu)}
.fb b{font-family:Rubik}
.sol{margin-top:16px;display:none}.sol.on{display:block}
.sline{font-size:20px;text-align:center;margin:8px 0;opacity:0;transition:opacity .5s;line-height:1.5}.sline.show{opacity:1}
.rule{background:var(--acc);color:#1b1300;border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;margin-top:10px}
.big{font-family:Rubik;font-weight:900;font-size:60px;color:var(--acc);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:auto}.foot b{color:var(--ink)}
.pop{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.88)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.rv{opacity:0;animation:rv .55s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.drawl{stroke-dasharray:600;stroke-dashoffset:600;animation:dl 1.1s ease-out forwards;animation-delay:var(--d,0s)}@keyframes dl{to{stroke-dashoffset:0}}
.slide{animation:sl 1.6s ease-in-out forwards;animation-delay:var(--d,0s)}@keyframes sl{to{transform:translate(var(--tx),var(--ty))}}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0;text-align:center}
.say{font-size:20px;line-height:1.55}
.what{background:var(--chip);border-right:5px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:18px;text-align:right;line-height:1.5}.what b{color:var(--ok)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.x{color:var(--red);font-weight:900}.v{color:var(--ok);font-weight:900}
.lvrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:17px}
.lvrow .nm{width:150px;flex:none}.lvrow .bar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}.lvrow .bar i{display:block;height:100%}
.lvrow .sc{width:46px;text-align:left;font-family:Rubik;font-weight:700;direction:ltr}
.verdict{border-radius:14px;padding:14px 16px;font-size:20px;font-weight:700;margin:12px 0;line-height:1.5}
.miss{background:var(--chip);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px;line-height:1.5}.miss .k{color:var(--acc);font-family:Rubik;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:#4fd18b1f;border:1px solid var(--ok);color:var(--ok);border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700}
.nameIn{font:700 22px Rubik;padding:10px;border-radius:10px;border:2px solid var(--line);background:#0b1626;color:var(--ink);width:100%;max-width:340px;text-align:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px}.legend span{border-radius:99px;padding:3px 10px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.drawl{opacity:1;stroke-dashoffset:0}}
@media (max-width:560px){.tin{width:56px!important;font-size:22px!important;padding:6px 2px!important}.inputs.tpl{font-size:24px;gap:3px}.levels,.hero{grid-template-columns:1fr}.qtext{font-size:20px}.card{padding:14px}.btns .btn{padding:11px 16px;font-size:18px}.lvrow .nm{width:112px;font-size:15px}.say{font-size:18px}.inp input{width:104px}}
</style></head>
<body>
<div class="app">
 <div class="top"><b>/*TOPIC*/</b><span id="sc"></span><button id="home" type="button">תפריט</button></div>
 <div id="view"></div>
 <div class="foot"><b>ערכה: רוני מודן · שחקים</b> · © כל הזכויות שמורות</div>
</div>
<script>
const $=s=>document.querySelector(s);const V=$('#view');
const M=t=>`<span class="m">${t}</span>`;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const OR='#ffb020',BL='#5ec8ff',GR='#4fd18b',PU='#c084fc',RD='#ff7a8a';
const store={get:k=>{try{return JSON.parse(localStorage.getItem(APP.key+'_'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(APP.key+'_'+k,JSON.stringify(v))}catch(e){}}};
const deg='°';
const f=n=>(+n).toFixed(1);
/*CONTENT*/
const TL=['★ ידע','★★ יישום','★★★ הבנה ונימוק','★★★★ חשיבה ואוריינות'],TCOL=[GR,BL,OR,PU];
const TOTAL=20;let S={};
/* ===== screens ===== */
function menu(){$('#sc').textContent='';const tl=store.get('test');
 V.innerHTML=`<div class="card"><h1>${APP.topic}</h1><p>${APP.sub} טעיתם? לוחצים על <b>"הראו לי"</b>.</p>
 <div class="hero"><button type="button" id="go-recap"><span class="ic">▶</span><span><b>מתחילים כאן</b><small>הסבר מונפש + חימום קל</small></span></button><button type="button" id="go-test"><span class="ic">📝</span><span><b>מבחן מדורג</b><small>16 שאלות · 4 רמות · דוח אישי</small></span></button></div>
 ${tl?`<div class="last">המבחן האחרון שלי: ציון ${Math.round(tl.sc/16*100)} · ${tl.d}</div>`:''}
 ${INST?`<div class="inst">📲 <b>לעבוד גם בלי אינטרנט:</b> לחצו על כפתור השיתוף ⬆️ בתחתית ספארי, ואז על <b>"הוספה למסך הבית"</b>. פותחים מהאייקון פעם אחת כשיש אינטרנט, ומאז זה עובד גם בלי.</div>`:''}
 <h2 style="margin-top:18px">תרגול בשלבים</h2>
 <div class="levels">${LEVELS.map((l,i)=>{const b=store.get('best'+i);return `<button type="button" data-l="${i}"><span class="st">${'★'.repeat(l.n)}</span><span class="t">${l.t}</span><span class="d">${l.d}</span>${b!=null?`<span class="best">השיא שלי: ${b} מתוך ${TOTAL}</span>`:''}</button>`}).join('')}</div></div>`;
 $('#go-recap').onclick=()=>recap(0);$('#go-test').onclick=testIntro;V.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l));}
function start(l){S={mode:'lv',l,i:0,score:0,n:TOTAL,streak:0};next();}
function next(){if(S.q)S.i++;if(S.i>=S.n)return S.mode==='test'?endTest():S.mode==='warm'?endWarm():end();S.q=S.list?S.list[S.i]():LEVELS[S.l].g();S.tries=0;S.done=false;draw();}
function lab(){return S.mode==='warm'?'חימום':S.mode==='test'?'מבחן מדורג · '+TL[S.lv[S.i]]:'★'.repeat(LEVELS[S.l].n)+' '+LEVELS[S.l].t;}
function qDia(q,hl){return typeof QDIA==='function'?QDIA(q,hl):(q.dia?q.dia(hl):'');}
function draw(){const q=S.q,T=S.mode==='test';$('#sc').textContent=T?'':`נקודות: ${S.score}`;
 V.innerHTML=`<div class="meta"><span>${lab()} · שאלה ${S.i+1} מתוך ${S.n}</span><span>${!T&&S.streak>=3?'🔥 '+S.streak+' ברצף':''}</span></div><div class="prog"><i style="width:${S.i/S.n*100}%"></i></div>
 <div class="card pop"><span class="kind">${q.kind}</span>${(()=>{const d=qDia(q,false);return d?`<div class="dia">${d}</div>`:''})()}<div class="qtext">${q.text}</div>
 ${q.ans&&q.tpl?`<div class="inputs tpl">${q.tpl.split('[]').map((p,i,arr)=>`<span class="tp">${p}</span>`+(i<arr.length-1?`<input class="tin" inputmode="${q.ans[i].neg?'text':'decimal'}" data-i="${i}" aria-label="${q.ans[i].label}" style="border-color:${q.ans[i].col}">`:'')).join('')}</div>`:''}
 ${q.ans&&!q.tpl?`<div class="inputs">${q.ans.map((a,i)=>`<label class="inp"><span style="color:${a.col}">${a.label==='x ='||a.lt?M(a.label):a.label}</span><input inputmode="${a.neg?'text':'decimal'}" data-i="${i}" aria-label="${a.label}"></label>`).join('')}</div>`:''}
 ${q.choice?`<div class="choices">${q.choiceLab?`<span class="lab">${q.choiceLab}</span>`:''}${q.choice.map((c,i)=>`<button type="button" data-c="${i}">${c}</button>`).join('')}</div>`:''}
 <div class="btns"><button class="btn main" id="chk" type="button">${T?'שמירת התשובה':'בדיקה'}</button>${T?'':'<button class="btn sec" id="show" type="button">הראו לי</button>'}</div>
 <div class="fb" id="fb" role="status" aria-live="polite"></div><div class="sol" id="sol"></div></div>`;
 S.sel=-1;V.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(S.done&&T)return;V.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.sel=+b.dataset.c;});
 V.querySelectorAll('input').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')$('#chk').click();});
 $('#chk').onclick=()=>{if(S.done)return next();check(q);};if($('#show'))$('#show').onclick=()=>solve(q);}
function check(q){const fb=$('#fb');const ins=[...V.querySelectorAll('input')];
 const vals=ins.map(x=>parseFloat(x.value.replace(',','.').replace(/[−–]/g,'-').replace(/\s/g,'')));
 if(q.ans&&vals.some(isNaN)){fb.className='fb no';fb.innerHTML='מלאו את כל התשובות.';return;}
 if(q.choice&&S.sel<0){fb.className='fb no';fb.innerHTML=q.ans?'בחרו גם נימוק.':'בחרו תשובה.';return;}
 const okIn=!q.ans||vals.every((v,i)=>v===q.ans[i].val),okCh=!q.choice||S.sel===q.correct,ok=okIn&&okCh;
 if(S.mode==='test'){ins.forEach(x=>x.disabled=true);S.res.push({lv:S.lv[S.i],ok,q});S.done=true;fb.className='fb saved pop';
  fb.innerHTML='<b>התשובה נשמרה ✓</b> '+(S.i+1<S.n?'ממשיכים בנחת.':'זאת הייתה השאלה האחרונה!');$('#chk').textContent=S.i+1<S.n?'לשאלה הבאה':'לדוח שלי';return;}
 S.tries++;ins.forEach((x,i)=>{x.classList.remove('good','bad');x.classList.add(vals[i]===q.ans[i].val?'good':'bad');});
 if(ok){if(S.tries===1){S.score++;S.streak=(S.streak||0)+1;}S.done=true;fb.className='fb ok pop';fb.innerHTML=`<b>${pick(['מעולה!','בדיוק!','יפה מאוד!','נכון!'])}</b> ${S.tries===1?'הצלחתם בניסיון הראשון.':'תיקנתם, וזה מה שחשוב.'}`;$('#chk').textContent='לשאלה הבאה';if($('#show'))$('#show').style.display='none';return;}
 S.streak=0;let msg=q.diag?q.diag({vals,sel:S.sel}):null;
 if(okIn&&!okCh&&q.ans)msg='החישוב נכון! אבל <b>הנימוק</b> לא מתאים. רמז: '+q.rule;
 if(!msg)msg=S.mode==='warm'?'רמז: '+q.rule:'רמז: '+q.rule;
 fb.className='fb no pop';fb.innerHTML=`<b>כמעט!</b> ${msg} ${S.tries>=2?'<br>לחצו על <b>"הראו לי"</b> כדי לראות את הפתרון.':' נסו שוב.'}`;}
function solve(q){const sol=$('#sol');sol.className='sol on';
 sol.innerHTML=`${(()=>{const d=qDia(q,true);return d?`<div class="dia">${d}</div>`:''})()}${q.lines.map(l=>`<div class="sline">${l}</div>`).join('')}<div class="rule sline">${q.rule}</div>`;
 [...sol.querySelectorAll('.sline')].forEach((el,i)=>setTimeout(()=>el.classList.add('show'),500+i*650));
 S.tries=Math.max(S.tries,2);S.streak=0;if(!S.done){S.done=true;$('#chk').textContent='לשאלה הבאה';$('#show').style.display='none';}}
function end(){$('#sc').textContent=`נקודות: ${S.score}`;const best=store.get('best'+S.l);if(best==null||S.score>best)store.set('best'+S.l,S.score);
 const st=S.score>=18?3:S.score>=14?2:S.score>=10?1:0;
 V.innerHTML=`<div class="card pop" style="text-align:center"><h2>סיימתם: ${'★'.repeat(LEVELS[S.l].n)} ${LEVELS[S.l].t}</h2><div class="big">${S.score} / ${TOTAL}</div>
 <p>${['ממשיכים להתאמן: חוזרים להסבר ב"מתחילים כאן".','התחלה טובה! עוד סבב אחד ותהיו שם.','יפה מאוד! אתם שולטים בזה.','מצוין! אפשר לעלות שלב.'][st]}</p>
 <div class="btns" style="justify-content:center"><button class="btn main" id="again" type="button">עוד סבב</button>${S.l<3?'<button class="btn sec" id="up" type="button">לשלב הבא</button>':''}<button class="btn sec" id="m" type="button">תפריט</button></div></div>`;
 $('#again').onclick=()=>start(S.l);if($('#up'))$('#up').onclick=()=>start(S.l+1);$('#m').onclick=menu;}
function recap(n){$('#sc').textContent='';const N=RECAP.length,c=RECAP[n],d0=c.d!=null?c.d:1.4;
 V.innerHTML=`<div class="card pop"><span class="kind">הסבר ${n+1} מתוך ${N}</span><h2>${c.h}</h2><div class="stage">${c.svg?`<div class="dia">${c.svg()}</div>`:''}
 ${c.says.map((t,k)=>`<div class="say rv" style="--d:${d0+k*.9}s">${t}</div>`).join('')}</div>
 ${c.def?`<div class="what rv" style="border-right-color:var(--blue);--d:${d0+c.says.length*.9}s">${c.def}</div>`:''}
 <div class="what rv" style="--d:${d0+c.says.length*.9+.6}s"><b>מה עשינו?</b> ${c.what}</div>
 <div class="btns"><button class="btn main" id="nx" type="button">${n<N-1?'הבא':'לחימום ←'}</button><button class="btn sec" id="rp" type="button">שוב ↻</button>${n?'<button class="btn sec" id="pv" type="button">הקודם</button>':''}</div>
 <div class="dots">${RECAP.map((_,j)=>`<i class="${j===n?'on':''}"></i>`).join('')}</div></div>`;
 $('#nx').onclick=()=>n<N-1?recap(n+1):warm();$('#rp').onclick=()=>recap(n);if($('#pv'))$('#pv').onclick=()=>recap(n-1);window.scrollTo(0,0);}
function warm(){S={mode:'warm',i:0,score:0,n:WARM.length,list:WARM};next();}
function endWarm(){$('#sc').textContent='';
 V.innerHTML=`<div class="card pop" style="text-align:center"><h2>החימום הסתיים!</h2><div class="big">${S.score} / ${S.n}</div>
 <p>${S.score>=6?'הידיים חמות. אפשר להתחיל את שלב ★':'כדאי לעבור שוב על ההסבר, ואז עוד חימום אחד.'}</p>
 <div class="btns" style="justify-content:center"><button class="btn main" id="a1" type="button">לשלב ★</button><button class="btn sec" id="a2" type="button">עוד חימום</button><button class="btn sec" id="a3" type="button">להסבר</button></div></div>`;
 $('#a1').onclick=()=>start(0);$('#a2').onclick=warm;$('#a3').onclick=()=>recap(0);}
/* ===== graded test ===== */
function testIntro(){$('#sc').textContent='';const nm=store.get('name')||'';
 V.innerHTML=`<div class="card pop"><h1>מבחן מדורג</h1><p>16 שאלות · 4 רמות חשיבה. מתחילים קל ועולים לאט. אין זמן, אין לחץ.<br>במבחן אין "הראו לי". בסוף מקבלים <b>דוח אישי</b>: ציון, מה אני יודע/ת, מה חסר, ומה לעשות.</p>
 <div class="levels" style="grid-template-columns:1fr;gap:8px">${TL.map((t,i)=>`<div style="border-right:5px solid ${TCOL[i]};padding:6px 10px;background:var(--chip);border-radius:10px">${t} · 4 שאלות</div>`).join('')}</div>
 <p style="margin-top:16px">השם שלי:</p><input class="nameIn" id="nm" value="${nm.replace(/"/g,'')}" aria-label="השם שלי">
 <div class="btns"><button class="btn main" id="go" type="button">מתחילים</button><button class="btn sec" id="bk" type="button">חזרה</button></div></div>`;
 $('#bk').onclick=menu;$('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#nm').focus();$('#nm').style.borderColor='var(--red)';return;}store.set('name',n);
  const list=[],lv=[];TEST.forEach((g,i)=>shuf(g).forEach(fn=>{list.push(fn);lv.push(i);}));S={mode:'test',i:0,score:0,n:16,list,lv,res:[],name:n};next();};}
function ansText(q){const a=[];if(q.ans)a.push(q.ans.map(x=>x.label==='x ='?M('x = '+x.val):(x.lt?M(x.label):x.label)+' '+M(x.val+(x.unit!=null?(x.unit&&x.unit!=='°'?' '+x.unit:x.unit):deg))).join(' · '));if(q.choice)a.push(q.choice[q.correct]);return a.join(' · ');}
function endTest(){const per=[0,0,0,0];S.res.forEach(r=>{if(r.ok)per[r.lv]++;});const sc=per.reduce((a,b)=>a+b,0),grade=Math.round(sc/16*100);
 const up=sc>=14&&per.every(x=>x>=3),weak=per.findIndex(x=>x<3),d=new Date().toLocaleDateString('he-IL');store.set('test',{sc,d,per});
 const v=up?{c:'var(--ok)',t:'מוכן/ה לעלות הקבצה! 🎉 שלטת בכל ארבע הרמות.'}:sc>=10?{c:'var(--acc)',t:`קרוב מאוד! כדי לעלות הקבצה צריך לחזק את רמה ${TL[weak]}.`}:{c:'var(--red)',t:'בונים יסודות: עוברים על ההסבר, מתרגלים ★ ו־★★, ואז מנסים שוב. כל ניסיון מקרב!'};
 const u1={},u2={},miss=S.res.filter(r=>!r.ok&&!u1[r.q.kind]&&(u1[r.q.kind]=1)),good=S.res.filter(r=>r.ok&&!u2[r.q.kind]&&(u2[r.q.kind]=1));
 const todo=[];if(per[0]<3)todo.push('לעבור שוב על <b>ההסבר המונפש והחימום</b> (כפתור "מתחילים כאן").');
 per.forEach((x,i)=>{if(x<3)todo.push(`לתרגל את שלב <b>${TL[i]}</b> (20 שאלות). טעיתם? לוחצים על "הראו לי".`);});
 todo.push(up?'לנסות שוב את שלב ★★★★, כדי להישאר חזקים.':'אחרי התרגול: <b>מבחן חוזר</b>, ולבדוק אם הציון עלה.');
 V.innerHTML=`<div class="card pop"><h2>הדוח של ${S.name.replace(/[<>&"]/g,'')}</h2><div class="meta"><span>מבחן מדורג · ${APP.topic}</span><span>${d}</span></div>
 <div class="big">ציון: ${grade}</div><div style="text-align:center;color:var(--muted)">${sc} תשובות נכונות מתוך 16</div>
 ${TL.map((t,i)=>`<div class="lvrow"><span class="nm">${t}</span><span class="bar"><i style="width:${per[i]/4*100}%;background:${TCOL[i]}"></i></span><span class="sc">${per[i]}/4</span></div>`).join('')}
 <div class="verdict" style="border:2px solid ${v.c};background:color-mix(in srgb,${v.c} 14%,transparent)">${v.t}</div>
 ${good.length?`<h2>✅ מה אני כבר יודע/ת</h2><div class="chips">${good.map(r=>`<span>${TL[r.lv].split(' ')[0]} ${r.q.kind}</span>`).join('')}</div>`:''}
 ${miss.length?`<h2 style="margin-top:14px">🔧 מה עוד חסר לי</h2>${miss.map(r=>`<div class="miss"><span class="k">${TL[r.lv].split(' ')[0]} ${r.q.kind}</span><br>${r.q.rule}<br><span style="color:var(--muted)">התשובה הנכונה הייתה: ${ansText(r.q)}</span></div>`).join('')}`:'<p>אין טעויות בכלל. כל הכבוד!</p>'}
 <h2 style="margin-top:14px">👣 מה לעשות עכשיו</h2>${todo.map((t,i)=>`<div class="miss"><b style="color:var(--acc)">${i+1}.</b> ${t}</div>`).join('')}
 <p style="margin-top:12px;color:var(--muted)">📸 צלמו את המסך ושלחו למורה.</p>
 <div class="btns"><button class="btn main" id="pr" type="button">${up?'לתפריט':'לתרגול מה שחסר'}</button><button class="btn sec" id="ag" type="button">מבחן חוזר</button></div>
 <div class="foot" style="margin-top:10px"><b>ערכה: רוני מודן · שחקים</b></div></div>`;
 $('#ag').onclick=testIntro;$('#pr').onclick=()=>up?menu():start(Math.max(0,weak));window.scrollTo(0,0);}
/* ===== offline / install ===== */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const ONSITE=/github\.io$/.test(location.hostname)&&location.hostname!=='htmlpreview.github.io';
const INST=IOS&&!STANDALONE&&ONSITE;
if(ONSITE&&'serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
 if(window.caches)caches.open('aplik-v1').then(c=>c.addAll([location.pathname,'/*ID*/.webmanifest','icon-/*ID*/-180.png','icon-/*ID*/-192.png'])).catch(()=>{});}
$('#home').onclick=menu;menu();
</script>
</body></html>
