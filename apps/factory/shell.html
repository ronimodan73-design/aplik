<style>
/*FONTS*/
:root{--bg:#0f1b2d;--card:#13233a;--chip:#1c3352;--ink:#f3f6fb;--muted:#9fb3cc;--line:#2b4466;--acc:#ffb020;--blue:#5ec8ff;--red:#ff7a8a;--ok:#4fd18b;--pu:#c084fc}

body{background:var(--bg);color:var(--ink);font-family:"Heebo","Rubik",Arial,sans-serif;direction:rtl}
.app{max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

.inputs.tpl{direction:ltr;justify-content:center;align-items:center;gap:5px;font:800 28px Rubik;flex-wrap:nowrap}.tin{width:68px;font:700 26px Rubik;text-align:center;padding:8px;border-radius:10px;border:3px solid var(--line);background:#0b1626;color:var(--ink);direction:ltr}.tin.bad{border-color:var(--red)!important;background:#ff7a8a22}.tin.good{border-color:var(--ok)!important}

.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

.btn.main{background:var(--acc);color:#1b1300}.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}

.askbox{background:#5ec8ff14;border:2px dashed var(--blue);border-radius:14px;padding:10px 12px;margin:12px 0}.askbox .ah{font-weight:800;color:var(--blue);font-size:18px;margin-bottom:6px}
.asknote{background:#4fd18b18;border-right:5px solid var(--ok);padding:8px 12px;border-radius:10px;margin:8px 0;font-size:17px}

.rule{background:var(--acc);color:#1b1300;border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;margin-top:10px}
.big{font-family:Rubik;font-weight:900;font-size:60px;color:var(--acc);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:auto}.foot b{color:var(--ink)}
.pop{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.88)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.rv{opacity:0;animation:rv .55s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.drawl{stroke-dasharray:600;stroke-dashoffset:600;animation:dl 1.1s ease-out forwards;animation-delay:var(--d,0s)}@keyframes dl{to{stroke-dashoffset:0}}
.slide{animation:sl 1.6s ease-in-out forwards;animation-delay:var(--d,0s)}@keyframes sl{to{transform:translate(var(--tx),var(--ty))}}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0;text-align:center}
.say{font-size:20px;line-height:1.55}
.what{background:var(--chip);border-right:5px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:18px;text-align:right;line-height:1.5}.what b{color:var(--ok)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.x{color:var(--red);font-weight:900}.v{color:var(--ok);font-weight:900}
.lvrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:17px}
.lvrow .nm{width:150px;flex:none}.lvrow .bar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}.lvrow .bar i{display:block;height:100%}
.lvrow .sc{width:46px;text-align:left;font-family:Rubik;font-weight:700;direction:ltr}
.verdict{border-radius:14px;padding:14px 16px;font-size:20px;font-weight:700;margin:12px 0;line-height:1.5}
.miss{background:var(--chip);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px;line-height:1.5}.miss .k{color:var(--acc);font-family:Rubik;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:#4fd18b1f;border:1px solid var(--ok);color:var(--ok);border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700}
.nameIn{font:700 22px Rubik;padding:10px;border-radius:10px;border:2px solid var(--line);background:#0b1626;color:var(--ink);width:100%;max-width:340px;text-align:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px}.legend span{border-radius:99px;padding:3px 10px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.drawl{opacity:1;stroke-dashoffset:0}}
@media (max-width:560px){.tin{width:56px!important;font-size:22px!important;padding:6px 2px!important}.inputs.tpl{font-size:24px;gap:3px}.levels,.hero{grid-template-columns:1fr}.qtext{font-size:20px}.card{padding:14px}.btns .btn{padding:11px 16px;font-size:18px}.lvrow .nm{width:112px;font-size:15px}.say{font-size:18px}.inp input{width:104px}}
.wk{margin-top:14px;border:2px dashed var(--blue);border-radius:14px;padding:12px 14px;background:#5ec8ff10}
.wkh{font-weight:800;color:var(--blue);margin-bottom:8px;font-size:19px}
.wks{border-radius:10px;padding:9px 12px;margin:7px 0;background:var(--chip);font-size:18px;line-height:1.6}
.wks.ok{border-right:5px solid var(--ok)}.wks.ok .wv{color:var(--ok);font-weight:800}
.wks.here{border:2px solid var(--red);background:#ff7a8a1c}.wks.cur{border:2px solid var(--blue)}
.wkpin{color:var(--red);font-weight:900}.wkwhy{margin-top:6px;color:var(--ink)}
.wks .inp input{width:100px;font-size:22px;padding:6px}
.wkc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.wkc button{background:#0b1626;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:600 17px Heebo,sans-serif;cursor:pointer}.wkc button.sel{border-color:var(--acc)}
.wkdone{margin-top:8px;font-weight:800;color:var(--ok)}
.top .chaps{display:flex;flex-direction:column;gap:10px;margin-top:10px}.chaps button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.chaps button.rec{border-color:var(--acc)}.chaps .t{font-weight:800;font-size:19px}.chaps .d{font-size:15px;color:var(--muted)}
.chr{border-radius:12px;padding:4px 6px;margin:6px 0;cursor:pointer}.chr .chl{font:700 19px Rubik;direction:ltr;text-align:center;overflow-wrap:anywhere}.chr .chl .m{white-space:normal}.chr .chn{font-size:16px;color:var(--acc);text-align:center;font-weight:700}.chr.red .chn{color:var(--red)}.chr .chw{font-size:16px;background:#c084fc14;border-right:4px solid var(--pu);border-radius:8px;padding:6px 10px;margin-top:4px}
.chm{margin-top:14px;font-weight:800;color:var(--red);font-size:19px}.paused .rv,.paused .fly,.paused .bx,.paused .st::after{animation-play-state:paused!important}
.chsys{margin:6px 0}.chl{font:700 20px Rubik;direction:ltr;text-align:center;padding:6px 8px;border-radius:10px;margin:4px 0}.chl.old{opacity:.5;font-size:17px}.chl.cur{background:#ffb02018;border:2px solid var(--acc)}
.why{border-right-color:var(--pu)!important;background:#c084fc14!important}
.spbtn{background:var(--acc);color:#14213a;border:0;font-weight:800}
.sp{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:70;background:#0b1626;border-top:3px solid var(--acc);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px #000a}
.sp[hidden]{display:none}.aibox{margin:0 8px 6px;padding:8px 12px;border-radius:10px;background:#c084fc22;border:2px solid var(--pu);font-size:17px;line-height:1.5}.aibox[hidden]{display:none}.sptools{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;direction:rtl}
.sptools b{font-size:17px;margin-left:auto}.sptools button{background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:10px;min-width:40px;height:42px;font:700 17px Heebo,sans-serif;cursor:pointer;padding:0 6px}
.sptools button.on{border-color:var(--acc);background:#2a3b57}.sptools .dot{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle}
.spwrap{flex:1;position:relative;margin:0 8px 8px;border-radius:12px;overflow:hidden;background-color:#0f2036;background-image:linear-gradient(#22395a 1px,transparent 1px),linear-gradient(90deg,#22395a 1px,transparent 1px);background-size:28px 28px}
.spwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
body.spopen .app{padding-bottom:62vh}
@media print{.spbtn,.sp{display:none!important}}
</style></head>

 <div class="top"><b>/*TOPIC*/</b><span id="sc"></span><button id="spb" class="spbtn" type="button" aria-label="פתיחת דף טיוטה">✏️ טיוטה</button><button id="home" type="button">תפריט</button></div>

</div>
<div class="sp" id="sp" hidden role="dialog" aria-label="דף טיוטה"><div class="sptools"><button type="button" id="spx" aria-label="סגירת הטיוטה" style="margin-left:auto">✖ סגירה</button>

 <div class="aibox" id="aibox" hidden role="status" aria-live="polite"></div><div class="spwrap"><canvas id="spcv"></canvas></div></div>
<script>
const $=s=>document.querySelector(s);const V=$('#view');
const M=t=>`<span class="m">${t}</span>`;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const OR='#ffb020',BL='#5ec8ff',GR='#4fd18b',PU='#c084fc',RD='#ff7a8a';
const store={get:k=>{try{return JSON.parse(localStorage.getItem(APP.key+'_'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(APP.key+'_'+k,JSON.stringify(v))}catch(e){}}};
const deg='°';
const f=n=>(+n).toFixed(1);
/*CONTENT*/
const TL=['★ ידע','★★ יישום','★★★ הבנה ונימוק','★★★★ חשיבה ואוריינות'],TCOL=[GR,BL,OR,PU];
const TOTAL=20;let S={};
const rcOf=q=>{if(q.rc!=null)return q.rc;if(APP.rcFn){const v=APP.rcFn(q);if(v!=null)return v;}return APP.rc?APP.rc[q.kind]:null;};

function bindRc(){V.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>recap(+b.dataset.rc,true));}
/* ===== screens ===== */
function menu(){$('#sc').textContent='';const tl=store.get('test');
 V.innerHTML=`<div class="card"><h1>${APP.topic}</h1><div class="hello">💛 ילדים יקרים, הכנתי לכם אפליקציה שתסייע לכם ללמוד ולהבין את החומר בצורה נוספת. <b>בהצלחה! רוני</b></div><p>${APP.sub} טעיתם? לוחצים על <b>"הראו לי"</b>.</p>
 <div class="hero"><button type="button" id="go-recap"><span class="ic">▶</span><span><b>מתחילים כאן</b><small>הסבר מונפש + חימום קל</small></span></button><button type="button" id="go-test"><span class="ic">📝</span><span><b>בחן את עצמך</b><small>מבחן מדורג · 16 שאלות · 4 רמות · ציון ודוח</small></span></button></div>
 ${tl?`<div class="last">המבחן האחרון שלי: ציון ${Math.round(tl.sc/16*100)} · ${tl.d}</div>`:''}
 ${INST?`<div class="inst">📲 <b>לעבוד גם בלי אינטרנט:</b> לחצו על כפתור השיתוף ⬆️ בתחתית ספארי, ואז על <b>"הוספה למסך הבית"</b>. פותחים מהאייקון פעם אחת כשיש אינטרנט, ומאז זה עובד גם בלי.</div>`:''}
 ${typeof CHAPTERS!=='undefined'?`<h2 style="margin-top:18px">📚 לומדים פרק אחרי פרק</h2><p style="font-size:16px;color:var(--muted)">בכל פרק: תרגיל פתור מונפש ← המוקש ← עכשיו אתה ← 10 תרגילים</p><div class="chaps">${CHAPTERS.map((c,i)=>{const b=store.get('ch'+i),rec=CHAPTERS.findIndex((_,j)=>(store.get('ch'+j)||0)<8);return `<button type="button" data-ch="${i}" class="${i===rec?'rec':''}"><span class="t">${i===rec?'👈 ':''}פרק ${i+1}: ${c.t}</span><span class="d">${c.d||''}${b!=null?` · השיא שלי: ${b} מתוך ${chList(i).length}${b>=8?' ✅':''}`:''}</span></button>`}).join('')}</div><h2 style="margin-top:18px">תרגול מעורב בשלבים</h2>`:'<h2 style="margin-top:18px">תרגול בשלבים: מתקדמים מרמה לרמה</h2>'}<p style="font-size:16px;color:var(--muted)">עוברים שלב עם 16 נכונות מתוך 20 ✅</p>
 <div class="levels">${LEVELS.map((l,i)=>{const b=store.get('best'+i),rec=LEVELS.findIndex((_,j)=>(store.get('best'+j)||0)<16);return `<button type="button" data-l="${i}" class="${i===rec?'rec':''}">${b>=16?'<span class="badge ok">✅ עברתי</span>':i===rec?'<span class="badge">👈 מומלץ עכשיו</span>':''}<span class="st">${'★'.repeat(l.n)}</span><span class="t">${l.t}</span><span class="d">${l.d}</span>${b!=null?`<span class="best">השיא שלי: ${b} מתוך ${TOTAL}</span>`:''}</button>`}).join('')}</div></div>`;
