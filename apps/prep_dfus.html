.bz-t{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:6px 0 10px}.bz-t i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#f59e0b,#dc2626);width:100%}

.dp{opacity:0;animation:dp .7s cubic-bezier(.3,1.6,.6,1) forwards}@keyframes dp{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}

<script>
var D={title:"דפוס – המצאה ששינתה את העולם",icon:"📜",flashSub:"מושג ← הסבר · שנה ← אירוע · אדם ← מה עשה"};
D.svg={
time:'<svg viewBox="0 0 320 170" width="300"><line x1="12" y1="85" x2="308" y2="85" stroke="#475569" stroke-width="3"/>'+
[[298,"105","נייר בסין",0,"#64748b"],[250,"1455","תנ״ך גוטנברג",1,"#7c3aed"],[208,"1468","מות גוטנברג",0,"#7c3aed"],[164,"1517","95 התזות",1,"#dc2626"],[120,"1543","קופרניקוס",0,"#0891b2"],[76,"1546","מות לותר",1,"#dc2626"],[28,"1687","ניוטון",0,"#0891b2"]].map(function(p){var up=p[3]==1,y1=up?50:120;return '<circle cx="'+p[0]+'" cy="85" r="7" fill="'+p[4]+'"/><line x1="'+p[0]+'" y1="85" x2="'+p[0]+'" y2="'+(up?62:108)+'" stroke="'+p[4]+'" stroke-width="2"/><text x="'+p[0]+'" y="'+(up?y1:y1+6)+'" font-size="14" font-weight="bold" fill="'+p[4]+'" text-anchor="middle">'+p[1]+'</text><text x="'+p[0]+'" y="'+(up?y1-18:y1+24)+'" font-size="11" fill="#334155" text-anchor="middle">'+p[2]+'</text>';}).join('')+'</svg>',
three:'<svg viewBox="0 0 300 120" width="290"><rect x="204" y="10" width="88" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="248" y="52" font-size="30" text-anchor="middle">🔠</text><text x="248" y="80" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">אותיות נפרדות</text><text x="248" y="97" font-size="11" fill="#5b21b6" text-anchor="middle">ממתכת</text><rect x="106" y="10" width="88" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="150" y="52" font-size="30" text-anchor="middle">🍇</text><text x="150" y="80" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">מכבש</text><text x="150" y="97" font-size="11" fill="#92400e" text-anchor="middle">(כמו של ענבים)</text><rect x="8" y="10" width="88" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="52" y="52" font-size="30" text-anchor="middle">🖋️</text><text x="52" y="80" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">דיו על בסיס</text><text x="52" y="97" font-size="11" fill="#166534" text-anchor="middle">שמן</text></svg>',
books:'<svg viewBox="0 0 300 150" width="290"><text x="150" y="16" font-size="12" fill="#334155" text-anchor="middle">מספר הספרים באירופה</text>'+
[[270,"המאה ה-15","12 מיליון",4],[195,"מאה שנה אחר כך","200 מיליון",22],[120,"המאה ה-17","חצי מיליארד",55],[45,"המאה ה-18","מיליארד",105]].map(function(b){return '<rect x="'+(b[0]-22)+'" y="'+(128-b[3])+'" width="44" height="'+b[3]+'" rx="4" fill="#7c3aed"/><text x="'+b[0]+'" y="'+(122-b[3])+'" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">'+b[2]+'</text><text x="'+b[0]+'" y="144" font-size="10" fill="#334155" text-anchor="middle">'+b[1]+'</text>';}).join('')+'</svg>'
};
D.summary=[
["📚 למה זה חשוב?","<p>היום ספר הוא דבר רגיל, אבל <b>עד אמצע המאה ה-15</b> לא היו ספרים כמו שאנחנו מכירים: עותקים זהים שמיוצרים בסדרה. כל ספר נכתב <b>ביד</b>, ורוב האנשים לא ידעו קרוא וכתוב.</p><p>מה ששינה את זה הוא <b>מכבש הדפוס</b> של <b>יוהן גוטנברג</b>.</p>"+D.svg.time],
["✍️ לפני הדפוס","<p><b>פפירוס</b> – הגיע ממצרים, היה רגיש ללחות ולא השתמר טוב באירופה. אחרי נפילת הקיסרות הרומית המערבית האספקה נפסקה.</p><p><b>קלף</b> – עור מעובד שהחליף את הפפירוס. יקר וקשה להשגה.</p><p><b>נייר</b> – הומצא בסין בידי <b>צאי לון</b> (בערך שנת 105). הגיע לאירופה <b>דרך העולם המוסלמי</b>. זול בהרבה מהקלף.</p><p><b>העתקה ביד</b> – נזירים העתיקו ספרים. זה היה איטי, ובכל עותק היו שגיאות, פרשנות אישית וצנזורה דתית.</p><p><b>הדפוס הסיני</b> – הדפסה מגלופות עץ. לא התאים להדפסה מהירה, למשל של עיתון יומי.</p><div class='tip'>💡 שתי בעיות לפני גוטנברג: חומר כתיבה יקר (קלף) והעתקה איטית ביד.</div>"],
["🔠 ההמצאה של גוטנברג","<p><b>יוהן גוטנברג</b> – צורף וחרט מהעיר <b>מיינץ</b> שבגרמניה.</p>"+D.svg.three+"<p>1️⃣ <b>אותיות נפרדות ממתכת</b> – מסגסוגת (תערובת מתכות) של עופרת, אנטימון ובדיל. אלה היו <b>הגופנים הראשונים</b> בהיסטוריה.</p><p>2️⃣ <b>מכבש</b> – לקח את הרעיון של מכבש הענבים, כדי ללחוץ על הדף בכוח אחיד.</p><p>3️⃣ <b>דיו על בסיס שמן</b> – נדבק לנייר ולא דוהה (הדיו המימי נמרח).</p><p>📖 <b>תנ״ך גוטנברג (1455)</b> – כ-<b>180 עותקים</b> בלטינית. העתקה ביד של עותק אחד לקחה יותר משנה!</p><p>😢 <b>הסוף שלו:</b> המשקיע <b>יוהן פוסט</b> תבע את הכסף שלו וניצח. גוטנברג פשט את הרגל, חי בחסות הארכיבישוף <b>אדולף פון נסאו</b> ומת ב-<b>1468</b>.</p>"],
["⛪ הרפורמציה","<p>במאות ה-14 וה-15 נחלש כוחה של <b>הכנסייה הקתולית</b> (בין השאר בגלל המגפה השחורה, צמיחת הבורגנות וחיזוק המלכים).</p><p>📌 <b>31 באוקטובר 1517</b> – <b>מרטין לותר</b> פרסם את <b>95 התזות</b> נגד מכירת <b>כתבי מחילה</b>. בזכות הדפוס הן הופצו בכל גרמניה.</p><p>🗣️ לותר כתב ב<b>גרמנית</b> (שפת העם) ולא בלטינית, ו<b>תרגם את התנ״ך לגרמנית</b>.</p><p>✂️ לותר מת ב-1546, והפיצול בנצרות באירופה כבר היה עובדה.</p><div class='tip'>💡 הדפוס = ״רמקול״: רעיון של אדם אחד הגיע מהר להמון אנשים.</div>"],
["📖 קרוא וכתוב (אוריינות)","<p><b>אוריינות</b> = ידיעת קרוא וכתוב.</p><p>ברומא העתיקה האוריינות הייתה גבוהה יחסית, ובימי הביניים היא ירדה.</p><p>הרפורמציה דרשה מכל נוצרי <b>לקרוא את התנ״ך בעצמו</b> ← נפתחו בתי ספר והיו יותר תרגומים. האוריינות התפשטה מהר יותר בארצות <b>הפרוטסטנטיות</b>. ב<b>סקנדינביה</b> כמעט כולם ידעו לקרוא כבר במאה ה-17.</p><p>📊 בשנת <b>1820</b> רק <b>12%</b> מאנשי העולם ידעו קרוא וכתוב. בשנת <b>2016</b> כמעט <b>1 מכל 7</b> אנשים עדיין לא ידע.</p><div class='tip'>⚠️ חשוב: הדפוס <b>לבדו</b> לא הספיק! היו צריכים גם מערכות חינוך, את המהפכה התעשייתית ואת העיתונות.</div>"],
["🎓 השכלה ומדע","<p>"+D.svg.books+"</p><p>💰 <b>מחירים:</b> תנ״ך בכתב יד עלה כמו <b>6 שנות עבודה</b> של פועל. ב-1687 הספר של <b>אייזק ניוטון</b> עלה <b>6 שילינגים</b> בלבד – מחיר שהמעמד הבינוני הגבוה יכול לשלם.</p><p>🏛️ יותר ספרים ← נפתחו <b>אוניברסיטאות</b> חדשות.</p><p>🔄 <b>שימור מול חדשנות:</b> פעם שמרו בקנאות על ספרים נדירים והעריצו את הישן. כשהספר נעשה זמין, נפתחה הדרך לחדשנות של <b>הרנסנס</b>.</p><p>🔭 <b>1543 – קופרניקוס</b> פרסם ספר שסתר את <b>המודל הגיאוצנטרי</b> (״כדור הארץ במרכז״). בלי הדפוס הרעיון היה נשאר בכתב יד במנזר ומתפשט לאט.</p>"],
