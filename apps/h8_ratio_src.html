<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בחן את עצמך · יחס, פרופורציה, קנה מידה · ח׳ א2</title>
<style>
/*FONTS*/
:root{--bg:#0f1b2d;--card:#13233a;--chip:#1c3352;--ink:#f3f6fb;--muted:#9fb3cc;--line:#2b4466;--acc:#ffb020;--blue:#5ec8ff;--red:#ff7a8a;--ok:#4fd18b;--pu:#c084fc}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Heebo","Rubik",Arial,sans-serif;direction:rtl}
.app{max-width:860px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.top b{color:var(--ink);font-family:Rubik;font-size:17px;flex:1}
.top button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-family:Rubik;font-weight:900;font-size:34px;margin:0 0 6px}
h2{font-family:Rubik;font-size:24px;margin:0 0 10px}
p{font-size:19px;line-height:1.55;margin:0}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;font:700 18px Rubik;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}.tabs button.on{border-color:var(--acc);color:var(--acc)}
.levels button{all:unset;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.levels button:hover,.levels button:focus-visible{border-color:var(--acc)}
.levels .st{color:var(--acc);font-size:22px}.levels .t{font-family:Rubik;font-weight:700;font-size:19px}.levels .d{color:var(--muted);font-size:15px}
.levels .best{color:var(--ok);font-size:14px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.kind{display:inline-block;background:var(--chip);color:var(--acc);border-radius:99px;padding:3px 12px;font-size:14px;font-family:Rubik;margin-bottom:10px}
.qtext{font-size:23px;line-height:1.6}
.m{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-family:Rubik;font-weight:700}
.inputs{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;align-items:flex-end}
.inp{display:flex;flex-direction:column;gap:4px;font-size:17px;font-weight:700}
.inp input{width:120px;font:700 26px Rubik;text-align:center;padding:8px;border-radius:10px;border:2px solid var(--line);background:#0b1626;color:var(--ink);direction:ltr}
.inp input.bad{border-color:var(--red)}.inp input.good{border-color:var(--ok)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choices button{all:unset;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:12px 16px;font-size:19px}
.choices button.sel{border-color:var(--acc)}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:700 19px Rubik;border:none;border-radius:12px;padding:12px 22px;cursor:pointer}
.btn.main{background:var(--acc);color:#1b1300}.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:19px;line-height:1.5;display:none}
.fb.ok{display:block;background:#4fd18b22;border:2px solid var(--ok)}
.fb.no{display:block;background:#ff7a8a1c;border:2px solid var(--red)}
.fb b{font-family:Rubik}
.sol{margin-top:16px;display:none}
.sol.on{display:block}
table.at{border-collapse:separate;border-spacing:0;font-family:Rubik;font-weight:700;margin:10px auto}
.at th,.at td{border:2px solid var(--line);padding:8px 16px;text-align:center;font-size:24px;min-width:84px;height:52px}
.at th{background:var(--chip);font-size:18px}.at td.lab{border:none;font-size:15px;color:var(--muted);min-width:0;font-weight:500}
.at th.lab{border:none;background:none}
.at .giv{background:#ffb02040;color:#ffd27a}.at .anc{box-shadow:inset 0 0 0 5px var(--ok)}
.at .v{opacity:0;transition:opacity .4s;direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}.at .v.show{opacity:1}.at .calc{color:var(--ok)}
.sline{font-size:20px;text-align:center;margin:8px 0;opacity:0;transition:opacity .5s}.sline.show{opacity:1}
.rule{background:var(--acc);color:#1b1300;border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;margin-top:10px}
.big{font-family:Rubik;font-weight:900;font-size:64px;color:var(--acc);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:auto}
.pop{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.levels{grid-template-columns:1fr}.qtext{font-size:20px}.at th,.at td{padding:4px 4px;min-width:0;font-size:15px;height:40px}.at th{font-size:13px}.at td.lab{font-size:12px}.card{padding:14px}}
.sol{overflow-x:auto}
</style></head><body>
<div class="app">
 <div class="top"><b>בחן את עצמך · יחס · פרופורציה · קנה מידה</b><span id="sc"></span><button id="home" type="button">תפריט</button></div>
 <div id="view"></div>
 <div class="foot"><b>ערכה: רוני מודן · שחקים</b> · © כל הזכויות שמורות</div>
</div>
<script>
const $=s=>document.querySelector(s);const V=$('#view');
const M=t=>`<span class="m">${t}</span>`;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const COL=['#ffb020','#5ec8ff','#ff7a8a'],PU='#c084fc';
const C2=(t,i)=>`<b style="color:${COL[i]}">${t}</b>`;
const PAIRS=[['דנה','נועם','מדבקות'],['מיכל','יונתן','קלפים'],['שירה','עומר','סוכריות'],['אלה','רון','גולות'],['תמר','איתי','ש״ח']];
const RATIOS=[[1,2],[1,3],[2,3],[3,4],[2,5],[3,5],[4,5],[1,4],[5,3],[3,2],[4,3],[5,2],[7,3]];
const GROUPS=[['בנים','בנות','תלמידים בכיתה'],['כלבים','חתולים','בעלי חיים במקלט'],['עטים','עפרונות','כלי כתיבה בקלמר'],['תפוחים','אגסים','פירות בסל'],['מכוניות','אופנועים','כלי רכב בחניון']];
// spec: cols[{h,c}], r[], q[], giv:[[row,col]], anc, part, ans: [{label,col,val}] | choice
function genWhole(){const [a,b]=pick(RATIOS),[n1,n2,u]=pick(PAIRS),k=R(2,9),T=(a+b)*k;
 return {kind:'נתון השלם',text:`${C2(n1,0)} ו${C2(n2,1)} מתחלקים ב־${M(T)} ${u} ביחס ${M(a+' : '+b)} (${n1} : ${n2}). כמה מקבל כל אחד?`,
 cols:[{h:n1,c:COL[0]},{h:n2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,a+b],q:[a*k,b*k,T],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,
 ans:[{label:n1,col:COL[0],val:a*k},{label:n2,col:COL[1],val:b*k}],diag:(x)=>diagWhole(x,a,b,T,k)};}
function diagWhole([x,y],a,b,T,k){
 if(x===T/2&&y===T/2)return 'חילקתם ל<b>שני אנשים</b>. מחלקים ב<b>מספר החלקים</b>: '+M(a+' + '+b+' = '+(a+b))+'.';
 if(x===a&&y===b)return 'כתבתם את <b>החלקים</b>, לא את <b>הכמות</b>. צריך למצוא כמה שווה חלק אחד.';
 if(x===b*k&&y===a*k)return 'החשבון נכון, אבל <b>הסדר הפוך</b>! הראשון ביחס הוא הראשון בשאלה.';
 if(x+y===T)return 'הסכום נכון, אבל זה לא ביחס '+M(a+' : '+b)+'. בדקו: האם הצמצום מחזיר ליחס?';
 return null;}
function genPart(withWhole){const [a,b]=pick(RATIOS),[g1,g2,w]=pick(GROUPS),k=R(2,9),first=Math.random()<.5;
 const known=first?0:1,kv=(first?a:b)*k;
 const text=`היחס בין ${C2(g1,0)} ל${C2(g2,1)} הוא ${M(a+' : '+b)}. יש ${M(kv)} ${first?g1:g2}. כמה ${first?g2:g1} יש?`+(withWhole?` וכמה ${w}?`:'');
 const ans=[{label:first?g2:g1,col:COL[first?1:0],val:(first?b:a)*k}];if(withWhole)ans.push({label:'שלם',col:PU,val:(a+b)*k});
 return {kind:withWhole?'נתון חלק · מוצאים חלק ושלם':'נתון חלק',text,cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,a+b],q:[a*k,b*k,(a+b)*k],
 giv:[[0,0],[0,1],[1,known]],anc:known,part:k,ans,diag:([x])=>{const o=first?b:a,m=first?a:b;
   if(x===kv*o)return 'כפלתם את '+M(kv)+' ב־'+o+'. קודם מוצאים <b>חלק אחד</b>: '+M(kv+' : '+m+' = '+k)+'.';
   if(x===kv+(o-m))return 'הוספתם את ההפרש בחלקים. אבל חלק אחד שווה '+M(k)+', לא 1!';
   if(x===(a+b)*k)return 'זה <b>השלם</b>, לא החלק השני.';return null;}};}
function genRatio(){const [a,b]=pick(RATIOS.filter(([a,b])=>gcd(a,b)===1)),[g1,g2]=pick(GROUPS),k=R(2,8);
 return {kind:'מוצאים את היחס',text:`יש ${M(a*k)} ${C2(g1,0)} ו־${M(b*k)} ${C2(g2,1)}. מה היחס בין ה${g1} ל${g2}? (מצומצם)`,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]}],r:[a,b],q:[a*k,b*k],giv:[[1,0],[1,1]],anc:-1,part:k,ratio:true,
 ans:[{label:g1,col:COL[0],val:a},{label:g2,col:COL[1],val:b}],diag:([x,y])=>{
  if(x*b===y*a&&(x!==a))return 'היחס שווה, אבל <b>אפשר לצמצם עוד</b>! מחלקים את שני המספרים במחלק המשותף הגדול.';
  if(x===b&&y===a)return '<b>הסדר הפוך</b>: קודם '+g1+', אחר כך '+g2+'.';return null;}};}
function genDiff(){let [a,b]=pick(RATIOS.filter(([a,b])=>a!==b));if(a<b)[a,b]=[b,a];const [g1,g2,w]=pick(GROUPS),k=R(2,8),d=(a-b)*k;
 return {kind:'נתון ההפרש',text:`היחס בין ${C2(g1,0)} ל${C2(g2,1)} הוא ${M(a+' : '+b)}. יש ${M(d)} ${g1} יותר מ${g2}. כמה ${w}?`,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'הפרש',c:'#ffd27a'},{h:'שלם',c:PU}],r:[a,b,a-b,a+b],q:[a*k,b*k,d,(a+b)*k],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,
 ans:[{label:'שלם',col:PU,val:(a+b)*k}],diag:([x])=>{
  if(x===d*(a+b))return 'כפלתם את ההפרש בסכום החלקים. קודם <b>חלק אחד</b>: '+M(d+' : '+(a-b)+' = '+k)+'.';
  if(x===d/(a+b))return 'חילקתם את ההפרש בסכום החלקים. ההפרש שייך לעמודת <b>ההפרש</b>: '+M(a+' − '+b+' = '+(a-b))+' חלקים.';
  if(x===a*k||x===b*k)return 'זה רק חלק אחד מהשלם. מה עם השני?';return null;}};}
function genRect(){const [a,b]=pick([[2,1],[3,1],[3,2],[4,1],[5,3],[4,3]]),k=R(2,6),P=2*(a+b)*k;
 return {kind:'היקף מלבן · מה השלם?',text:`היקף מלבן ${M(P)} ס״מ. היחס בין ${C2('האורך',0)} ל${C2('רוחב',1)} הוא ${M(a+' : '+b)}. מה אורכי הצלעות?`,
 cols:[{h:'אורך',c:COL[0]},{h:'רוחב',c:COL[1]},{h:'חצי היקף',c:PU}],r:[a,b,a+b],q:[a*k,b*k,P/2],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,rect:P,
 ans:[{label:'אורך',col:COL[0],val:a*k},{label:'רוחב',col:COL[1],val:b*k}],diag:([x,y])=>{
  if(x+y===P)return 'השתמשתם בכל ההיקף. אבל <b>אורך + רוחב = חצי היקף</b> = '+M(P+' : 2 = '+P/2)+'.';
  if(x===a*k/2&&y===b*k/2)return 'חילקתם פעמיים. השלם הוא חצי היקף: '+M(P/2)+'.';return null;}};}
function genThree(){const [a,b,c]=pick([[1,2,3],[2,3,5],[1,1,2],[3,4,5],[1,2,5]]),k=R(2,6),T=(a+b+c)*k;
 return {kind:'שלושה חלקים',text:`שלושה אחים מתחלקים ב־${M(T)} ש״ח ביחס ${M(a+' : '+b+' : '+c)}. כמה מקבל כל אחד?`,
 cols:[{h:'אח א׳',c:COL[0]},{h:'אח ב׳',c:COL[1]},{h:'אח ג׳',c:COL[2]},{h:'שלם',c:PU}],r:[a,b,c,a+b+c],q:[a*k,b*k,c*k,T],giv:[[0,0],[0,1],[0,2],[1,3]],anc:3,part:k,
 ans:[{label:'אח א׳',col:COL[0],val:a*k},{label:'אח ב׳',col:COL[1],val:b*k},{label:'אח ג׳',col:COL[2],val:c*k}],diag:([x,y,z])=>{
  if(x===T/3&&y===T/3)return 'חילקתם לשלושה אנשים. מחלקים ב<b>מספר החלקים</b>: '+M(a+' + '+b+' + '+c+' = '+(a+b+c))+'.';return null;}};}
function genWhy(){const [a,b]=pick(RATIOS),s=a+b;let N=R(15,60);const ok=N%s===0;const [g1,g2]=pick(GROUPS);
 return {kind:'חשיבה · האם ייתכן?',text:`בקבוצה ${M(N)} ${g1} ו${g2} יחד. האם ייתכן שהיחס בין ה${g1} ל${g2} הוא ${M(a+' : '+b)}?`,
 choice:[`כן, כי ${N} מתחלק ב־${s} (מספר החלקים)`,`לא, כי ${N} לא מתחלק ב־${s} (מספר החלקים)`,`כן, תמיד אפשר לחלק לפי יחס`,`לא, כי ${N} לא מתחלק ב־${a}`],correct:ok?0:1,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,s],q:ok?[a*N/s,b*N/s,N]:['?','?',N],giv:[[0,0],[0,1],[1,2]],anc:2,part:ok?N/s:null,why:true};}
const LEVELS=[
 {n:1,t:'מוצאים יחס, ונתון השלם',d:'מספרים קטנים, שני חלקים',g:()=>Math.random()<.5?genRatio():genWhole()},
 {n:2,t:'נתון השלם או נתון חלק',d:'איפה העוגן?',g:()=>pick([genWhole,()=>genPart(false),()=>genPart(true)])()},
 {n:3,t:'הפרש ושלושה חלקים',d:'עמודת הפרש, יחס של 3',g:()=>pick([genDiff,genThree,()=>genPart(true)])()},
 {n:4,t:'חשיבה ואוריינות',d:'היקף מלבן, האם ייתכן?, הכול מעורבב',g:()=>pick([genRect,genWhy,genDiff,genThree,()=>genPart(true),genRatio])()}];

const ITEMS=[['מחברות','מחברת'],['עטים','עט'],['ק״ג תפוחים','ק״ג'],['כרטיסים','כרטיס'],['יוגורטים','יוגורט']];
const fmt=n=>(+n.toFixed(3)).toLocaleString('en-US');
function genUnit(small){const [it,one]=pick(ITEMS),n1=R(2,small?4:6),u=R(2,small?6:9);let n2=R(2,small?8:12);if(n2===n1)n2++;const p1=n1*u;
 return {kind:'פרופורציה · מחיר ליחידה',text:`${M(n1)} ${it} עולים ${M(p1)} ש״ח. כמה עולים ${M(n2)} ${it} (באותו מחיר)?`,ans:[{label:'מחיר (ש״ח)',col:COL[1],val:n2*u}],
 custom:1,cols:[{h:'ידוע',c:'#f3f6fb'},{h:'שואלים',c:'#f3f6fb'},{h:one+' 1',c:'#4fd18b'}],rl:[it,'מחיר (ש״ח)'],anc:0,
 rows:[[n1,n2,1],[p1,`${n2} · ${u} = ${n2*u}`,`${p1} : ${n1} = ${u}`]],k:[[0,0,1],[0,2,1]],
 lines:[`העוגן: עמודת "ידוע". מחיר של ${one} אחד: ${M(p1+' : '+n1+' = '+u)}`,`כופלים: ${M(n2+' · '+u+' = '+n2*u)}. בדיקה בהצלבה: ${M(n1+'/'+p1+' = '+n2+'/'+n2*u)}`],rule:'חלק אחד (מחיר ליחידה) ← כופלים ← בודקים. בפרופורציה כופלים, לא מוסיפים!',
 diag:([x])=>{if(x===p1+(n2-n1))return '<b>הוספתם</b> במקום לכפול. מחיר של '+one+' אחד הוא '+M(u)+', לא 1.';if(x===p1*n2)return 'כפלתם את כל המחיר. קודם מוצאים מחיר של '+one+' אחד: '+M(p1+' : '+n1)+'.';return null;}};}
function genMissing(){const [a0,b0]=pick(RATIOS),k1=R(2,6);let k2=R(2,9);if(k2===k1)k2++;const a=a0*k1,b=b0*k1,c=a0*k2,x=b0*k2;
 return {kind:'פרופורציה · מספר חסר',text:`מצאו את x: ${M(a+'/'+b+' = '+c+'/x')}`,ans:[{label:'x',col:COL[0],val:x}],custom:1,
 lines:[`כפל בהצלבה: ${M(a+' · x = '+b+' · '+c)}`,`${M(a+'x = '+b*c)} ← מחלקים ב־${a}: ${M('x = '+x)}`,`בדיקה: ${M(c+'/'+x+' = '+a0+'/'+b0)} וגם ${M(a+'/'+b+' = '+a0+'/'+b0)} ✓`],rule:'a/b = c/d ← a · d = b · c',
 diag:([y])=>{if(y===b+(c-a))return 'הוספתם את ההפרש. בפרופורציה <b>כופלים</b>: כפל בהצלבה.';if(y===a*c/b)return 'כפלתם בהצלבה לא נכון: x עומד מול '+a+', ולכן '+M(a+' · x = '+b+' · '+c)+'.';return null;}};}
function genIsProp(){const [a0,b0]=pick(RATIOS),k=R(2,6),ok=Math.random()<.5;const a=a0,b=b0,c=a0*k,d=ok?b0*k:b0*k+pick([1,-1]);
 return {kind:'האם זו פרופורציה?',text:`האם היחסים ${M(a+' : '+b)} ו־${M(c+' : '+d)} יוצרים פרופורציה?`,choice:['כן, היחסים שווים','לא, היחסים לא שווים'],correct:ok?0:1,custom:1,
