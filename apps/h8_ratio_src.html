<style>
/*FONTS*/

h1{font-family:Rubik;font-weight:900;font-size:34px;margin:0 0 6px}

p{font-size:19px;line-height:1.55;margin:0}

.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;font:700 18px Rubik;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}.tabs button.on{border-color:var(--acc);color:var(--acc)}

.sol{margin-top:16px;display:none}

.at th{background:var(--chip);font-size:18px}.at td.lab{border:none;font-size:15px;color:var(--muted);min-width:0;font-weight:500}

.big{font-family:Rubik;font-weight:900;font-size:64px;color:var(--acc);text-align:center}

.pop{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:scale(1)}}

@media (max-width:560px){.levels{grid-template-columns:1fr}.qtext{font-size:20px}.at th,.at td{padding:4px 4px;min-width:0;font-size:15px;height:40px}.at th{font-size:13px}.at td.lab{font-size:12px}.card{padding:14px}}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:Rubik;font-weight:700;line-height:1.15;margin:0 4px;direction:ltr}

.hero button:hover,.hero button:focus-visible{border-color:var(--acc)}
.hero .ic{font-size:30px}.hero b{display:block;font-family:Rubik;font-size:21px}.hero small{color:var(--muted);font-size:15px}

.row{display:flex;gap:22px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.say{font-size:21px;line-height:1.55}

.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.bx{display:inline-flex;gap:5px;vertical-align:middle;margin:0 4px}.bx i{width:22px;height:22px;border:2px solid var(--blue);border-radius:5px}
.x{color:var(--red);font-weight:900}.v{color:var(--ok);font-weight:900}
.lvrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:17px}
.lvrow .nm{width:150px;flex:none}.lvrow .bar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}.lvrow .bar i{display:block;height:100%}
.lvrow .sc{width:46px;text-align:left;font-family:Rubik;font-weight:700;direction:ltr}
.verdict{border-radius:14px;padding:14px 16px;font-size:20px;font-weight:700;margin:12px 0;line-height:1.5}
.miss{background:var(--chip);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px;line-height:1.5}
.miss .k{color:var(--acc);font-family:Rubik;font-weight:700}
.nameIn{font:700 22px Rubik;padding:10px;border-radius:10px;border:2px solid var(--line);background:#0b1626;color:var(--ink);width:100%;max-width:340px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:#4fd18b1f;border:1px solid var(--ok);color:var(--ok);border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700}
@media (max-width:560px){.btns .btn{padding:11px 16px;font-size:18px}.hero{grid-template-columns:1fr}.sq .c{width:36px;height:36px;font-size:18px}.lvrow .nm{width:112px;font-size:15px}.say{font-size:19px}}
</style></head><body>
<div class="app">
 <div class="top"><b>בחן את עצמך · יחס · פרופורציה · קנה מידה</b><span id="sc"></span><button id="home" type="button">תפריט</button></div>
 <div id="view"></div>
 <div class="foot"><b>ערכה: רוני מודן · שחקים</b> · © כל הזכויות שמורות</div>
</div>
<script>
const $=s=>document.querySelector(s);const V=$('#view');
const M=t=>`<span class="m">${t}</span>`;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const COL=['#ffb020','#5ec8ff','#ff7a8a'],PU='#c084fc';
const C2=(t,i)=>`<b style="color:${COL[i]}">${t}</b>`;
const PAIRS=[['דנה','נועם','מדבקות'],['מיכל','יונתן','קלפים'],['שירה','עומר','סוכריות'],['אלה','רון','גולות'],['תמר','איתי','ש״ח']];
const RATIOS=[[1,2],[1,3],[2,3],[3,4],[2,5],[3,5],[4,5],[1,4],[5,3],[3,2],[4,3],[5,2],[7,3]];
const GROUPS=[['בנים','בנות','תלמידים בכיתה'],['כלבים','חתולים','בעלי חיים במקלט'],['עטים','עפרונות','כלי כתיבה בקלמר'],['תפוחים','אגסים','פירות בסל'],['מכוניות','אופנועים','כלי רכב בחניון']];
// spec: cols[{h,c}], r[], q[], giv:[[row,col]], anc, part, ans: [{label,col,val}] | choice
function genWhole(){const [a,b]=pick(RATIOS),[n1,n2,u]=pick(PAIRS),k=R(2,9),T=(a+b)*k;
 return {kind:'נתון השלם',text:`${C2(n1,0)} ו${C2(n2,1)} מתחלקים ב־${M(T)} ${u} ביחס ${M(a+' : '+b)} (${n1} : ${n2}). כמה מקבל כל אחד?`,
 cols:[{h:n1,c:COL[0]},{h:n2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,a+b],q:[a*k,b*k,T],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,
 ans:[{label:n1,col:COL[0],val:a*k},{label:n2,col:COL[1],val:b*k}],diag:(x)=>diagWhole(x,a,b,T,k)};}
function diagWhole([x,y],a,b,T,k){
 if(x===T/2&&y===T/2)return 'חילקתם ל<b>שני אנשים</b>. מחלקים ב<b>מספר החלקים</b>: '+M(a+' + '+b+' = '+(a+b))+'.';
 if(x===a&&y===b)return 'כתבתם את <b>החלקים</b>, לא את <b>הכמות</b>. צריך למצוא כמה שווה חלק אחד.';
 if(x===b*k&&y===a*k)return 'החשבון נכון, אבל <b>הסדר הפוך</b>! הראשון ביחס הוא הראשון בשאלה.';
 if(x+y===T)return 'הסכום נכון, אבל זה לא ביחס '+M(a+' : '+b)+'. בדקו: האם הצמצום מחזיר ליחס?';
 return null;}
function genPart(withWhole){const [a,b]=pick(RATIOS),[g1,g2,w]=pick(GROUPS),k=R(2,9),first=Math.random()<.5;
 const known=first?0:1,kv=(first?a:b)*k;
 const text=`היחס בין ${C2(g1,0)} ל${C2(g2,1)} הוא ${M(a+' : '+b)}. יש ${M(kv)} ${first?g1:g2}. כמה ${first?g2:g1} יש?`+(withWhole?` וכמה ${w}?`:'');
 const ans=[{label:first?g2:g1,col:COL[first?1:0],val:(first?b:a)*k}];if(withWhole)ans.push({label:'שלם',col:PU,val:(a+b)*k});
 return {kind:withWhole?'נתון חלק · מוצאים חלק ושלם':'נתון חלק',text,cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,a+b],q:[a*k,b*k,(a+b)*k],
 giv:[[0,0],[0,1],[1,known]],anc:known,part:k,ans,diag:([x])=>{const o=first?b:a,m=first?a:b;
   if(x===kv*o)return 'כפלתם את '+M(kv)+' ב־'+o+'. קודם מוצאים <b>חלק אחד</b>: '+M(kv+' : '+m+' = '+k)+'.';
   if(x===kv+(o-m))return 'הוספתם את ההפרש בחלקים. אבל חלק אחד שווה '+M(k)+', לא 1!';
   if(x===(a+b)*k)return 'זה <b>השלם</b>, לא החלק השני.';return null;}};}
function genRatio(){const [a,b]=pick(RATIOS.filter(([a,b])=>gcd(a,b)===1)),[g1,g2]=pick(GROUPS),k=R(2,8);
 return {kind:'מוצאים את היחס',text:`יש ${M(a*k)} ${C2(g1,0)} ו־${M(b*k)} ${C2(g2,1)}. מה היחס בין ה${g1} ל${g2}? (מצומצם)`,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]}],r:[a,b],q:[a*k,b*k],giv:[[1,0],[1,1]],anc:-1,part:k,ratio:true,
 ans:[{label:g1,col:COL[0],val:a},{label:g2,col:COL[1],val:b}],diag:([x,y])=>{
  if(x*b===y*a&&(x!==a))return 'היחס שווה, אבל <b>אפשר לצמצם עוד</b>! מחלקים את שני המספרים במחלק המשותף הגדול.';
  if(x===b&&y===a)return '<b>הסדר הפוך</b>: קודם '+g1+', אחר כך '+g2+'.';return null;}};}
function genDiff(){let [a,b]=pick(RATIOS.filter(([a,b])=>a!==b));if(a<b)[a,b]=[b,a];const [g1,g2,w]=pick(GROUPS),k=R(2,8),d=(a-b)*k;
 return {kind:'נתון ההפרש',text:`היחס בין ${C2(g1,0)} ל${C2(g2,1)} הוא ${M(a+' : '+b)}. יש ${M(d)} ${g1} יותר מ${g2}. כמה ${w}?`,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'הפרש',c:'#ffd27a'},{h:'שלם',c:PU}],r:[a,b,a-b,a+b],q:[a*k,b*k,d,(a+b)*k],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,
 ans:[{label:'שלם',col:PU,val:(a+b)*k}],diag:([x])=>{
  if(x===d*(a+b))return 'כפלתם את ההפרש בסכום החלקים. קודם <b>חלק אחד</b>: '+M(d+' : '+(a-b)+' = '+k)+'.';
  if(x===d/(a+b))return 'חילקתם את ההפרש בסכום החלקים. ההפרש שייך לעמודת <b>ההפרש</b>: '+M(a+' − '+b+' = '+(a-b))+' חלקים.';
  if(x===a*k||x===b*k)return 'זה רק חלק אחד מהשלם. מה עם השני?';return null;}};}
function genRect(){const [a,b]=pick([[2,1],[3,1],[3,2],[4,1],[5,3],[4,3]]),k=R(2,6),P=2*(a+b)*k;
 return {kind:'היקף מלבן · מה השלם?',text:`היקף מלבן ${M(P)} ס״מ. היחס בין ${C2('האורך',0)} ל${C2('רוחב',1)} הוא ${M(a+' : '+b)}. מה אורכי הצלעות?`,
 cols:[{h:'אורך',c:COL[0]},{h:'רוחב',c:COL[1]},{h:'חצי היקף',c:PU}],r:[a,b,a+b],q:[a*k,b*k,P/2],giv:[[0,0],[0,1],[1,2]],anc:2,part:k,rect:P,
 ans:[{label:'אורך',col:COL[0],val:a*k},{label:'רוחב',col:COL[1],val:b*k}],diag:([x,y])=>{
  if(x+y===P)return 'השתמשתם בכל ההיקף. אבל <b>אורך + רוחב = חצי היקף</b> = '+M(P+' : 2 = '+P/2)+'.';
  if(x===a*k/2&&y===b*k/2)return 'חילקתם פעמיים. השלם הוא חצי היקף: '+M(P/2)+'.';return null;}};}
function genThree(){const [a,b,c]=pick([[1,2,3],[2,3,5],[1,1,2],[3,4,5],[1,2,5]]),k=R(2,6),T=(a+b+c)*k;
 return {kind:'שלושה חלקים',text:`שלושה אחים מתחלקים ב־${M(T)} ש״ח ביחס ${M(a+' : '+b+' : '+c)}. כמה מקבל כל אחד?`,
 cols:[{h:'אח א׳',c:COL[0]},{h:'אח ב׳',c:COL[1]},{h:'אח ג׳',c:COL[2]},{h:'שלם',c:PU}],r:[a,b,c,a+b+c],q:[a*k,b*k,c*k,T],giv:[[0,0],[0,1],[0,2],[1,3]],anc:3,part:k,
 ans:[{label:'אח א׳',col:COL[0],val:a*k},{label:'אח ב׳',col:COL[1],val:b*k},{label:'אח ג׳',col:COL[2],val:c*k}],diag:([x,y,z])=>{
  if(x===T/3&&y===T/3)return 'חילקתם לשלושה אנשים. מחלקים ב<b>מספר החלקים</b>: '+M(a+' + '+b+' + '+c+' = '+(a+b+c))+'.';return null;}};}
function genWhy(){const [a,b]=pick(RATIOS),s=a+b;let N=R(15,60);const ok=N%s===0;const [g1,g2]=pick(GROUPS);
 return {kind:'חשיבה · האם ייתכן?',text:`בקבוצה ${M(N)} ${g1} ו${g2} יחד. האם ייתכן שהיחס בין ה${g1} ל${g2} הוא ${M(a+' : '+b)}?`,
 choice:[`כן, כי ${N} מתחלק ב־${s} (מספר החלקים)`,`לא, כי ${N} לא מתחלק ב־${s} (מספר החלקים)`,`כן, תמיד אפשר לחלק לפי יחס`,`לא, כי ${N} לא מתחלק ב־${a}`],correct:ok?0:1,
 cols:[{h:g1,c:COL[0]},{h:g2,c:COL[1]},{h:'שלם',c:PU}],r:[a,b,s],q:ok?[a*N/s,b*N/s,N]:['?','?',N],giv:[[0,0],[0,1],[1,2]],anc:2,part:ok?N/s:null,why:true};}
const FR=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;

 V.innerHTML=`<div class="card pop"><h1>מבחן מדורג</h1><p>יחס ופרופורציה · 16 שאלות · 4 רמות חשיבה.<br>מתחילים קל, ועולים לאט. אין זמן, אין לחץ.<br>במבחן אין "הראו לי". בסוף מקבלים <b>דוח אישי</b>: באיזו רמה אני, מה חסר לי, והאם אני מוכן/ה לעלות הקבצה.</p>
 <div class="levels" style="grid-template-columns:1fr;gap:8px">${TL.map((t,i)=>`<div style="border-right:5px solid ${TCOL[i]};padding:6px 10px;background:var(--chip);border-radius:10px">${t} · 4 שאלות</div>`).join('')}</div>
 <p style="margin-top:16px">השם שלי:</p><input class="nameIn" id="nm" value="${nm.replace(/"/g,'')}" aria-label="השם שלי">
 <div class="btns"><button class="btn main" id="go" type="button">מתחילים</button><button class="btn sec" id="bk" type="button">חזרה</button></div></div>`;
 $('#bk').onclick=menu;$('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#nm').focus();$('#nm').style.borderColor='var(--red)';return;}store.set('name',n);
  const list=[],lv=[];TEST.forEach((g,i)=>shuf(g).forEach(f=>{list.push(f);lv.push(i);}));
  S={mode:'test',i:0,score:0,n:16,list,lv,res:[],name:n};next();};}
function ansText(q){if(q.choice)return q.choice[q.correct];if(q.ratio)return M(q.ans.map(a=>a.val).join(' : '));return q.ans.map(a=>(a.label?a.label+': ':'')+M(a.val)).join(' · ');}
function ruleOf(q){return q.rule||(q.ratio?'שתי כמויות ← מצמצמים ליחס: מחלקים את שתיהן באותו מספר.':q.why?'אפשר לחלק לפי יחס רק אם השלם מתחלק ב<b>מספר החלקים</b>.':q.rect?'אורך + רוחב = <b>חצי</b> היקף. זה השלם בטבלה.':'טבלה ← עוגן (עמודה שבה ידועים גם החלקים וגם הכמות) ← חלק אחד ← כופלים.');}
function endTest(){const per=[0,0,0,0];S.res.forEach(r=>{if(r.ok)per[r.lv]++;});const sc=per.reduce((a,b)=>a+b,0);
 const up=sc>=14&&per.every(x=>x>=3),weak=per.findIndex(x=>x<3),d=new Date().toLocaleDateString('he-IL');
 store.set('test',{sc,d,per});
 const v=up?{c:'var(--ok)',t:`מוכן/ה לעלות הקבצה! 🎉 שלטת בכל ארבע הרמות.`}
  :sc>=10?{c:'var(--acc)',t:`קרוב מאוד! כדי לעלות הקבצה צריך לחזק את רמה ${TL[weak]}.`}
  :{c:'var(--red)',t:`בונים יסודות: תרגלו קודם ★ ו־★★, ואז נסו שוב. כל ניסיון מקרב!`};
 const seen={},miss=S.res.filter(r=>!r.ok).filter(r=>{const k=r.q.kind;if(seen[k])return false;return seen[k]=1;});
 const seen2={},good=S.res.filter(r=>r.ok).filter(r=>{const k=r.q.kind;if(seen2[k])return false;return seen2[k]=1;});
 const grade=Math.round(sc/16*100);
 const todo=[];per.forEach((x,i)=>{if(x<3){const r=S.res.find(y=>!y.ok&&y.lv===i);const tp=r&&/פרופורציה|משתלם|מחיר/.test(r.q.kind)?'פרופורציה':'יחס';
   todo.push(`לתרגל <b>${tp} ${'★'.repeat(i+1)}</b> (20 שאלות). טעיתם? לוחצים על "הראו לי" ורואים את הדרך.`);}});
 if(per[0]<3)todo.unshift('לעבור שוב על <b>התזכורת המונפשת והחימום</b> (כפתור "מתחילים כאן").');
 todo.push(up?'לנסות את רמה ★★★★ בכל הנושאים, כדי להישאר חזקים.':'אחרי התרגול: <b>מבחן חוזר</b>, ולבדוק אם הציון עלה.');
 V.innerHTML=`<div class="card pop"><h2>הדוח של ${S.name.replace(/[<>&"]/g,'')}</h2><div class="meta"><span>מבחן מדורג · יחס ופרופורציה</span><span>${d}</span></div>
 <div class="big">ציון: ${grade}</div><div style="text-align:center;color:var(--muted)">${sc} תשובות נכונות מתוך 16</div>
 ${TL.map((t,i)=>`<div class="lvrow"><span class="nm">${t}</span><span class="bar"><i style="width:${per[i]/4*100}%;background:${TCOL[i]}"></i></span><span class="sc">${per[i]}/4</span></div>`).join('')}
 <div class="verdict" style="border:2px solid ${v.c};background:color-mix(in srgb,${v.c} 14%,transparent)">${v.t}</div>
 ${good.length?`<h2>✅ מה אני כבר יודע/ת</h2><div class="chips">${good.map(r=>`<span>${TL[r.lv].split(' ')[0]} ${r.q.kind}</span>`).join('')}</div>`:''}
 ${miss.length?`<h2>🔧 מה עוד חסר לי</h2>${miss.map(r=>`<div class="miss"><span class="k">${TL[r.lv].split(' ')[0]} ${r.q.kind}</span><br>${ruleOf(r.q)}<br><span style="color:var(--muted)">התשובה הנכונה הייתה: ${ansText(r.q)}</span></div>`).join('')}`:'<p>אין טעויות בכלל. כל הכבוד!</p>'}
 <h2>👣 מה לעשות עכשיו</h2>${todo.map((t,i)=>`<div class="miss"><b style="color:var(--acc)">${i+1}.</b> ${t}</div>`).join('')}
 <p style="margin-top:12px;color:var(--muted)">📸 צלמו את המסך ושלחו למורה.</p>
 <div class="btns"><button class="btn main" id="pr" type="button">${up?'לתפריט':'לתרגול מה שחסר'}</button><button class="btn sec" id="ag" type="button">מבחן חוזר</button></div>
 <div class="foot" style="margin-top:10px"><b>ערכה: רוני מודן · שחקים</b></div></div>`;
 $('#ag').onclick=testIntro;$('#pr').onclick=()=>{if(up)return menu();const L=Math.max(0,weak);const r=S.res.find(x=>!x.ok&&x.lv===L);
  CT=r&&/פרופורציה|משתלם|מחיר/.test(r.q.kind)?1:0;start(Math.min(L,3));};
 window.scrollTo(0,0);}
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const ONSITE=/github\.io$/.test(location.hostname)&&location.hostname!=='htmlpreview.github.io';
const INST=IOS&&!STANDALONE&&ONSITE;
if(ONSITE&&'serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
 if(window.caches)caches.open('aplik-v1').then(c=>c.addAll([location.pathname,'h8_ratio.webmanifest','icon-ratio-180.png','icon-ratio-192.png'])).catch(()=>{});}
$('#home').onclick=menu;menu();
</script></body></html>
