<style>
*{box-sizing:border-box;margin:0;padding:0}

.exp.ok{background:#f0fdf4;border-right:6px solid #16a34a}
.exp.no{background:#fef2f2;border-right:6px solid #dc2626}

.next{background:#7c3aed;color:#fff;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:bold;width:100%;margin-top:12px;cursor:pointer}

.foot{color:#c4b5fd;text-align:center;font-size:13px;margin-top:10px}
.rev{border-bottom:1px solid #eee;padding:10px 0;font-size:15px;line-height:1.6}
.f sup{font-size:.7em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em}

svg{display:block;max-width:100%;margin:6px auto}
.qr{background:#fff;border:2px dashed #c4b5fd;border-radius:10px;padding:9px;margin:6px 0 10px;font-size:15px}
.exp{font-size:17px;line-height:1.8}
.stg{display:grid;grid-template-columns:auto auto auto auto;justify-content:start;column-gap:6px;row-gap:2px;align-items:center;margin:2px 0}.stg .sl{white-space:nowrap}.stg .sw{grid-column:1/-1}.stg .sb{text-align:left}.stg .sa{text-align:right}.stg .se{font-weight:bold;color:#6d28d9;text-align:center}

.k{display:inline-block;background:#374151;color:#fff;border-radius:6px;padding:1px 7px;margin:2px 1px;font-size:.9em;box-shadow:0 2px 0 #111;font-weight:bold}
.calc{background:#ecfeff;border-right:5px solid #0891b2;border-radius:10px;padding:8px 10px;margin-top:10px;line-height:2}
.lvl-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}.lvl-row span:first-child{width:120px}.lvb{flex:1;height:12px;background:#eee;border-radius:6px;overflow:hidden}.lvb i{display:block;height:100%}
.fb{background:#f5f3ff;border-radius:10px;padding:10px;margin:8px 0;font-size:16px;line-height:1.7}.fb.ok{background:#f0fdf4}.fb.no{background:#fff7ed;border-right:5px solid #f59e0b}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.gc{background:#fff;border:3px solid #e5e7eb;border-radius:12px;padding:4px;text-align:center;cursor:pointer;font-size:14px;position:relative}
.gc.sel{border-color:#f59e0b;box-shadow:0 0 0 4px #fde68a}
.gc .bd{position:absolute;top:4px;right:6px;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;font-weight:bold;font-size:14px}
.mc{background:#f5f3ff;border:2px solid #ddd6fe;border-radius:12px;padding:10px 6px;font-size:15px;line-height:1.7;cursor:pointer;color:#1f2937;text-align:center}
.mc.dn{color:#fff;cursor:default}.mc.dn .f,.mc.dn b{color:#fff!important}
.bz-t{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:6px 0 10px}.bz-t i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#f59e0b,#dc2626);width:100%}
.bz-h{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:17px;color:#fff;margin:4px 0}
.bz-s{font-size:26px;color:#facc15}.bz-f{animation:pu .5s ease-in-out 2 alternate;display:inline-block}
.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.flt{position:fixed;left:50%;top:40%;font-size:34px;font-weight:bold;color:#16a34a;pointer-events:none;animation:flt 1s ease forwards;z-index:9}@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-90px)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:cf 2.4s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.qin{animation:dp .5s cubic-bezier(.3,1.6,.6,1)}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ap{opacity:0;animation:fi .6s ease forwards}@keyframes fi{to{opacity:1}}
.dp{opacity:0;animation:dp .7s cubic-bezier(.3,1.6,.6,1) forwards}@keyframes dp{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu .7s ease-in-out 4 alternate}@keyframes pu{to{transform:scale(1.7)}}
.mv{animation:mv 1.1s ease-in-out forwards}@keyframes mv{to{transform:translate(var(--dx),var(--dy))}}
.anim p{margin-bottom:6px}
.spbtn{position:fixed;left:10px;bottom:10px;z-index:20;background:#facc15;color:#1f2937;border:0;border-radius:22px;padding:8px 12px;font-size:15px;opacity:.92;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer}
.sp{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column}.sp[hidden]{display:none}
.sptl{display:flex;gap:6px;padding:8px;background:#1e1b4b;align-items:center;flex-wrap:wrap}.sptl button{border:0;border-radius:10px;padding:9px 12px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff}
.sptl .on{outline:3px solid #facc15}
body:has(.spbtn){padding-bottom:64px}
#spcv{flex:1;width:100%;touch-action:none;background-color:#fff;background-image:linear-gradient(#e0e7ff 1px,transparent 1px),linear-gradient(90deg,#e0e7ff 1px,transparent 1px);background-size:24px 24px}

<script>
var D={title:"שכיחות ושכיחות יחסית",icon:"📊",flashSub:"מושג / שאלה ← תשובה"};
function K(s){return '[['+s.split(' ').map(function(t){return '⌈'+t+'⌉';}).join(' ')+']]';}
function CA(k,r,n){return '<div class="calc">🧮 <b>במחשבון:</b> '+K(k)+' ← <b>'+r+'</b>'+(n?'<br>'+n:'')+'</div>';}
D.svg={
a:'<table><tr><th>מספר אחים</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>שכיחות (תלמידים)</th><td>3</td><td>8</td><td>9</td><td>4</td><td>1</td></tr></table>',
b:'<svg viewBox="0 0 290 205" width="290" direction="ltr" style="max-width:100%"><g font-size="11" fill="#555">'+[0,2,4,6,8,10,12,14,16].map(function(v){var y=170-v*9;return '<line x1="34" y1="'+y+'" x2="280" y2="'+y+'" stroke="#e5e7eb"/><text x="28" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';}).join('')+'</g><line x1="34" y1="170" x2="280" y2="170" stroke="#111" stroke-width="2"/><line x1="34" y1="170" x2="34" y2="20" stroke="#111" stroke-width="2"/>'+[[222,12,'#dc2626','תפוח'],[167,8,'#eab308','בננה'],[112,14,'#7c3aed','ענבים'],[57,6,'#16a34a','אבטיח']].map(function(b){return '<rect x="'+b[0]+'" y="'+(170-b[1]*9)+'" width="36" height="'+(b[1]*9)+'" fill="'+b[2]+'" rx="3"/><text x="'+(b[0]+18)+'" y="188" font-size="13" text-anchor="middle" font-weight="bold">'+b[3]+'</text>';}).join('')+'<text x="157" y="203" font-size="11" text-anchor="middle" fill="#555">הפרי האהוב – 40 תלמידים</text></svg>'
};
D.summary=[
["🔢 שכיחות","<p><b>שכיחות</b> = כמה פעמים משהו הופיע.</p><p>👀 שאלנו 25 תלמידים כמה אחים יש להם:</p>"+D.svg.a+"<p>ל-9 תלמידים יש 2 אחים ← השכיחות של 2 היא <b>9</b>.</p><div class='tip'>💡 מחברים את כל השכיחויות ← מקבלים את מספר המשתתפים: [[3 + 8 + 9 + 4 + 1 = 25]]</div>"],
["🍕 שכיחות יחסית","<p><b>שכיחות יחסית</b> = איזה <b>חלק</b> מכל המשתתפים.</p><p>[[שכיחות יחסית = {{השכיחות|סך הכול}}]]</p><p>2 אחים: 9 מתוך 25 ← [[{{9|25}} = 0.36 = 36%]]</p><div class='tip'>💡 אפשר לכתוב בשלוש דרכים: שבר [[{{9|25}}]], עשרוני [[0.36]], אחוזים [[36%]]. כולן אותו דבר!</div>"],
["✅ שני חוקים שתמיד נכונים","<p>1️⃣ שכיחות יחסית היא תמיד בין 0 ל-1 (בין 0% ל-100%).</p><p>2️⃣ סכום כל השכיחויות היחסיות = 1 (= 100%).</p><div class='tip'>⚠️ יצא לך סכום של 110%? יש טעות בחישוב!</div>"],
["🔁 מהשכיחות היחסית בחזרה לשכיחות","<p>200 תלמידים, שכיחות יחסית 0.4 ← [[200 · 0.4 = 80]] תלמידים.</p><p>מחפשים את <b>סך הכול</b>? 12 תלמידים הם 0.3 ← [[12 : 0.3 = 40]]</p>"],
["📊 דיאגרמת עמודות","<p>הגובה של כל עמודה = השכיחות.</p>"+D.svg.b+"<p>תפוח 12, בננה 8, ענבים 14, אבטיח 6 ← ביחד 40.</p>"],
["⚖️ משווים קבוצות בגודל שונה","<p>כיתה א: 9 מתוך 20 אוהבים מתמטיקה. כיתה ב: 12 מתוך 30.</p><p>בכיתה ב יותר תלמידים, אבל משווים <b>חלקים</b>:</p><p>א: [[{{9|20}} = 45%]] · ב: [[{{12|30}} = 40%]] ← בכיתה א אוהבים <b>יותר</b>.</p><div class='tip'>💡 קבוצות בגודל שונה ← משווים שכיחות יחסית, לא שכיחות.</div>"],
["🧮 במחשבון","<p>שכיחות יחסית: "+K("9 ÷ 25 =")+" ← 0.36</p><p>באחוזים: "+K("9 ÷ 25 × 100 =")+" ← 36</p><p>שכיחות מתוך השכיחות היחסית: "+K("200 × 0.4 =")+" ← 80</p>"]
];
D.tips=[
["🔤 שכיחות או שכיחות יחסית?",["<b>שכיחות</b> = <b>כמה</b> (מספר שלם: 9 תלמידים).","<b>שכיחות יחסית</b> = <b>איזה חלק</b> (שבר, עשרוני או אחוז).","\"יחסית\" = ביחס לכולם ← תמיד מחלקים בסך הכול."]],
["🍕 משבר לאחוזים בלי מחשבון",["מתוך 25 ← כופלים למעלה ולמטה פי 4: [[{{8|25}} = {{32|100}} = 32%]].","מתוך 20 ← פי 5. מתוך 50 ← פי 2.","[[{{1|4}} = 25%]] · [[{{1|2}} = 50%]] · [[{{3|4}} = 75%]] · [[{{1|5}} = 20%]]"]],
["⚠️ מלכודות",["שוכחים לחשב את <b>סך הכול</b> – קודם מחברים את כל השכיחויות!","\"יותר תלמידים\" זה לא \"חלק גדול יותר\". קבוצות שונות ← משווים אחוזים.","\"לפחות 3\" = 3 ומעלה. \"פחות מ-2\" = 0 ו-1 בלבד."]],
["✅ בדיקה",["סכום השכיחויות = מספר המשתתפים.","סכום השכיחויות היחסיות = 1 (100%).","שכיחות יחסית גדולה מ-1? בטוח יש טעות."]]
];
D.flash=[["מה זו שכיחות?","כמה פעמים משהו הופיע"],["מה זו שכיחות יחסית?","[[{{השכיחות|סך הכול}}]] – איזה חלק מכולם"],["סכום כל השכיחויות היחסיות","1 (= 100%)"],["9 מתוך 25 – כמספר עשרוני","[[0.36]]"],["8 מתוך 25 – באחוזים","[[32%]]"],["12 מתוך 40 – כמספר עשרוני","[[0.3]]"],["[[{{3|5}}]] באחוזים","[[60%]]"],["200 משתתפים, שכיחות יחסית 0.4. השכיחות?","80"],["12 הם 0.3 מהכול. כמה בסך הכול?","40"],["שכיחות יחסית 0.5 פירושה…","חצי מהמשתתפים"],["האם שכיחות יחסית יכולה להיות 1.2?","לא! תמיד בין 0 ל-1"],["משווים קבוצות בגודל שונה בעזרת…","שכיחות יחסית (אחוזים)"]];
var R=[
["טבלת שכיחויות",1,"לפי הטבלה: לכמה תלמידים יש 2 אחים?",["9","2","25","4"],"👀 מחפשים בשורה העליונה את 2, ויורדים לשורה של השכיחות.<br>1️⃣ מתחת ל-2 כתוב 9.<br>✅ ל-9 תלמידים יש 2 אחים.<br>⚖️ 2 זה מספר האחים, לא מספר התלמידים.","a"],
["טבלת שכיחויות",1,"לפי הטבלה: כמה תלמידים השתתפו בסקר?",["25","5","10","16"],"👀 כל תלמיד נמצא בטבלה פעם אחת.<br>1️⃣ מחברים את כל השכיחויות: [[3 + 8 + 9 + 4 + 1]]<br>2️⃣ [[= 25]]<br>✅ 25 תלמידים.<br>⚖️ 10 זה סכום מספרי האחים (0+1+2+3+4) – לא נכון.","a"],
["טבלת שכיחויות",1,"מהי <b>שכיחות</b>?",["מספר הפעמים שמשהו הופיע","איזה חלק הוא מכל המשתתפים","הערך הגדול ביותר בטבלה","סכום כל הערכים"],"👀 בכיתה 9 תלמידים עם 2 אחים ← \"2 אחים\" הופיע 9 פעמים.<br>✅ שכיחות = כמה פעמים משהו הופיע.<br>⚖️ \"איזה חלק\" זו שכיחות <b>יחסית</b>."],
["טבלת שכיחויות",2,"לפי הטבלה: לכמה תלמידים יש <b>לפחות</b> 3 אחים?",["5","4","1","12"],"👀 \"לפחות 3\" = 3 או יותר ← 3 אחים וגם 4 אחים.<br>1️⃣ 3 אחים: 4 תלמידים<br>2️⃣ 4 אחים: תלמיד 1<br>3️⃣ [[4 + 1 = 5]]<br>✅ 5 תלמידים.","a"],
["טבלת שכיחויות",2,"לפי הטבלה: לכמה תלמידים יש <b>פחות מ-2</b> אחים?",["11","9","8","20"],"👀 \"פחות מ-2\" = 0 או 1 (בלי 2!).<br>1️⃣ 0 אחים: 3 תלמידים<br>2️⃣ אח אחד: 8 תלמידים<br>3️⃣ [[3 + 8 = 11]]<br>✅ 11 תלמידים.","a"],
["טבלת שכיחויות",2,"בכיתה 30 תלמידים. במבחן: 12 קיבלו \"טוב\", 10 קיבלו \"טוב מאוד\", והשאר \"מצוין\". כמה קיבלו \"מצוין\"?",["8","18","22","10"],"👀 כל הכיתה = 30. מורידים את מי שכבר ספרנו.<br>1️⃣ [[12 + 10 = 22]]<br>2️⃣ [[30 − 22 = 8]]<br>✅ 8 תלמידים.<br>🔁 בדיקה: [[12 + 10 + 8 = 30]] ✔️"],

  var f=document.createElement('div');f.className='flt';f.dir='ltr';f.textContent='+'+g;document.body.appendChild(f);setTimeout(function(){f.remove();},1000);
  document.getElementById('bzp').textContent=BZ.pts;document.getElementById('bzst').innerHTML=BZ.st>1?'<span class="bz-f">🔥 רצף '+BZ.st+'</span>':'';
  document.getElementById('ex').innerHTML='<div class="fb ok pop">✅ נכון! '+(left>12?'⚡ ובמהירות!':'')+'</div>';
  setTimeout(bnext,1300);return;}
 BZ.st=0;wrong.push(x);if(b){b.classList.add('no','shake');}
 document.getElementById('ex').innerHTML='<div class="exp no"><b class="h">'+(b?'❌ לא נורא! הנה איפה טעינו:':'⏰ נגמר הזמן! הנה הפתרון:')+'</b><div class="qr">🎯 <b>התשובה הנכונה:</b> '+F(x.o[0])+'</div>'+EX(x.e)+'</div><button class="next" onclick="bnext()">'+(i<list.length-1?'לשאלה הבאה ←':'לתוצאות 🏁')+'</button>';
}
function bnext(){if(mode!='blitz')return;i++;if(i<list.length)bask();else bend();}
function bend(){
 mode='w';var p=good/list.length,s=p>=.9?3:p>=.7?2:p>=.5?1:0;
 var h='<div class="card" style="text-align:center"><h2>⚡ סיום מבחן הבזק!</h2><div style="font-size:44px;letter-spacing:6px">'+[1,2,3].map(function(k){return '<span class="dp" style="animation-delay:'+(k*.35)+'s;'+(k>s?'filter:grayscale(1);opacity:.35':'')+'">⭐</span>';}).join('')+'</div><div class="score" id="bzf">0</div><div>נקודות</div><div style="font-size:18px;margin:10px 0">'+good+' מתוך '+list.length+' נכונות · 🔥 הרצף הכי ארוך: '+BZ.best+'</div>'+
 '<div class="fb '+(p>=.7?'ok':'no')+'">'+(p>=.9?'🏆 אלופים! מהירים ומדויקים.':p>=.7?'💪 יפה מאוד! עוד סיבוב ואתם שם.':p>=.5?'👍 בדרך הנכונה – כדאי לעבור על הטעויות למטה.':'📘 כדאי לקרוא את הסיכום ואת הטיפים, ואז לנסות שוב.')+'</div>';
 if(wrong.length){h+='<button class="next" style="background:#db2777" onclick="start(wrong.slice(),\'w\')">🔁 לתרגל רק את '+wrong.length+' הטעויות (בלי שעון)</button><h3 style="color:#6d28d9;text-align:right">איפה טעיתי:</h3>';
  wrong.forEach(function(w){h+='<div class="rev" style="text-align:right">📝 '+F(w.q)+(w.d?D.svg[w.d]:'')+'<br>🎯 <b>'+F(w.o[0])+'</b><div class="exp ok" style="margin-top:6px">'+EX(w.e)+'</div></div>';});}
 app.innerHTML=h+'<button class="next" style="background:#f59e0b" onclick="blitz()">⚡ עוד סיבוב בזק</button><button class="next" onclick="home()">חזרה לתפריט</button></div>';window.scrollTo(0,0);
 var n=0,el=document.getElementById('bzf'),iv=setInterval(function(){n=Math.min(BZ.pts,n+Math.ceil(BZ.pts/40)+1);if(el)el.textContent=n;if(n>=BZ.pts)clearInterval(iv);},30);
 if(p>=.7)for(var k=0;k<40;k++){var c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=MC[k%4];c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(function(c){return function(){c.remove();};}(c),3400);}
}
function end(){
 var p=Math.round(good/list.length*100),msg=p>=90?'🏆 מצוין! מוכנים למבחן!':p>=75?'💪 טוב מאוד! עוד קצת חיזוק ומגיעים':p>=55?'👍 בדרך הנכונה – כדאי לחזק את הנושאים למטה':'📘 כדאי לקרוא שוב את הסיכום והטיפים, ואז לנסות שוב';
 var h='<div class="card"><div style="text-align:center;font-size:16px;color:#666">'+(mode=='test'?'הציון שלך במבחן הדמה':'התוצאה שלך')+'</div><div class="score">'+p+'</div><div style="text-align:center;font-size:18px;margin:6px 0 14px">'+good+' מתוך '+list.length+' נכונות<br>'+msg+'</div>';
 if(mode=='test'){
  var ML=D.maxL||3,lv={};for(var l=1;l<=ML;l++)lv[l]=[0,0];var tp={},order=[];
  list.forEach(function(q){var ok=wrong.indexOf(q)<0;lv[q.l][1]++;if(ok)lv[q.l][0]++;if(!tp[q.t]){tp[q.t]=[0,0];order.push(q.t);}tp[q.t][1]++;if(ok)tp[q.t][0]++;});
  var nm=D.lvNames||{1:'★ בסיס',2:'★★ הבנה',3:'★★★ חשיבה גבוהה'};
  h+='<h3 style="color:#6d28d9">📊 לפי רמות חשיבה</h3>';
  Object.keys(lv).map(Number).forEach(function(l){if(!lv[l][1])return;var r=lv[l][0]/lv[l][1];h+='<div class="lvl-row"><span>'+nm[l]+'</span><span class="lvb"><i style="width:'+Math.round(r*100)+'%;background:'+(r>=0.8?'#16a34a':r>=0.5?'#f59e0b':'#dc2626')+'"></i></span><b>'+lv[l][0]+'/'+lv[l][1]+'</b></div>';});
  var weak=order.filter(function(t){return tp[t][0]<tp[t][1];}),strong=order.filter(function(t){return tp[t][0]==tp[t][1];});
  h+='<h3 style="color:#6d28d9;margin-top:12px">📝 משוב – מה צריך לדעת</h3>';
  if(strong.length)h+='<div class="fb ok">✅ <b>יודעים טוב:</b> '+strong.join(' · ')+'</div>';
  weak.forEach(function(t){h+='<div class="fb no">📘 <b>לחזק: '+t+'</b> ('+tp[t][0]+'/'+tp[t][1]+')<br>💡 '+F((D.know&&D.know[t])||'כדאי לקרוא שוב את הסיכום של הנושא הזה.')+'</div>';});
  if(!weak.length)h+='<div class="fb ok">🌟 לא היו טעויות – כל הכבוד!</div>';
  else if(lv[ML][1]&&lv[ML][0]<lv[ML][1]&&lv[1][0]==lv[1][1])h+='<div class="fb">🎯 הבסיס חזק! עכשיו כדאי לתרגל שאלות '+'★'.repeat(ML)+' – לקרוא את השאלה לאט ולצייר.</div>';
  else if(lv[1][0]<lv[1][1])h+='<div class="fb">🎯 כדאי להתחיל מהבסיס: לקרוא את הסיכום, ואז לתרגל את הטעויות.</div>';
 }
 if(wrong.length){
  h+='<button class="next" style="background:#db2777" onclick="start(wrong.slice(),\'w\')">🔁 תרגל שוב רק את '+wrong.length+' הטעויות</button><h3 style="margin-top:14px;color:#6d28d9">איפה טעיתי:</h3>';
  wrong.forEach(function(w){h+='<div class="rev">📝 '+F(w.q)+(w.d?D.svg[w.d]:'')+'<br>🎯 <b>'+F(w.o[0])+'</b><div class="exp ok" style="margin-top:6px">'+EX(w.e)+'</div></div>';});
 }
 if(mode=='test')h+='<button class="next" style="background:#16a34a" onclick="start(mock(),\'test\')">🏁 מבחן דמה חדש (שאלות אחרות)</button>';
 app.innerHTML=h+'<button class="next" onclick="home()">חזרה לתפריט</button></div>';
 window.scrollTo(0,0);
}

if(D.scratch){document.body.insertAdjacentHTML('beforeend','<button class="spbtn" id="spb" type="button" aria-label="פתיחת דף טיוטה">✏️ טיוטה</button><div class="sp" id="sp" hidden role="dialog" aria-label="דף טיוטה"><div class="sptl"><button type="button" id="spx">✖ סגירה</button><button type="button" class="spk on" data-c="#111" style="color:#111">● שחור</button><button type="button" class="spk" data-c="#2563eb" style="color:#2563eb">● כחול</button><button type="button" class="spk" data-c="#dc2626" style="color:#dc2626">● אדום</button><button type="button" class="spk" data-c="er">🧽 מחק</button><button type="button" id="spu">↶ ביטול</button><button type="button" id="spcl">🗑️ נקה</button></div><canvas id="spcv"></canvas></div>');
 (function(){var sp=document.getElementById('sp'),cv=document.getElementById('spcv'),cx=cv.getContext('2d'),col='#111',st=[],cur=null;
  function fit(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);draw();}
  function draw(){cx.clearRect(0,0,cv.width,cv.height);st.forEach(function(s){cx.globalCompositeOperation=s.c=='er'?'destination-out':'source-over';cx.strokeStyle=s.c=='er'?'#000':s.c;cx.lineWidth=s.c=='er'?22:3;cx.lineCap=cx.lineJoin='round';cx.beginPath();s.p.forEach(function(p,k){k?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);});cx.stroke();});cx.globalCompositeOperation='source-over';}
  function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);cur={c:col,p:[pt(e)]};st.push(cur);});
  cv.addEventListener('pointermove',function(e){if(!cur)return;cur.p.push(pt(e));draw();});
  ['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(){cur=null;});});
  document.getElementById('spb').onclick=function(){sp.hidden=false;fit();};
  document.getElementById('spx').onclick=function(){sp.hidden=true;};
  document.getElementById('spu').onclick=function(){st.pop();draw();};
  document.getElementById('spcl').onclick=function(){st=[];draw();};
  document.querySelectorAll('.spk').forEach(function(b){b.onclick=function(){col=b.dataset.c;document.querySelectorAll('.spk').forEach(function(x){x.classList.toggle('on',x===b);});};});
  window.addEventListener('resize',function(){if(!sp.hidden)fit();});
  window.spReset=function(){st=[];if(!sp.hidden)draw();};})();}
if(/quick/.test(location.hash))setTimeout(blitz,0);
home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});}
