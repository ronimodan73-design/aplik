};
D.summary=[
["⚫ ממה בנוי כל חומר?","<p>כל חומר בנוי מ<mark><b>חלקיקים זעירים</b></mark>. אי אפשר לראות אותם בעין.</p><p>החלקיקים <mark><b>נעים כל הזמן</b></mark>, בכל מצב צבירה.</p><p>בין החלקיקים יש <mark><b>ריק</b></mark>, כלומר מקום שאין בו שום חומר. גם לא אוויר!</p><div class='tip'>💡 אוויר הוא בעצמו חלקיקים. לכן <b>בין</b> חלקיקי האוויר אין אוויר – יש ריק.</div>"],
["⚖️ מסה ונפח","<table><tr><th>מסה</th><th>נפח</th></tr><tr><td>כמה <b>חומר</b> יש</td><td>כמה <b>מקום</b> החומר תופס</td></tr><tr><td>גרם, קילוגרם</td><td>מיליליטר, ליטר</td></tr></table><div class='tip'>💡 אם לא נוספו חלקיקים ולא יצאו חלקיקים ← <b>המסה לא משתנה</b>. גם כשהחומר מתאדה, נדחס או מתחמם.</div>"],
["🧊💧💨 שלושת מצבי הצבירה","/*S*/<table><tr><th></th><th>מרחק</th><th>תנועה</th></tr><tr><td><b>מוצק</b></td><td>צפוף</td><td>רועדים סביב מקום קבוע</td></tr><tr><td><b>נוזל</b></td><td>צפוף</td><td>מחליקים ומחליפים מקום ← <mark>זורם</mark></td></tr><tr><td><b>גז</b></td><td>רחוק מאוד</td><td>עפים חופשי ← <mark>ממלא את כל הכלי</mark></td></tr></table><p><b>כוחות משיכה</b> בין חלקיקים פועלים <mark>בכל שלושת המצבים</mark>. בגז ההשפעה שלהם קטנה.</p>"],
["💥 לחץ של גז","/*P*/<p>חלקיקי הגז <b>פוגעים בדופן</b> שוב ושוב. הפגיעות האלה הן <mark><b>הלחץ</b></mark>.</p><p>⬆️ <b>יותר חלקיקים</b> באותו מכל ← יותר פגיעות ← <mark>לחץ גבוה יותר</mark>.</p><p>🔥 <b>מחממים</b> מכל קשיח ← החלקיקים מהירים יותר ← <mark>לחץ גבוה יותר</mark>.</p>"],
["🗜️ דחיסה ואידוי","<p><b>דוחסים גז</b> ← החלקיקים <mark>מתקרבים</mark>. המרווחים קטנים. החלקיקים עצמם לא מתכווצים.</p><p><b>נוזל כמעט לא נדחס</b> ← החלקיקים בו כבר צפופים.</p><p><b>אידוי</b> (נוזל ← גז) ← החלקיקים <mark>מתרחקים</mark> מאוד, ולכן שקית אטומה מתנפחת. מספר החלקיקים והמסה <b>לא משתנים</b>.</p><div class='tip'>⚠️ מלכודת: החלקיקים <b>לא גדלים</b> ולא קטנים. רק <b>המרחקים</b> ביניהם משתנים.</div>"],
["🌸 פעפוע","<p><mark><b>פעפוע</b></mark> = חלקיקים מתפזרים ומתערבבים בגלל שהם <b>זזים כל הזמן</b>. למשל ריח בושם שמגיע לכל החדר.</p><p>🔥 <b>חם יותר</b> ← הפעפוע <mark>מהיר יותר</mark>.</p><p>📏 <b>מרחק קצר יותר</b> ← הריח מגיע <mark>מוקדם יותר</mark>.</p><p>📦 אותו מספר חלקיקים ב<b>מקום גדול יותר</b> ← <mark>המרווחים ביניהם גדולים יותר</mark>.</p>"],
["🌡️ טמפרטורה ותנועה","<p>טמפרטורה <b>גבוהה</b> ← החלקיקים נעים <mark><b>מהר יותר</b></mark> בממוצע.</p><p>טמפרטורה <b>נמוכה</b> ← נעים <b>לאט יותר</b> (אבל לא עוצרים).</p><div class='tip'>💡 מוט ברזל מתארך כשמחממים אותו, כי החלקיקים <b>רועדים חזק יותר</b> והמרחקים ביניהם גדלים מעט. החלקיקים עצמם לא מתנפחים!</div>"]
];

["🧊💧💨 מצבי צבירה בשלוש מילים",["מוצק = <b>רועד במקום</b> 🧍","נוזל = <b>צפוף אבל מחליק</b> 🐟","גז = <b>רחוק ועף לכל מקום</b> 🐝","⚠️ מלכודת: גם במוצק החלקיקים זזים (רועדים)!"]],
["💥 לחץ = פגיעות",["לחץ = כמה פעמים החלקיקים <b>דופקים</b> על הדופן.","יותר חלקיקים או יותר חום ← יותר דפיקות ← יותר לחץ."]],
["🎈 החלקיקים לא משנים גודל",["חיממו? אידו? דחסו? ← החלקיקים <b>אותו גודל</b>.","מה משתנה? רק <b>המרחקים</b> ו<b>המהירות</b>."]],
["⚖️ מסה נשמרת",["שקית סגורה = <b>אף חלקיק לא יוצא</b> ← המסה אותו דבר.","גז תמיד ממלא את <b>כל</b> המכל ← נפח הגז = נפח המכל."]],
["🌸 פעפוע מהר יותר כש...",["🔥 חם יותר","📏 המרחק קצר יותר","💨 בגז מהר יותר מאשר בנוזל"]],
