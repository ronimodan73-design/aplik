*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Segoe UI",sans-serif;background:linear-gradient(160deg,#1e1b4b,#4c1d95);min-height:100vh;color:#1f2937;padding:14px}
.wrap{max-width:640px;margin:0 auto}
h1{color:#fff;text-align:center;font-size:26px;margin:6px 0 2px}
.sub{color:#ddd6fe;text-align:center;font-size:15px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.tag{display:inline-block;background:#ede9fe;color:#6d28d9;border-radius:8px;padding:3px 9px;font-size:13px;margin-bottom:8px}

.opt.no{background:#fee2e2;border-color:#dc2626}
.exp{border-radius:12px;padding:14px;margin-top:12px;font-size:16px;line-height:1.65}
.exp.ok{background:#f0fdf4;border-right:6px solid #16a34a}
.exp.no{background:#fef2f2;border-right:6px solid #dc2626}
.exp b.h{display:block;font-size:17px;margin-bottom:4px}

svg{display:block;max-width:100%;margin:6px auto}

.exp{font-size:17px;line-height:1.8}

73.4 156.0,177.0 158.0,180.3 160.0,183.1 162.0,185.5 164.0,187.4 166.0,188.8 168.0,189.7 170.0,190.0 172.0,189.7 174.0,188.8 176.0,187.2 178.0,184.9 180.0,181.9 182.0,178.1 184.0,173.6 186.0,168.2 188.0,162.1 190.0,155.0 192.0,147.0 194.0,138.2 196.0,128.3 198.0,117.5 200.0,105.6 202.0,92.7 204.0,78.7 206.0,63.6 208.0,47.4 210.0,30.0 212.0,11.4" fill="none" stroke="#6d28d9" stroke-width="3"/><circle cx="90" cy="30" r="4" fill="#db2777"/><circle cx="170" cy="190" r="4" fill="#0891b2"/></svg>'};
D.summary=[
["✂️ חיתוך עם הצירים","<p><b>ציר x</b>: מציבים [[y = 0]] ופותרים. <b>ציר y</b>: מציבים [[x = 0]].</p><p>[[f(x) = 2x - 6]]: ציר x ← [[(3, 0)]] · ציר y ← [[(0, -6)]]</p><div class='tip'>💡 נקודה על ציר x נראית תמיד [[(?, 0)]], ועל ציר y – [[(0, ?)]].</div>"],
["⛰️ נקודות קיצון","<p>מקסימום = \"פסגה\", מינימום = \"עמק\". כותבים נקודה שלמה [[(x, y)]].</p><p>בפרבולה [[y = ax^2 + bx + c]]: קודקוד ב-[[x = {{-b|2a}}]], ואז מציבים כדי למצוא את y.</p><p>[[a > 0]] ← מינימום (😊) · [[a &lt; 0]] ← מקסימום (☹️)</p><div class='tip'>💡 בצורה [[y = a(x - p)^2 + k]] הקודקוד הוא [[(p, k)]] – בלי חישוב.</div>"],
["↗️ עלייה וירידה","<p>קוראים את הגרף <b>משמאל לימין</b>. התחומים נכתבים לפי ערכי x בלבד.</p><p>פרבולה מחייכת עם קודקוד ב-[[x = 2]]: יורדת ב-[[x &lt; 2]], עולה ב-[[x > 2]].</p><div class='tip'>⚠️ הקיצון הוא הגבול בין עלייה לירידה.</div>"],
["➕➖ חיוביות ושליליות","<p>חיובית = הגרף <b>מעל</b> ציר x. שלילית = <b>מתחת</b>.</p><p>הגבולות הם נקודות האפס (חיתוך עם ציר x). [[x^2 - 4x]]: אפסים 0 ו-4, פרבולה מחייכת ← שלילית ב-[[0 &lt; x &lt; 4]].</p><div class='tip'>💡 עלייה/ירידה – לפי הקיצון. חיוביות/שליליות – לפי האפסים.</div>"],
["🧮 משוואות ממעלה 2 ו-3","<p><b>ממעלה 2</b>: [[x = {{-b ± √(b^2 - 4ac)|2a}}]]</p><p><b>ממעלה 3</b>: מוציאים גורם משותף ([[x]]) או מפרקים בקבוצות, ואז כל גורם = 0.</p><p>[[x^3 - 4x = 0]] ← [[x(x^2 - 4) = 0]] ← [[x = 0, 2, -2]]</p><div class='tip'>⚠️ לא מחלקים ב-x! מאבדים את הפתרון [[x = 0]].</div>"],
["⚡ פונקציות חזקה","<p><b>n זוגי</b> ([[x^2, x^4]]): צורת U, סימטרית לציר y, עוברת ב-[[(-1, 1)]], [[(0, 0)]], [[(1, 1)]].</p><p><b>n אי-זוגי</b> ([[x^3, x^5]]): צורת S, עולה תמיד, סימטרית לראשית, עוברת ב-[[(-1, -1)]], [[(0, 0)]], [[(1, 1)]].</p><div class='tip'>💡 בין 0 ל-1: ככל שהחזקה גדולה יותר – התוצאה קטנה יותר.</div>"],
["🧩 פולינומים","<p>המעלה = החזקה הגבוהה ביותר. ממעלה n יש <b>לכל היותר</b> n אפסים.</p><p>הצבה: [[f(-2)]] ← מציבים בסוגריים! [[(-2)^3 = -8]].</p><div class='tip'>💡 מקדם מוביל חיובי במעלה 3: שמאלה ← למטה, ימינה ← למעלה.</div>"],
["🪞 זוגית ואי-זוגית","<p><b>זוגית</b>: [[f(-x) = f(x)]] ← סימטריה לציר y.</p><p><b>אי-זוגית</b>: [[f(-x) = -f(x)]] ← סימטריה לראשית.</p><p>בפולינום: רק חזקות זוגיות (ומספר חופשי) ← זוגית. רק חזקות אי-זוגיות ← אי-זוגית. ערבוב ← אף אחת.</p>"],
["🚚 הזזות","<p>[[f(x) + k]] ← למעלה k · [[f(x) - k]] ← למטה k</p><p>[[f(x - p)]] ← <b>ימינה</b> p · [[f(x + p)]] ← <b>שמאלה</b> p</p><p>[[-f(x)]] ← שיקוף בציר x</p><div class='tip'>⚠️ בתוך הסוגריים הכיוון הפוך: מינוס = ימינה!</div>"],
["📏 קו ישר","<p>שיפוע: [[m = {{y<sub>2</sub> - y<sub>1</sub>|x<sub>2</sub> - x<sub>1</sub>}}]] · ישר: [[y - y<sub>1</sub> = m(x - x<sub>1</sub>)]]</p><p>מקבילים ← שיפוע שווה. מאונכים ← [[m<sub>1</sub> · m<sub>2</sub> = -1]].</p><p>אמצע: [[({{x<sub>1</sub> + x<sub>2</sub>|2}}, {{y<sub>1</sub> + y<sub>2</sub>|2}})]] · מרחק: [[√((x<sub>2</sub> - x<sub>1</sub>)^2 + (y<sub>2</sub> - y<sub>1</sub>)^2)]]</p>"],
["📐 גאומטריה ואנליטית","<p>שטח משולש: מוצאים בסיס וגובה (נוח על הצירים או על קו מאוזן).</p><p>זווית ישרה ← מכפלת שיפועים [[-1]]. שווה-שוקיים ← שתי צלעות באורך שווה (מרחק).</p><p>מקבילית ← האלכסונים חוצים זה את זה (אותה נקודת אמצע).</p><div class='tip'>💡 תמיד משרטטים סקיצה של הנקודות לפני שמחשבים.</div>"]
];
D.tips=[
["✂️ \"מי מתאפס?\"",["חיתוך עם ציר x = \"איפה y מתאפס\". חיתוך עם ציר y = \"איפה x מתאפס\".","הנקודה על ציר y היא תמיד המספר החופשי בפולינום."]],
["😊☹️ קיצון בפרבולה",["a חיובי = פרצוף מחייך = מינימום. a שלילי = עצוב = מקסימום.","[[x = {{-b|2a}}]] – לא לשכוח את המינוס!"]],
["👣 קוראים משמאל לימין",["כמו הליכה על הגרף: עולים בהר = עלייה, יורדים = ירידה.","תחומי עלייה/ירידה – לפי x של הקיצון. תחומי חיוביות – לפי האפסים."]],
["🚚 הזזות – \"בתוך הפוך\"",["מה שבתוך הסוגריים – הפוך: [[(x - 3)]] = ימינה 3.","מה שבחוץ – ישר: [[+2]] = למעלה 2."]],
["🪞 זוגית/אי-זוגית",["זוגית = \"מראה\" של ציר y (כמו פרפר 🦋).","אי-זוגית = סיבוב של חצי סיבוב סביב הראשית.","[[f(0)]] באי-זוגית (אם מוגדרת) = 0."]],
["⚠️ מלכודות",["[[(-2)^4 = 16]] אבל [[-2^4 = -16]].","[[x^6 = 64]] ← שני פתרונות [[±2]]. [[x^5 = -32]] ← פתרון אחד.","מאונך: הופכים <b>וגם</b> משנים סימן: 2 ← [[-{{1|2}}]]."]]
];

var R=[

["הזזות",3,"מה הקשר בין הגרף של [[-f(x)]] לגרף של [[f(x)]]?",["שיקוף בציר x","שיקוף בציר y","הזזה למטה","אין שינוי"],"1️⃣ כל ערך y מחליף סימן: [[(2, 5)]] ← [[(2, -5)]].<br>✅ שיקוף בציר x (\"היפוך\" למטה)<br>⚠️ שיקוף בציר y הוא [[f(-x)]]."],
["הזזות",3,"[[y = x^2 - 6x + 5]] מתקבלת מ-[[y = x^2]] על ידי:",["ימינה 3, למטה 4","שמאלה 3, למטה 4","ימינה 6, למעלה 5","ימינה 3, למעלה 5"],"1️⃣ קודקוד: [[x = {{6|2}} = 3]], [[y = 9 - 18 + 5 = -4]].<br>2️⃣ כלומר [[y = (x - 3)^2 - 4]].<br>✅ ימינה 3, למטה 4<br>⚠️ המספרים 6 ו-5 אינם ההזזות."],
["קו ישר",1,"מהו השיפוע של הישר העובר דרך [[(1, 2)]] ו-[[(3, 8)]]?",["3","[[{{1|3}}]]","[[-3]]","5"],"1️⃣ [[m = {{8 - 2|3 - 1}} = {{6|2}}]]<br>✅ 3<br>⚠️ [[{{1|3}}]] – מי שהפך מונה ומכנה."],
["קו ישר",1,"בישר [[y = 2x + 5]]:",["שיפוע 2, חותך את ציר y ב-5","שיפוע 5, חותך את ציר y ב-2","שיפוע 2, חותך את ציר x ב-5","שיפוע 7"],"1️⃣ בצורה [[y = mx + n]]: m = השיפוע, n = החיתוך עם ציר y.<br>✅ שיפוע 2, [[(0, 5)]]"],
["קו ישר",2,"מהי משוואת הישר העובר דרך [[(2, 3)]] ששיפועו [[-1]]?",["[[y = -x + 5]]","[[y = -x + 1]]","[[y = x + 1]]","[[y = -x - 5]]"],"1️⃣ [[y - 3 = -1 · (x - 2)]]<br>2️⃣ [[y - 3 = -x + 2]] ← [[y = -x + 5]]<br>🔍 בדיקה: [[-2 + 5 = 3]] ✓<br>✅ [[y = -x + 5]]"],
["קו ישר",2,"מהו הישר המקביל ל-[[y = 3x - 1]] ועובר דרך [[(0, 4)]]?",["[[y = 3x + 4]]","[[y = -{{1|3}}x + 4]]","[[y = 4x + 3]]","[[y = 3x - 1]]"],"1️⃣ מקביל ← אותו שיפוע: 3.<br>2️⃣ [[(0, 4)]] ← חותך את ציר y ב-4.<br>✅ [[y = 3x + 4]]<br>⚠️ [[-{{1|3}}]] זה שיפוע של ישר <b>מאונך</b>."],
["קו ישר",2,"מהו השיפוע של ישר המאונך ל-[[y = 2x + 1]]?",["[[-{{1|2}}]]","2","[[-2]]","[[{{1|2}}]]"],"1️⃣ מאונכים ← [[m<sub>1</sub> · m<sub>2</sub> = -1]]<br>2️⃣ [[2 · m = -1]] ← [[m = -{{1|2}}]]<br>✅ [[-{{1|2}}]] – הופכים וגם משנים סימן."],
["קו ישר",2,"מהי נקודת האמצע של הקטע בין [[(2, 6)]] ל-[[(8, -2)]]?",["[[(5, 2)]]","[[(3, 4)]]","[[(10, 4)]]","[[(6, -8)]]"],"1️⃣ [[x = {{2 + 8|2}} = 5]]<br>2️⃣ [[y = {{6 + (-2)|2}} = 2]]<br>✅ [[(5, 2)]]<br>⚠️ [[(3, 4)]] – חצי מההפרש, לא ממוצע."],
["קו ישר",3,"מהו המרחק בין [[(1, 1)]] ל-[[(4, 5)]]?",["5","7","25","[[√7]]"],"1️⃣ [[d = √((4 - 1)^2 + (5 - 1)^2)]]<br>2️⃣ [[√(9 + 16) = √25 = 5]]<br>✅ 5<br>⚠️ 25 – שכחו את השורש."],
["קו ישר",3,"מהי נקודת החיתוך של [[y = 2x - 1]] ו-[[y = -x + 5]]?",["[[(2, 3)]]","[[(3, 5)]]","[[(2, 1)]]","[[(-2, 7)]]"],"1️⃣ משווים: [[2x - 1 = -x + 5]]<br>2️⃣ [[3x = 6]] ← [[x = 2]]<br>3️⃣ [[y = 2 · 2 - 1 = 3]]<br>✅ [[(2, 3)]]<br>🔍 בישר השני: [[-2 + 5 = 3]] ✓"],
["גאומטריה ואנליטית",2,"מהו שטח המשולש שקודקודיו [[A(0, 0)]], [[B(6, 0)]], [[C(0, 4)]]?",["12","24","10","20"],"1️⃣ AB על ציר x: אורך 6. AC על ציר y: אורך 4.<br>2️⃣ זווית ישרה ב-A ← [[S = {{6 · 4|2}}]]<br>✅ 12<br>⚠️ 24 – שכחו לחלק ב-2."],
["גאומטריה ואנליטית",2,"מהו היקף המלבן [[A(1, 2)]], [[B(5, 2)]], [[C(5, 5)]], [[D(1, 5)]]?",["14","12","7","20"],"1️⃣ AB: [[5 - 1 = 4]]. BC: [[5 - 2 = 3]].<br>2️⃣ היקף: [[2 · (4 + 3) = 14]]<br>✅ 14<br>⚠️ 12 הוא השטח."],
["גאומטריה ואנליטית",2,"[[A(0, 0)]], [[B(4, 0)]], [[C(2, 5)]]. איזה משולש זה?",["שווה-שוקיים ([[AC = BC]])","שווה-צלעות","ישר-זווית","שונה-צלעות"],"1️⃣ [[AC = √(4 + 25) = √29]]<br>2️⃣ [[BC = √(4 + 25) = √29]]<br>3️⃣ [[AB = 4]]<br>✅ שווה-שוקיים"],
["גאומטריה ואנליטית",3,"[[A(0, 0)]], [[B(4, 2)]], [[C(3, -6)]]. האם המשולש ישר-זווית?",["כן, בקודקוד A","כן, בקודקוד B","כן, בקודקוד C","לא, אין זווית ישרה"],"1️⃣ [[m<sub>AB</sub> = {{2|4}} = {{1|2}}]]<br>2️⃣ [[m<sub>AC</sub> = {{-6|3}} = -2]]<br>3️⃣ [[{{1|2}} · (-2) = -1]] ← מאונכים<br>✅ זווית ישרה בקודקוד A"],
["גאומטריה ואנליטית",3,"ABCD מקבילית: [[A(0, 0)]], [[B(5, 1)]], [[C(7, 4)]]. מהי D?",["[[(2, 3)]]","[[(12, 5)]]","[[(-2, -3)]]","[[(3, 2)]]"],"1️⃣ האלכסונים חוצים זה את זה: אמצע AC = אמצע BD.<br>2️⃣ אמצע AC: [[(3.5, 2)]]<br>3️⃣ [[{{5 + x|2}} = 3.5]] ← [[x = 2]]; [[{{1 + y|2}} = 2]] ← [[y = 3]]<br>✅ [[D(2, 3)]]"],
["גאומטריה ואנליטית",3,"מהו שטח המשולש שיוצר הישר [[y = -2x + 6]] עם הצירים?",["9","18","36","12"],"1️⃣ ציר y: [[(0, 6)]]. ציר x: [[-2x + 6 = 0]] ← [[(3, 0)]].<br>2️⃣ משולש ישר-זווית בראשית: [[S = {{3 · 6|2}}]]<br>✅ 9"]
];
D.know={"חיתוך עם הצירים":"ציר x ← [[y = 0]]. ציר y ← [[x = 0]]. כותבים נקודה שלמה.","נקודות קיצון":"[[x = {{-b|2a}}]], מציבים למציאת y. [[a > 0]] מינימום, [[a &lt; 0]] מקסימום.","עלייה וירידה":"קוראים משמאל לימין; הגבולות – x של נקודות הקיצון.","חיוביות ושליליות":"הגבולות – האפסים. חיובית = מעל ציר x.","משוואות":"ממעלה 2 – נוסחת השורשים. ממעלה 3 – גורם משותף או פירוק בקבוצות. לא מחלקים ב-x!","פונקציות חזקה":"n זוגי: U, [[±]] פתרונות. n אי-זוגי: S, פתרון אחד ושומר סימן.","פולינומים":"מעלה = החזקה הגבוהה. מציבים מספר שלילי בסוגריים.","זוגית ואי-זוגית":"זוגית: [[f(-x) = f(x)]]. אי-זוגית: [[f(-x) = -f(x)]].","הזזות":"בתוך הסוגריים – הפוך (מינוס = ימינה). בחוץ – ישר.","קו ישר":"[[m = {{Δy|Δx}}]]. מקבילים – שיפוע שווה. מאונכים – [[m<sub>1</sub> · m<sub>2</sub> = -1]].","גאומטריה ואנליטית":"סקיצה קודם! שטח = בסיס · גובה : 2. זווית ישרה – מכפלת שיפועים [[-1]]."};

D.Q=R.map(function(r){return {t:r[0],l:r[1],q:r[2],o:r[3],e:r[4],d:r[5]};});
if(!D.svg)D.svg={};


function F(s){
 s=s.replace(/((?:🔵|🔴)[🔵🔴 ]*(?:🔵|🔴))|(🔵|🔴)/gu,function(m){return '<span dir="ltr" style="unicode-bidi:isolate">'+m+'</span>';});
 return s.replace(/\[\[(.+?)\]\]/g,function(_,x){
  x=x.replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  x=x.replace(/⌈(.+?)⌉/g,'<span class="k">$1</span>');
  return '<span class="f">'+x.replace(/\^(\d+)/g,'<sup>$1</sup>')+'</span>';});}
var Q=D.Q,SYM=D.flash,TIPS=D.tips;
var app=document.getElementById('app'),list=[],i=0,good=0,wrong=[],mode='';
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
function stars(l){return '★'.repeat(l)+'☆'.repeat(3-l);}
function home(){
 app.innerHTML='<h1>'+D.icon+' '+D.title+'</h1><div class="sub">מבחן 1 – פונקציות והנדסה אנליטית</div>'+
 '<button class="btn b1" onclick="summary()">📘 סיכום מהיר<small>כל החומר בדף אחד – קרא קודם</small></button>'+
 '<button class="btn" style="background:#ea580c" onclick="tips()">⚡ טיפים לזכירה מהירה<small>טריקים ומלכודות נפוצות</small></button>'+
 '<button class="btn b2" onclick="flash()">🔤 כרטיסיות<small>'+D.flashSub+'</small></button>'+
 '<button class="btn b3" onclick="start(Q,\'all\')">🧠 כל השאלות לפי סדר הנושאים<small>'+Q.length+' שאלות, הסבר מפורט אחרי כל תשובה</small></button>'+
 '<button class="btn b4" onclick="start(mock(),\'test\')">🏁 מבחן דמה<small>20 שאלות מעורבבות בכל הרמות · ציון ומשוב אישי</small></button>';
 window.scrollTo(0,0);
}
function summary(){
 var h='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>סיכום</span></div>';
 D.summary.forEach(function(c){h+='<div class="card sum"><h3>'+c[0]+'</h3>'+F(c[1])+'</div>';});
 app.innerHTML=h+'<button class="btn b4" onclick="start(Q,\'all\')">✅ קראתי – לשאלות!</button>';window.scrollTo(0,0);
}
function tips(){
 var h='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>טיפים לזכירה</span></div>';
 TIPS.forEach(function(b){h+='<div class="card sum"><h3>'+b[0]+'</h3>';b[1].forEach(function(t){h+='<p>• '+F(t)+'</p>';});h+='</div>';});
 app.innerHTML=h+'<button class="btn b4" onclick="start(mock(),\'test\')">🏁 עכשיו למבחן דמה!</button>';window.scrollTo(0,0);
}
var fl=[],fi=0;
function flash(){fl=sh(SYM);fi=0;showFlash(false);}
function showFlash(open){
 var s=fl[fi];
 app.innerHTML='<div class="top"><button class="back" onclick="home()">→ חזרה</button><span>'+(fi+1)+' / '+fl.length+'</span></div>'+
 '<div class="card flash"><div class="heb">'+F(s[0])+'</div><div style="margin:14px 0;color:#888">מה התשובה?</div>'+
 (open?'<div class="ans">'+F(s[1])+'</div>':'<button class="next" onclick="showFlash(true)">👀 הצג תשובה</button>')+'</div>'+
 (open?'<button class="next" onclick="'+(fi<fl.length-1?'fi++;showFlash(false)':'home()')+'">'+(fi<fl.length-1?'הבא ←':'סיום ✔')+'</button>':'');
}
function start(arr,m){list=arr;mode=m;i=0;good=0;wrong=[];ask();}
function ask(){
 var x=list[i],opts=sh(x.o.map(function(t,k){return {t:t,c:k===0};}));
 var h='<div class="top"><button class="back" onclick="home()">→ תפריט</button><span>שאלה '+(i+1)+' / '+list.length+' · ✅ '+good+'</span></div>'+
 '<div class="bar"><div style="width:'+(i/list.length*100)+'%"></div></div>'+
 '<div class="card"><span class="tag">'+x.t+'</span><span class="lvl">'+stars(x.l)+'</span><div class="q">'+F(x.q)+'</div>'+(x.d?D.svg[x.d]:'');
 opts.forEach(function(o,k){h+='<button class="opt" data-c="'+(o.c?1:0)+'" onclick="pick(this)">'+F(o.t)+'</button>';});
 app.innerHTML=h+'<div id="ex"></div></div>';
 window.scrollTo(0,0);
}
function pick(b){
 var all=document.querySelectorAll('.opt'),ok=b.dataset.c==='1',x=list[i];
 all.forEach(function(o){o.disabled=true;if(o.dataset.c==='1')o.classList.add('ok');});
 if(ok)good++;else{b.classList.add('no');wrong.push(x);}
 document.getElementById('ex').innerHTML='<div class="exp '+(ok?'ok':'no')+'"><b class="h">'+(ok?'✅ נכון! בואו נבין למה:':'❌ לא נורא! בואו נפתור ביחד:')+'</b><div class="qr">📝 <b>התרגיל:</b> '+F(x.q)+'<br>🎯 <b>התשובה הנכונה:</b> '+F(x.o[0])+'</div><b>👣 הפתרון צעד אחר צעד:</b><br>'+F(x.e)+'</div>'+
 '<button class="next" onclick="nxt()">'+(i<list.length-1?'לשאלה הבאה ←':'לתוצאות 🏁')+'</button>';
}
function nxt(){i++;if(i<list.length)ask();else end();}
function mock(){
 var want={1:6,2:8,3:6},out=[];
 [1,2,3].forEach(function(l){
  var pool=sh(Q.filter(function(q){return q.l==l;})),by={},keys=[];
  pool.forEach(function(q){if(!by[q.t]){by[q.t]=[];keys.push(q.t);}by[q.t].push(q);});
  keys=sh(keys);var k=0,n=0;
  while(n<want[l]&&pool.length>n){var t=keys[k%keys.length];if(by[t].length){out.push(by[t].shift());n++;}k++;if(k>500)break;}
 });
 while(out.length<20&&out.length<Q.length){var r=Q[Math.floor(Math.random()*Q.length)];if(out.indexOf(r)<0)out.push(r);}
 return sh(out);
}
function end(){
 var p=Math.round(good/list.length*100),msg=p>=90?'🏆 מצוין! מוכנים למבחן!':p>=75?'💪 טוב מאוד! עוד קצת חיזוק ומגיעים':p>=55?'👍 בדרך הנכונה – כדאי לחזק את הנושאים למטה':'📘 כדאי לקרוא שוב את הסיכום והטיפים, ואז לנסות שוב';
 var h='<div class="card"><div style="text-align:center;font-size:16px;color:#666">'+(mode=='test'?'הציון שלך במבחן הדמה':'התוצאה שלך')+'</div><div class="score">'+p+'</div><div style="text-align:center;font-size:18px;margin:6px 0 14px">'+good+' מתוך '+list.length+' נכונות<br>'+msg+'</div>';
 if(mode=='test'){
  var lv={1:[0,0],2:[0,0],3:[0,0]},tp={},order=[];
  list.forEach(function(q){var ok=wrong.indexOf(q)<0;lv[q.l][1]++;if(ok)lv[q.l][0]++;if(!tp[q.t]){tp[q.t]=[0,0];order.push(q.t);}tp[q.t][1]++;if(ok)tp[q.t][0]++;});
  var nm={1:'★ בסיס',2:'★★ הבנה',3:'★★★ חשיבה גבוהה'};
  h+='<h3 style="color:#6d28d9">📊 לפי רמות חשיבה</h3>';
  [1,2,3].forEach(function(l){if(!lv[l][1])return;var r=lv[l][0]/lv[l][1];h+='<div class="lvl-row"><span>'+nm[l]+'</span><span class="lvb"><i style="width:'+Math.round(r*100)+'%;background:'+(r>=0.8?'#16a34a':r>=0.5?'#f59e0b':'#dc2626')+'"></i></span><b>'+lv[l][0]+'/'+lv[l][1]+'</b></div>';});
  var weak=order.filter(function(t){return tp[t][0]<tp[t][1];}),strong=order.filter(function(t){return tp[t][0]==tp[t][1];});
  h+='<h3 style="color:#6d28d9;margin-top:12px">📝 משוב – מה צריך לדעת</h3>';
  if(strong.length)h+='<div class="fb ok">✅ <b>יודעים טוב:</b> '+strong.join(' · ')+'</div>';
  weak.forEach(function(t){h+='<div class="fb no">📘 <b>לחזק: '+t+'</b> ('+tp[t][0]+'/'+tp[t][1]+')<br>💡 '+F((D.know&&D.know[t])||'כדאי לקרוא שוב את הסיכום של הנושא הזה.')+'</div>';});
  if(!weak.length)h+='<div class="fb ok">🌟 לא היו טעויות – כל הכבוד!</div>';
  else if(lv[3][1]&&lv[3][0]<lv[3][1]&&lv[1][0]==lv[1][1])h+='<div class="fb">🎯 הבסיס חזק! עכשיו כדאי לתרגל שאלות ★★★ – לקרוא את השאלה לאט ולצייר.</div>';
  else if(lv[1][0]<lv[1][1])h+='<div class="fb">🎯 כדאי להתחיל מהבסיס: לקרוא את הסיכום, ואז לתרגל את הטעויות.</div>';
 }
 if(wrong.length){
  h+='<button class="next" style="background:#db2777" onclick="start(wrong.slice(),\'w\')">🔁 תרגל שוב רק את '+wrong.length+' הטעויות</button><h3 style="margin-top:14px;color:#6d28d9">איפה טעיתי:</h3>';
  wrong.forEach(function(w){h+='<div class="rev">📝 '+F(w.q)+(w.d?D.svg[w.d]:'')+'<br>🎯 <b>'+F(w.o[0])+'</b><div class="exp ok" style="margin-top:6px">'+F(w.e)+'</div></div>';});
 }
 if(mode=='test')h+='<button class="next" style="background:#16a34a" onclick="start(mock(),\'test\')">🏁 מבחן דמה חדש (שאלות אחרות)</button>';
 app.innerHTML=h+'<button class="next" onclick="home()">חזרה לתפריט</button></div>';
 window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});}
