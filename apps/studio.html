<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>סטודיו החלומות</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Assistant","Rubik",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#3b0764,#0f0a1e 60%);color:#f5f3ff;min-height:100vh;padding-bottom:40px}
header{text-align:center;padding:16px 10px 6px}
header h1{font-size:28px;background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:#c4b5fd;font-size:15px}
main{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin:12px 0}
.card h2{font-size:20px;margin-bottom:10px}
#stage{display:flex;justify-content:center}
#cv{height:min(62vh,640px);aspect-ratio:9/16;border-radius:18px;background:#000;box-shadow:0 10px 40px rgba(168,85,247,.45);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:17px;font-weight:bold;cursor:pointer;color:#fff;background:#7c3aed;font-family:inherit}
.btn.pink{background:linear-gradient(90deg,#db2777,#f97316)}
.btn.gray{background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.4}
.big{flex:1;min-width:140px}
.chip{border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 13px;font-size:16px;cursor:pointer;font-family:inherit}
.chip.on{border-color:#fde047;background:rgba(253,224,71,.18)}
input[type=text]{width:100%;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:17px;padding:10px;font-family:inherit;margin:4px 0}
label.lb{display:block;color:#c4b5fd;font-size:14px;margin:8px 0 2px}
.file{display:block;text-align:center;border:2px dashed #a78bfa;border-radius:14px;padding:16px;cursor:pointer;font-size:17px;font-weight:bold}
.file input{display:none}
#thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:70px;height:100px;border-radius:10px;overflow:hidden;background:#222}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.th span{position:absolute;bottom:2px;right:5px;font-weight:bold;text-shadow:0 0 4px #000}
#status{text-align:center;min-height:24px;margin-top:8px;color:#fde047;font-weight:bold}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fde047;color:#3b0764;padding:12px 16px;border-radius:14px;font-weight:bold;display:none;z-index:9;max-width:92%;text-align:center}
input[type=range]{width:100%}
.note{font-size:14px;color:#c4b5fd;margin-top:6px;line-height:1.5}
footer{text-align:center;color:#a78bfa;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header><h1>🎬 סטודיו החלומות</h1><p>תמונות · שיר · כתוביות ← קליפ וואו בלחיצה אחת</p></header>
<main>
  <div class="card">
    <div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
    <div class="row" style="margin-top:12px">
      <button class="btn big" id="playBtn" onclick="togglePlay()">▶️ צפייה</button>
      <button class="btn pink big" id="recBtn" onclick="record()">🎬 שמירת הקליפ</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>👤 מי החולם?</h2>
    <label class="lb">שם</label>
    <input type="text" id="name" value="נועה" oninput="changed()">
    <div class="row" style="margin-top:6px" id="gen"></div>
    <label class="lb">החלום</label>
    <div class="row" id="dreams"></div>
    <input type="text" id="dreamOther" placeholder="חלום אחר? כתבו כאן, למשל: וטרינרית" oninput="changed()">
    <label class="lb">חזק כמו…</label>
    <div class="row" id="animals"></div>
  </div>

  <div class="card">
    <h2>📸 תמונות</h2>
    <label class="file">➕ הוספת תמונות<input type="file" id="photoIn" accept="image/*" multiple></label>
    <div id="thumbs"></div>
    <p class="note">כל תמונה מקבלת כתובית משלה, והתמונה האחרונה היא רגע השיא. מומלץ 4–8 תמונות.</p>
    <button class="btn gray" style="width:100%;margin-top:8px" onclick="geminiPrompt()">✨ תמונת חלום ב־Gemini (מעתיק הוראה מוכנה)</button>
  </div>

  <div class="card">
    <h2>🎵 שיר</h2>
    <div class="row" id="music"></div>
    <label class="file" id="songBox" style="display:none;margin-top:10px">📁 בחירת שיר מהטלפון<input type="file" id="songIn" accept="audio/*"></label>
    <div id="startBox" style="display:none">
      <label class="lb">מאיזו שנייה בשיר להתחיל: <b id="startV">0</b></label>
      <input type="range" id="start" min="0" max="120" step="1" value="0" oninput="startV.textContent=this.value">
    </div>
  </div>

  <div class="card">
    <h2>💬 כתוביות</h2>
    <div id="caps"></div>
    <button class="btn gray" style="width:100%;margin-top:8px" onclick="regenCaps(true)">🔄 כתוביות מחדש לפי הפרטים</button>
  </div>
  <footer>ערכה: רוני מודן · שחקים</footer>
</main>
<div id="toast"></div>

<script>
/* ======= נתונים ======= */
const W=720,H=1280,cv=document.getElementById('cv'),cx=cv.getContext('2d');
const DREAMS=[['מהנדס','מהנדסת','🛠️'],['רופא','רופאה','🩺'],['טייס','טייסת','✈️'],['מדען','מדענית','🔬'],['אסטרונאוט','אסטרונאוטית','🚀'],['מתכנת','מתכנתת','💻'],['ספורטאי','ספורטאית','🏆'],['אמן','אמנית','🎨'],['זמר','זמרת','🎤'],['מורה','מורה','📚']];
const ANIMALS=[['אריה','🦁'],['נמר','🐯'],['נשר','🦅'],['פיל','🐘'],['דוב','🐻']];
const STYLES={epic:{bpm:96,prog:[[57,60,64],[57,60,65],[55,60,64],[55,59,62]],bass:[45,41,48,43],label:'🔥 אפי (מקורי)'},
              happy:{bpm:116,prog:[[55,60,64],[55,59,62],[57,60,64],[57,60,65]],bass:[48,43,45,41],label:'😄 שמח (מקורי)'}};
let G='f',dreamI=0,animalI=0,music='epic',photos=[],caps=null,capsEdited=false,song=null;
const $=id=>document.getElementById(id);
const F=(m,f)=>G==='f'?f:m;
function toast(s,ms){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms||2800)}
function chips(id,items,cur,fn){$(id).innerHTML=items.map((x,i)=>`<button class="chip${i===cur?' on':''}" data-i="${i}">${x}</button>`).join('');
  $(id).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;fn(+b.dataset.i)}}
function drawChips(){chips('gen',['👦 בן','👧 בת'],G==='m'?0:1,i=>{G=i?'f':'m';drawChips();changed()});
  chips('dreams',DREAMS.map(d=>d[2]+' '+F(d[0],d[1])),dreamI,i=>{dreamI=i;$('dreamOther').value='';drawChips();changed()});
  chips('animals',ANIMALS.map(a=>a[1]+' '+a[0]),animalI,i=>{animalI=i;drawChips();changed()});
  chips('music',[STYLES.epic.label,STYLES.happy.label,'📁 שיר שלי'],['epic','happy','own'].indexOf(music),i=>{music=['epic','happy','own'][i];
    $('songBox').style.display=music==='own'?'block':'none';$('startBox').style.display=music==='own'&&song?'block':'none';drawChips()})}
function dreamWord(){const o=$('dreamOther').value.trim();return o||F(DREAMS[dreamI][0],DREAMS[dreamI][1])}
function dreamEmoji(){return $('dreamOther').value.trim()?'⭐':DREAMS[dreamI][2]}

/* ======= כתוביות ======= */
function regenCaps(force){if(capsEdited&&!force)return renderCapInputs();capsEdited=false;
  const a=ANIMALS[animalI],n=Math.max(0,photos.length-1);
  const pool=[F('כל יום אני לומד משהו חדש','כל יום אני לומדת משהו חדש'),F('גם כשקשה, אני לא מוותר','גם כשקשה, אני לא מוותרת'),
    F('אני מאמין בעצמי','אני מאמינה בעצמי'),'כל טעות מלמדת אותי משהו',F('צעד אחרי צעד, אני מתקדם','צעד אחרי צעד, אני מתקדמת'),F('אני חולם בגדול','אני חולמת בגדול')];
  caps={intro:'יש לי חלום…',name:$('name').value.trim()||'החולם',mont:Array.from({length:n},(_,i)=>pool[i%pool.length]),
    c1:'אני אהיה',c2:dreamWord()+'!',tag:`${F('חזק','חזקה')} כמו ${a[0]} ${a[1]}`,outro:'החלום מתחיל עכשיו ✨'};
  renderCapInputs()}
function renderCapInputs(){const rows=[['intro','פתיחה'],['name','שם']].concat(caps.mont.map((_,i)=>['m'+i,'תמונה '+(i+1)]),[['c1','שיא – שורה 1'],['c2','שיא – שורה 2'],['tag','שיא – תגית'],['outro','סיום']]);
  $('caps').innerHTML=rows.map(([k,l])=>`<label class="lb">${l}</label><input type="text" data-k="${k}" value="${(k[0]==='m'&&k!=='m'?caps.mont[+k.slice(1)]:caps[k]).replace(/"/g,'&quot;')}">`).join('');
  $('caps').oninput=e=>{const k=e.target.dataset.k;if(!k)return;capsEdited=true;if(/^m\d+$/.test(k))caps.mont[+k.slice(1)]=e.target.value;else caps[k]=e.target.value;if(!playing)drawIdle()}}
function changed(){regenCaps(false);if(capsEdited){caps.name=$('name').value.trim()||caps.name;renderCapInputs()}if(!playing)drawIdle()}

/* ======= תמונות ======= */
$('photoIn').onchange=async e=>{for(const f of e.target.files){const img=await loadImg(f);if(img)photos.push(img)}e.target.value='';thumbs();regenCaps(false);if(capsEdited){while(caps.mont.length<photos.length-1)caps.mont.push('');caps.mont.length=Math.max(0,photos.length-1);renderCapInputs()}drawIdle()};
function loadImg(f){return new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.src=u;r(c)};im.onerror=()=>{toast('לא הצלחתי לפתוח תמונה אחת');r(null)};im.src=u})}
function thumbs(){$('thumbs').innerHTML=photos.map((p,i)=>`<div class="th"><img src="${p.src}"><button onclick="delPhoto(${i})">✖</button><span>${i+1}${i===photos.length-1?' ⭐':''}</span></div>`).join('')}
function delPhoto(i){photos.splice(i,1);thumbs();regenCaps(false);if(capsEdited){caps.mont.length=Math.max(0,photos.length-1);renderCapInputs()}drawIdle()}
function geminiPrompt(){const t=`צור תמונה מציאותית וקולנועית של ${G==='f'?'הילדה':'הילד'} מהתמונה שאני מצרפת, כ${dreamWord()} ${G==='f'?'מצליחה':'מצליח'} בעתיד. שמור בדיוק על הפנים והמראה. תאורה דרמטית של שקיעה, אווירה מעוררת השראה, איכות של פוסטר קולנוע, פורמט אנכי 9:16.`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('✅ ההוראה הועתקה. ב־Gemini: מצרפים תמונה, מדביקים, ושולחים. את התוצאה שומרים ומוסיפים כאן.',5000),()=>prompt('העתיקו את ההוראה:',t));
  setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),400)}

/* ======= שיר ======= */
$('songIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;status('🎵 טוען את השיר…');
  try{const ac=getAC();const buf=await ac.decodeAudioData(await f.arrayBuffer());song={buf,name:f.name};$('start').max=Math.max(0,Math.floor(buf.duration-20));$('startBox').style.display='block';status('');toast('🎵 השיר נטען: '+f.name)}
  catch(err){status('');toast('לא הצלחתי לקרוא את השיר. נסו קובץ MP3.')}};
let AC=null;function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function detectBeat(buf,off){const sr=buf.sampleRate,d=buf.getChannelData(0),d2=buf.numberOfChannels>1?buf.getChannelData(1):d,hop=512,st=Math.floor(off*sr),N=Math.min(Math.floor(20*sr),d.length-st);
  const E=[];for(let i=0;i+hop<N;i+=hop){let s=0;for(let j=0;j<hop;j++){const v=d[st+i+j]+d2[st+i+j];s+=v*v}E.push(Math.sqrt(s/hop))}
  const O=E.map((e,i)=>i?Math.max(0,e-E[i-1]):0),fps=sr/hop;let best=-1,bpm=100;
  for(let b=70;b<=160;b+=.5){const lag=fps*60/b;let s=0,c=0;for(let i=0;i+lag+1<O.length;i++){const k=i+lag,k0=Math.floor(k),fr=k-k0;s+=O[i]*(O[k0]*(1-fr)+O[k0+1]*fr);c++}s/=c||1;if(s>best){best=s;bpm=b}}
  while(bpm<80)bpm*=2;while(bpm>160)bpm/=2;const lag=fps*60/bpm;let bp=-1,ph=0;
  for(let p=0;p<lag;p++){let s=0;for(let k=p;k<O.length;k+=lag)s+=O[Math.round(k)]||0;if(s>bp){bp=s;ph=p}}
  return{beat:60/bpm,phase:ph/fps,bpm}}

/* ======= מוזיקה מקורית ======= */
const trackCache={};
async function renderTrack(style,T){const key=style+T;if(trackCache[key])return trackCache[key];
  const S=STYLES[style],beat=60/S.bpm,sr=44100,dur=T*beat+2.5,oc=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),C=T-12;
  const master=oc.createGain();master.gain.value=.55;const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;master.connect(comp);comp.connect(oc.destination);
  const rev=oc.createConvolver(),ib=oc.createBuffer(2,sr*2.4,sr);for(let c=0;c<2;c++){const a=ib.getChannelData(c);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3)}
  rev.buffer=ib;const rg=oc.createGain();rg.gain.value=.35;rev.connect(rg);rg.connect(master);
  const nb=oc.createBuffer(1,sr,sr),na=nb.getChannelData(0);for(let i=0;i<na.length;i++)na[i]=Math.random()*2-1;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function env(g,t,v,a,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d)}
  function kick(t,v){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(g,t,v,.003,.42);o.connect(g);g.connect(master);o.start(t);o.stop(t+.5)}
  function nz(t,v,type,f,d,q){const s=oc.createBufferSource();s.buffer=nb;const fl=oc.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;const g=oc.createGain();env(g,t,v,.002,d);s.connect(fl);fl.connect(g);g.connect(master);g.connect(rev);s.start(t);s.stop(t+d+.05)}
  const snare=(t,v)=>{nz(t,v,'bandpass',1800,.2,.7);tone('triangle',190,t,.09,v*.5,3000,false)};
  const hat=(t,v)=>nz(t,v,'highpass',7500,.05);
  function tone(type,f,t,len,v,cut,wet){const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;env(g,t,v,.008,len);o.connect(fl);fl.connect(g);g.connect(master);if(wet!==false)g.connect(rev);o.start(t);o.stop(t+len+.1)}
  function pad(ch,t,len,v,cut){ch.forEach(m=>[-8,8].forEach(dt=>{const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=dt;fl.type='lowpass';fl.frequency.value=cut;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.35);g.gain.setValueAtTime(v,t+len-.1);g.gain.linearRampToValueAtTime(0,t+len+.4);o.connect(fl);fl.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+len+.5)}))}
  function riser(t,len){const s=oc.createBufferSource();s.buffer=nb;s.loop=true;const fl=oc.createBiquadFilter();fl.type='bandpass';fl.Q.value=2;fl.frequency.setValueAtTime(400,t);fl.frequency.exponentialRampToValueAtTime(7000,t+len);
    const g=oc.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+len);g.gain.linearRampToValueAtTime(0,t+len+.05);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+len+.1)}
  function impact(t){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(28,t+1.2);env(g,t,1,.005,1.4);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.5);nz(t,.6,'lowpass',900,.9)}
  for(let i=0;i<T;i++){const t=i*beat,bar=Math.floor(i/4),ch=S.prog[bar%4],root=S.bass[bar%4],first=i%4===0;
    const intro=i<8,build=i>=8&&i<C,drop=i>=C&&i<C+8,outro=i>=C+8;
    if(first&&!outro)pad(ch,t,4*beat,drop?.05:.04,drop?2600:intro?800:1300);
    if(i===C+8)pad(ch,t,4*beat+1.5,.05,900);
    for(let h=0;h<2;h++){const tt=t+h*beat/2,arpN=ch[(i*2+h)%3]+12;
      if(i>=4&&!outro)tone('triangle',mf(arpN),tt,.28,intro?.05:drop?.085:.065,4000);
      if(build||drop)tone('sawtooth',mf(root),tt,beat*.45,drop?.2:.16,drop?700:450,false);
      if(build)hat(tt+beat/4,.05);}
    if(drop){const mel=[2,1,2,0,1,2,1,0];for(let h=0;h<2;h++)tone('square',mf(ch[mel[(i*2+h)%8]]+24),t+h*beat/2,beat*.4,.035,2500);
      for(let q=0;q<4;q++)hat(t+q*beat/4,q%2?.06:.035)}
    if(build&&i<C-4){if(i%2===0)kick(t,.9);else snare(t,.45)}
    if(i>=C-4&&i<C){kick(t,.8);const n=i<C-2?2:4;for(let r=0;r<n;r++)snare(t+r*beat/n,.18+.1*(i-C+4))}
    if(i===C-4)riser(t,4*beat);
    if(drop){kick(t,1);if(i%2)snare(t,.55);if(i===C)impact(t)}}
  const buf=await oc.startRendering();trackCache[key]=buf;return buf}

/* ======= ציר זמן ורינדור ======= */
function plan(){const n=photos.length,C=8+4*Math.max(0,n-1);return{n,C,T:C+12}}
const rnd=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const eob=x=>{x=Math.max(0,Math.min(1,x));const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function cover(img,zoom,px,py,rot){const s=Math.max(W/img.width,H/img.height)*zoom,dw=img.width*s,dh=img.height*s;cx.save();cx.translate(W/2+px,H/2+py);if(rot)cx.rotate(rot);cx.drawImage(img,-dw/2,-dh/2,dw,dh);cx.restore()}
function wrap(t,max){const w=t.split(' '),L=[];let cur='';w.forEach(x=>{const tr=cur?cur+' '+x:x;if(cx.measureText(tr).width>max&&cur){L.push(cur);cur=x}else cur=tr});if(cur)L.push(cur);return L}
function text(t,y,size,sc,alpha,band,col){if(!t||alpha<=0)return;cx.save();cx.globalAlpha=alpha;cx.translate(W/2,y);cx.scale(sc,sc);cx.direction='rtl';cx.textAlign='center';cx.textBaseline='middle';
  cx.font=`900 ${size}px "Rubik","Assistant","Arial Hebrew",Arial,sans-serif`;const L=wrap(t,W*.84/sc),lh=size*1.18,h0=-(L.length-1)*lh/2;
  L.forEach((l,i)=>{const y2=h0+i*lh,w=cx.measureText(l).width;
    if(band){cx.fillStyle=band;rr(-w/2-22,y2-size*.62,w+44,size*1.24,size*.3);cx.fill()}
    cx.lineWidth=size*.12;cx.strokeStyle='rgba(0,0,0,.55)';cx.lineJoin='round';cx.strokeText(l,0,y2);cx.fillStyle=col||'#fff';cx.shadowColor='rgba(0,0,0,.4)';cx.shadowBlur=12;cx.fillText(l,0,y2);cx.shadowBlur=0});cx.restore()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function grade(warm){const v=cx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');cx.fillStyle=v;cx.fillRect(0,0,W,H);
  cx.fillStyle=`rgba(255,140,40,${warm})`;cx.globalCompositeOperation='soft-light';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over'}
function dust(t,n,col){for(let i=0;i<n;i++){const sp=30+rnd(i)*60,x=(rnd(i+99)*W+Math.sin(t*.7+i)*30),y=H-((t*sp+rnd(i+7)*H)%(H+40)),s=1.5+rnd(i+3)*3.5;
  cx.globalAlpha=.35+.5*rnd(i+5)*(.6+.4*Math.sin(t*3+i));cx.fillStyle=col;cx.beginPath();cx.arc(x,y,s,0,7);cx.fill()}cx.globalAlpha=1}
function confetti(a){const cols=['#fde047','#f472b6','#60a5fa','#34d399','#fb923c','#a78bfa'];for(let i=0;i<140;i++){const ang=rnd(i)*Math.PI*2,sp=300+rnd(i+1)*700;
  const x=W/2+Math.cos(ang)*sp*a,y=H*.42+Math.sin(ang)*sp*a*.7+500*a*a;if(y>H+20)continue;cx.save();cx.translate(x,y);cx.rotate(a*8+i);cx.globalAlpha=clamp(2.6-a,0,1);cx.fillStyle=cols[i%6];cx.fillRect(-7,-4,14,8);cx.restore()}cx.globalAlpha=1}
function letterbox(k){const h=H*.09*k;cx.fillStyle='#000';cx.fillRect(0,0,W,h);cx.fillRect(0,H-h,W,h)}
function flash(k,col){if(k<=0)return;cx.fillStyle=col||'#fff';cx.globalAlpha=clamp(k,0,1);cx.fillRect(0,0,W,H);cx.globalAlpha=1}
function emoji(e,x,y,size,sc,alpha,rot){cx.save();cx.globalAlpha=alpha;cx.translate(x,y);cx.rotate(rot||0);cx.scale(sc,sc);cx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;cx.fillStyle="#000";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(e,0,0);cx.restore()}

function frame(t,beat){const {n,C,T}=plan(),b=t/beat,fb=b-Math.floor(b),pulse=Math.exp(-fb*7);cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(!n){text('הוסיפו תמונות 📸',H/2,60,1,1);return}
  const last=photos[n-1];
  if(b<8){ // פתיחה
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#000');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.globalAlpha=.25;cover(last,1.25+b*.01,0,0);cx.globalAlpha=1;grade(.1);dust(t,60,'#fde68a');
    emoji(dreamEmoji(),W/2,H*.3,170,1+.06*pulse*(b>=4),clamp((b-1)/3,0,.9),Math.sin(t)*.08);
    if(b<4){const k=clamp((b-.6)/1.6,0,1);text(caps.intro,H*.58,78,1+(1-k)*.25,k)}
    else{const k=eob((b-4)/.7);text(caps.intro,H*.48,48,1,clamp(1-(b-4)*2,0,1));text(caps.name,H*.58,150,(.2+.8*k)*(1+.05*pulse),1,null,'#fde047')}
    letterbox(clamp(1.3-b/6,0,1));if(b>=4)flash(1-(b-4)*4,'#fff');return}
  if(b<C){const i=Math.floor((b-8)/4),lb=(b-8)-i*4,img=photos[i],dir=i%2?-1:1;
    const z=1.08+(dir>0?lb*.035:(4-lb)*.035)+.035*pulse,px=dir*(lb-2)*12,rot=dir*.012*(lb-2);cover(img,z*(1+.12*Math.exp(-lb*5)),px,0,rot);grade(.12);dust(t,30,'#fff7cc');
    const k=eob((lb-.3)/.55);text(caps.mont[i],H*.79,62,.5+.5*k,clamp((lb-.3)*4,0,1),['rgba(219,39,119,.85)','rgba(124,58,237,.85)','rgba(234,88,12,.85)'][i%3]);
    emoji(dreamEmoji(),W-80,110,70,1+.15*pulse,.85,0);
    flash(1-lb*5,'#fff');if(b>C-4)flash((b-(C-4))/4*.35,'#fde047');return}
  if(b<C+8){const lb=b-C;cover(last,1.1+lb*.03+.06*pulse,Math.sin(lb*2)*4*(lb<1),0,0);grade(.25);dust(t,70,'#fde047');
    cx.fillStyle=`rgba(253,224,71,${.12*pulse})`;cx.fillRect(0,0,W,H);
    text(caps.c1,H*.6,70,eob(lb/.5),clamp(lb*4,0,1),'rgba(0,0,0,.5)');
    text(caps.c2,H*.71,118,eob((lb-1)/.6)*(1+.05*pulse),clamp((lb-1)*4,0,1),'rgba(124,58,237,.9)','#fde047');
    if(lb>=4){const k=eob((lb-4)/.6);emoji(ANIMALS[animalI][1],W/2,H*.3,200,k*(1+.08*pulse),1,Math.sin(t*20)*.08*Math.exp(-(lb-4)*2));text(caps.tag,H*.86,54,k,1,'rgba(219,39,119,.85)')}
    confetti(lb*beat);flash(1-lb*2.5,'#fff');return}
  const lb=b-C-8;cover(last,1.34+lb*.02,0,0);cx.fillStyle=`rgba(0,0,0,${clamp(.4+lb*.2,0,.9)})`;cx.fillRect(0,0,W,H);dust(t,50,'#fde68a');
  text(caps.outro,H*.46,74,eob(lb/.6),clamp(lb*3,0,1),null,'#fde047');text('ערכה: רוני מודן · שחקים',H*.9,30,1,clamp(lb-1,0,1)*.9);letterbox(clamp(lb/2,0,1))}

/* ======= הפעלה והקלטה ======= */
let playing=false,src=null,raf=0,rec=null,cur={beat:.6,T:0};
function status(s){$('status').textContent=s}
function drawIdle(){if(!caps)regenCaps(false);const {C}=plan(),beat=60/STYLES.epic.bpm;frame((C+5.5)*beat,beat)}
async function prepare(){const ac=getAC(),{n,T}=plan();if(!n){toast('📸 קודם מוסיפים תמונות');return null}
  if(music==='own'){if(!song){toast('📁 בחרו שיר מהטלפון');return null}const off=+$('start').value,bt=detectBeat(song.buf,off);return{buf:song.buf,offset:off+bt.phase,beat:bt.beat,T}}
  status('🎵 מלחינה את השיר…');const buf=await renderTrack(music,T);status('');return{buf,offset:0,beat:60/STYLES[music].bpm,T}}
async function start(recording){if(playing)stop();const m=await prepare();if(!m)return false;const ac=getAC();
  src=ac.createBufferSource();src.buffer=m.buf;const g=ac.createGain(),t0=ac.currentTime+.2,dur=m.T*m.beat;src.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(1,t0+dur-1.6);g.gain.linearRampToValueAtTime(0,t0+dur);
  let dest=null;if(recording){dest=ac.createMediaStreamDestination();g.connect(dest)}
  src.start(t0,m.offset);playing=true;cur={beat:m.beat,T:m.T,t0,dur,dest};$('playBtn').textContent='⏹️ עצירה';
  const tick=()=>{if(!playing)return;const t=ac.currentTime-t0;frame(Math.max(0,t),m.beat);
    if(recording)status('🎬 מקליטה… '+Math.min(100,Math.round(t/dur*100))+'%');
    if(t>=dur){stop();return}raf=requestAnimationFrame(tick)};tick();return true}
function stop(){playing=false;cancelAnimationFrame(raf);try{src&&src.stop()}catch(e){}src=null;$('playBtn').textContent='▶️ צפייה';if(rec&&rec.state==='recording')rec.stop();else drawIdle()}
function togglePlay(){getAC();playing?stop():start(false)}
async function record(){getAC();if(!window.MediaRecorder||!cv.captureStream){toast('הדפדפן הזה לא יודע לשמור וידאו. נסו בכרום או בספארי מעודכן.');return}
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'],type=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  $('recBtn').disabled=true;const ok=await start(true);if(!ok){$('recBtn').disabled=false;return}
  const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...cur.dest.stream.getAudioTracks()]);const chunks=[];
  rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:6e6}:{});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{const mt=rec.mimeType||type||'video/webm',ext=mt.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:mt}),fn=`חלום-${(caps.name||'קליפ').replace(/\s+/g,'-')}.${ext}`;
    $('recBtn').disabled=false;status('✅ הקליפ מוכן!');rec=null;drawIdle();const file=new File([blob],fn,{type:mt});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});return}catch(e){}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
    if(ext==='webm')toast('הקליפ נשמר. אם הוא לא נפתח בוואטסאפ, שמרו אותו מספארי באייפון (שם הוא נשמר כ־MP4).',6000)};
  rec.start(250)}

drawChips();regenCaps(true);drawIdle();
</script>
