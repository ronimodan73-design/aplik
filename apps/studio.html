<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סטודיו הקליפים</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Assistant","Rubik",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#3b0764,#0f0a1e 60%);color:#f5f3ff;min-height:100vh;padding-bottom:30px}
h1{text-align:center;font-size:26px;padding:12px 0 4px;background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:520px;margin:0 auto;padding:0 12px}
#stage{display:flex;justify-content:center;margin-top:6px}
#cv{height:min(56vh,600px);aspect-ratio:9/16;border-radius:18px;background:#000;box-shadow:0 10px 40px rgba(168,85,247,.45);max-width:100%;cursor:pointer}
#hint{text-align:center;color:#c4b5fd;font-size:15px;margin:6px 0}
#idea{width:100%;border-radius:16px;border:2px solid #a78bfa;background:rgba(0,0,0,.35);color:#fff;font-size:19px;padding:14px;font-family:inherit;margin:8px 0}
.big3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px}
.bb{border:0;border-radius:18px;padding:16px 6px;font-size:18px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit;line-height:1.3}
.bb span{display:block;font-size:34px}
#bPhotos{background:#7c3aed}#bSong{background:#0891b2}#bMake{background:linear-gradient(135deg,#db2777,#f97316)}
.bb:disabled{opacity:.45}
.hidefile{position:fixed;top:0;right:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
html,body{overflow-x:hidden}
#thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.th{position:relative;flex:0 0 54px;height:78px;border-radius:9px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th b{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#status{text-align:center;min-height:24px;margin-top:8px;color:#fde047;font-weight:bold;font-size:17px}
details{margin-top:14px;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 12px}
summary{font-size:17px;font-weight:bold;cursor:pointer}
label.lb{display:block;color:#c4b5fd;font-size:14px;margin:8px 0 2px}
.cap{width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-size:16px;padding:8px;font-family:inherit}
.ai{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:bold;color:#fff;background:#10a37f;margin-top:10px;cursor:pointer;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:#1e1b4b;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:18px}
.sheet h3{font-size:20px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:14px;padding:14px;font-size:18px;margin:8px 0;cursor:pointer;font-family:inherit}
.opt.on{border-color:#fde047;background:rgba(253,224,71,.15)}
input[type=range]{width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fde047;color:#3b0764;padding:12px 16px;border-radius:14px;font-weight:bold;display:none;z-index:9;max-width:92%;text-align:center}
footer{text-align:center;color:#a78bfa;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<h1>🎬 סטודיו הקליפים</h1>
<main>
  <div id="stage"><canvas id="cv" width="720" height="1280" onclick="togglePlay()"></canvas></div>
  <div id="hint">👆 לחיצה על המסך = צפייה</div>
  <input id="idea" placeholder="✨ מה הרעיון? למשל: טיול שנתי של ח׳3 לירושלים" oninput="regen();drawIdle()">
  <div class="big3">
    <button class="bb" id="bPhotos" onclick="pickPhotos()"><span>📸</span>תמונות</button>
    <button class="bb" id="bSong" onclick="openSong()"><span>🎵</span>שיר</button>
    <button class="bb" id="bMake" onclick="record()"><span>🎬</span>צור קליפ</button>
  </div>
  <input type="file" id="photoIn" class="hidefile" accept="image/*,video/*" multiple>
  <input type="file" id="songIn" class="hidefile" accept="audio/*">
  <div id="thumbs"></div>
  <div id="status"></div>
  <details>
    <summary>⚙️ עוד אפשרויות</summary>
    <button class="ai" onclick="gpt()">✨ ליצור תמונה מיוחדת ב־ChatGPT</button>
    <label class="lb">✏️ הכתוביות (אפשר לשנות כל שורה)</label>
    <div id="caps"></div>
  </details>
  <footer>ערכה: רוני מודן · שחקים</footer>
</main>
<div class="ov" id="ovSong" onclick="if(event.target===this)closeSong()"><div class="sheet">
  <h3>🎵 בחירת שיר</h3>
  <button class="opt" data-m="epic" onclick="setMusic('epic')">🔥 שיר מקורי – אפי ודרמטי</button>
  <button class="opt" data-m="happy" onclick="setMusic('happy')">😄 שיר מקורי – שמח וקצבי</button>
  <button class="opt" data-m="own" onclick="$('songIn').click()">📁 שיר מהטלפון</button>
  <div id="startBox" style="display:none"><label class="lb">מאיזו שנייה בשיר להתחיל: <b id="startV">0</b></label><input type="range" id="start" min="0" max="120" value="0" oninput="startV.textContent=this.value"></div>
  <button class="opt" style="background:#7c3aed;text-align:center;font-weight:bold" onclick="closeSong()">סיום</button>
</div></div>
<div id="toast"></div>
<script>
const W=720,H=1280,cv=document.getElementById('cv'),cx=cv.getContext('2d');
const STYLES={epic:{bpm:96,prog:[[57,60,64],[57,60,65],[55,60,64],[55,59,62]],bass:[45,41,48,43]},happy:{bpm:116,prog:[[55,60,64],[55,59,62],[57,60,64],[57,60,65]],bass:[48,43,45,41]}};
let photos=[],caps=null,capsEdited=false,song=null,music='epic',TH={e:'✨',ce:'🔥'};
const $=id=>document.getElementById(id);
function toast(s,ms){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms||2800)}

/* ===== רעיון ← כתוביות ===== */
const PLACES=['ירושלים','אילת','ים המלח','הצפון','הגליל','הגולן','תל אביב','חיפה','המדבר','הנגב','צפת','עכו','מצדה','הכנרת'];
function analyze(idea){const t=idea||'',cls=(t.match(/[א-ת]['׳]?\s?\d{1,2}/)||[''])[0].replace(/\s/,'').replace("'",'׳'),place=PLACES.find(p=>t.includes(p))||'';
  if(/טיול|גיחה|סיור|מסע/.test(t))return{e:'📍',ce:place==='ירושלים'?'🦁':'🏆',intro:'הטיול השנתי…',big:cls||place||'יוצאים לדרך',
    pool:['יוצאים לדרך 🚌','רגע של צחוק 😂','מקשיבים… כמעט','עוד תמונה קבוצתית 📸','הנופים האלה 😍','כוח לאנשים 💪','זוכרים את הרגע הזה?','החברים הכי טובים','ממשיכים ללכת… 🥵'],
    last:'בדרך הביתה… 😴',fz:['רגע… עצרו הכל ✋','זה הרגע שבו כולם הבינו שזה יהיה יום ארוך 😅'],c1:cls||'אנחנו',c2:cls?`כבשה את ${place||'השטח'}!`:`כבשנו את ${place||'השטח'}!`,tag:'הטיול הכי טוב 💙',outro:'איזה טיול ✨'};
  if(/הולדת/.test(t)){const nm=(t.match(/הולדת\s+(?:ל|של\s+)?([א-ת]+)/)||['',''])[1];return{e:'🎂',ce:'🎉',intro:'היום חוגגים…',big:nm||'מזל טוב',
    pool:['הכי מצחיק בעולם 😂','חבר אמיתי','תמיד עם חיוך','רגעים שלא שוכחים','מלך המסיבה 👑','ממשיכים לחגוג 🥳'],last:'וזה רק ההתחלה',c1:'מזל טוב',c2:nm?nm+'!':'יום הולדת שמח!',tag:'עד 120 🎈',outro:'שנה מדהימה ✨'}}
  if(/סיום|פרידה|סוף שנה/.test(t))return{e:'🎓',ce:'🎓',intro:'עוד שנה עברה…',big:cls||'השנה שלנו',pool:['איך שהזמן עובר','צחקנו','למדנו','גדלנו יחד','רגעים שלא שוכחים','החברים לכל החיים'],last:'ועכשיו…',c1:'כל הכבוד',c2:cls?cls+'!':'לכולנו!',tag:'גאים בכם 💙',outro:'להתראות בשנה הבאה ✨'};
  if(/חלום|אהיה|רוצה להיות/.test(t)){const nm=(t.match(/^([א-ת]+)/)||['',''])[1];return{e:'⭐',ce:'🦁',intro:'יש לי חלום…',big:nm||'החלום',pool:['כל יום לומדים משהו חדש','גם כשקשה, לא מוותרים','מאמינים בעצמנו','צעד אחרי צעד'],last:'חולמים בגדול',c1:'החלום',c2:'מתגשם!',tag:'חזקים כמו אריה 🦁',outro:'החלום מתחיל עכשיו ✨'}}
  return{e:'✨',ce:'🔥',intro:'מוכנים?',big:cls||(t.split(' ').slice(0,3).join(' '))||'הקליפ שלנו',pool:['רגעים שלא שוכחים','צחוק אמיתי 😂','ביחד זה הכי','עוד רגע מטורף','אנרגיות 🔥','זוכרים?'],last:'וזה עוד לא נגמר',c1:'פשוט',c2:'מושלם!',tag:'הכי טובים 💙',outro:'עד הפעם הבאה ✨'}}
function regen(){const a=analyze($('idea').value.trim());TH={e:a.e,ce:a.ce};if(capsEdited&&caps){caps.mont.length=Math.max(0,photos.length-1);for(let i=0;i<caps.mont.length;i++)if(caps.mont[i]==null)caps.mont[i]=a.pool[i%a.pool.length];return renderCaps()}
  const n=Math.max(0,photos.length-1);const FZ=a.fz||['רגע… עצרו הכל ✋','ואז… זה קרה 😅'];caps={intro:a.intro,name:a.big,mont:Array.from({length:n},(_,i)=>isFreeze(i,n+1)?FZ[i===2?0:1]:i===n-1&&n>2?a.last:a.pool[i<a.pool.length?i:1+(i-1)%(a.pool.length-1)]),c1:a.c1,c2:a.c2,tag:a.tag,outro:a.outro};renderCaps()}
function renderCaps(){const rows=[['intro','פתיחה'],['name','כותרת גדולה']].concat(caps.mont.map((_,i)=>['m'+i,'תמונה '+(i+1)]),[['c1','שיא – שורה 1'],['c2','שיא – שורה 2'],['tag','שיא – תגית'],['outro','סיום']]);
  $('caps').innerHTML=rows.map(([k,l])=>`<label class="lb">${l}</label><input class="cap" data-k="${k}" value="${String(/^m\d+$/.test(k)?caps.mont[+k.slice(1)]:caps[k]).replace(/"/g,'&quot;')}">`).join('');
  $('caps').oninput=e=>{const k=e.target.dataset.k;if(!k)return;capsEdited=true;if(/^m\d+$/.test(k))caps.mont[+k.slice(1)]=e.target.value;else caps[k]=e.target.value;if(!playing)drawIdle()}}
function gpt(){const t=`צור תמונה מציאותית וקולנועית מהתמונה שאני מצרף, לקליפ בנושא: ${$('idea').value.trim()||'רגע מיוחד'}. שמור בדיוק על הפנים של האנשים. תאורה דרמטית, צבעים חיים, איכות של פוסטר קולנוע, פורמט אנכי 9:16.`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('✅ ההוראה הועתקה. ב־ChatGPT: מצרפים תמונה, מדביקים ושולחים. את התמונה שמתקבלת שומרים ומוסיפים כאן ב־📸.',6000),()=>prompt('העתיקו את ההוראה:',t));
  setTimeout(()=>window.open('https://chatgpt.com/','_blank'),400)}

/* ===== תמונות ===== */
function pickPhotos(){$('photoIn').value='';$('photoIn').click()}
$('photoIn').addEventListener('change',async e=>{const fs=[...e.target.files];if(!fs.length)return;status('📸 טוענת '+fs.length+' תמונות…');
  for(const f of fs){const img=/^video/.test(f.type)?await loadVid(f):await loadImg(f);if(img)photos.push(img)}status('');thumbs();regen();drawIdle();toast('✅ נוספו '+fs.length+' תמונות')});
function loadVid(f){return new Promise(r=>{const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=u;
  let done=false;const fail=()=>{if(done)return;done=true;toast('סרטון אחד לא נפתח, דילגתי עליו');r(null)};const to=setTimeout(fail,15000);
  v.onerror=fail;v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)*.15)};v.onseeked=()=>{if(done)return;done=true;clearTimeout(to);
    const s=Math.min(1,960/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.vid=v;c.vstart=v.currentTime;c.src=c.toDataURL('image/jpeg',.6);v.onseeked=null;r(c)}})}
let liveKey=null,liveItem=null;
function liveVideo(item,key,lb){if(!item||!item.vid)return;const v=item.vid;
  if(!playing){return}
  if(liveKey!==key){if(liveItem&&liveItem.vid)liveItem.vid.pause();liveKey=key;liveItem=item;try{v.currentTime=item.vstart;v.play().catch(()=>{})}catch(e){}}
  v.playbackRate=lb<1?1.25:lb>2.7?.45:1;if(v.readyState>=2)item.getContext('2d').drawImage(v,0,0,item.width,item.height)}
function stopVideos(){photos.forEach(p=>p.vid&&p.vid.pause());liveKey=null;liveItem=null}
function loadImg(f){return new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.src=u;r(c)};im.onerror=()=>{toast('תמונה אחת לא נפתחה, דילגתי עליה');r(null)};im.src=u})}
function thumbs(){$('thumbs').innerHTML=photos.map((p,i)=>`<div class="th"><img src="${p.src}">${p.vid?'<i style="position:absolute;bottom:2px;right:4px;font-style:normal">🎬</i>':''}<b onclick="delPhoto(${i})">✖</b></div>`).join('')}
function delPhoto(i){photos.splice(i,1);thumbs();regen();drawIdle()}

/* ===== שיר ===== */
function openSong(){[...document.querySelectorAll('.opt[data-m]')].forEach(b=>b.classList.toggle('on',b.dataset.m===music));$('ovSong').classList.add('on')}
function closeSong(){$('ovSong').classList.remove('on')}
function setMusic(m){music=m;openSong()}
$('songIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;status('🎵 טוענת את השיר…');
  try{const buf=await getAC().decodeAudioData(await f.arrayBuffer());song={buf,name:f.name};music='own';$('start').max=Math.max(0,Math.floor(buf.duration-20));$('startBox').style.display='block';status('');openSong();toast('🎵 השיר נטען')}
  catch(err){status('');toast('לא הצלחתי לקרוא את השיר. נסו קובץ MP3.')}});
let AC=null;function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function detectBeat(buf,off){const sr=buf.sampleRate,d=buf.getChannelData(0),d2=buf.numberOfChannels>1?buf.getChannelData(1):d,hop=512,st=Math.floor(off*sr),N=Math.min(Math.floor(20*sr),d.length-st);
  const E=[];for(let i=0;i+hop<N;i+=hop){let s=0;for(let j=0;j<hop;j++){const v=d[st+i+j]+d2[st+i+j];s+=v*v}E.push(Math.sqrt(s/hop))}
  const O=E.map((e,i)=>i?Math.max(0,e-E[i-1]):0),fps=sr/hop;let best=-1,bpm=100;
  for(let b=70;b<=160;b+=.5){const lag=fps*60/b;let s=0,c=0;for(let i=0;i+lag+1<O.length;i++){const k=i+lag,k0=Math.floor(k),fr=k-k0;s+=O[i]*(O[k0]*(1-fr)+O[k0+1]*fr);c++}s/=c||1;if(s>best){best=s;bpm=b}}
  while(bpm<80)bpm*=2;while(bpm>160)bpm/=2;const lag=fps*60/bpm;let bp=-1,ph=0;
  for(let p=0;p<lag;p++){let s=0;for(let k=p;k<O.length;k+=lag)s+=O[Math.round(k)]||0;if(s>bp){bp=s;ph=p}}
  return{beat:60/bpm,phase:ph/fps,bpm}}

/* ======= מוזיקה מקורית ======= */
const trackCache={};
async function renderTrack(style,T){const key=style+T;if(trackCache[key])return trackCache[key];
  const S=STYLES[style],beat=60/S.bpm,sr=44100,dur=T*beat+2.5,oc=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),C=T-12;
  const master=oc.createGain();master.gain.value=.55;const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;master.connect(comp);comp.connect(oc.destination);
  const rev=oc.createConvolver(),ib=oc.createBuffer(2,sr*2.4,sr);for(let c=0;c<2;c++){const a=ib.getChannelData(c);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3)}
  rev.buffer=ib;const rg=oc.createGain();rg.gain.value=.35;rev.connect(rg);rg.connect(master);
  const nb=oc.createBuffer(1,sr,sr),na=nb.getChannelData(0);for(let i=0;i<na.length;i++)na[i]=Math.random()*2-1;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function env(g,t,v,a,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d)}
  function kick(t,v){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(g,t,v,.003,.42);o.connect(g);g.connect(master);o.start(t);o.stop(t+.5)}
  function nz(t,v,type,f,d,q){const s=oc.createBufferSource();s.buffer=nb;const fl=oc.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;const g=oc.createGain();env(g,t,v,.002,d);s.connect(fl);fl.connect(g);g.connect(master);g.connect(rev);s.start(t);s.stop(t+d+.05)}
  const snare=(t,v)=>{nz(t,v,'bandpass',1800,.2,.7);tone('triangle',190,t,.09,v*.5,3000,false)};
  const hat=(t,v)=>nz(t,v,'highpass',7500,.05);
  function tone(type,f,t,len,v,cut,wet){const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;env(g,t,v,.008,len);o.connect(fl);fl.connect(g);g.connect(master);if(wet!==false)g.connect(rev);o.start(t);o.stop(t+len+.1)}
  function pad(ch,t,len,v,cut){ch.forEach(m=>[-8,8].forEach(dt=>{const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=dt;fl.type='lowpass';fl.frequency.value=cut;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.35);g.gain.setValueAtTime(v,t+len-.1);g.gain.linearRampToValueAtTime(0,t+len+.4);o.connect(fl);fl.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+len+.5)}))}
  function riser(t,len){const s=oc.createBufferSource();s.buffer=nb;s.loop=true;const fl=oc.createBiquadFilter();fl.type='bandpass';fl.Q.value=2;fl.frequency.setValueAtTime(400,t);fl.frequency.exponentialRampToValueAtTime(7000,t+len);

    cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=20;cx.fillStyle='#fff';cx.fillRect(-W/2+g-4,-ph/2-4,W-2*g+8,ph+8);cx.shadowBlur=0;clipImg(img,-W/2+g,-ph/2,W-2*g,ph,1.06+.03*lb);cx.restore()}}
function drawCarousel(i,lb){const n=photos.length;bgBlur(photos[i]);const off=1-eob(lb/.9),items=[];
  for(let d=-2;d<=2;d++){const j=i+d;if(j<0||j>=n)continue;const a=(d+off)*.78,z=Math.cos(a);items.push({j,a,z})}
  items.sort((p,q)=>p.z-q.z).forEach(({j,a,z})=>{const w=W*.62,h=w*1.3,x=W/2+Math.sin(a)*W*.44,sc=.55+.45*(z+1)/2,sq=.45+.55*Math.abs(Math.cos(a));
    cx.save();cx.translate(x,H*.44);cx.scale(sc*sq,sc);cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=30;cx.fillStyle='#fff';cx.fillRect(-w/2-6,-h/2-6,w+12,h+12);cx.shadowBlur=0;clipImg(photos[j],-w/2,-h/2,w,h);
    cx.fillStyle=`rgba(0,0,0,${(1-z)*.3})`;cx.fillRect(-w/2,-h/2,w,h);cx.restore()})}
function whip(dir,lb){if(lb>=.3)return;const k=1-lb/.3;cx.save();for(let s=1;s<=5;s++){cx.globalAlpha=.16;cx.drawImage(cv,dir*k*55*s,0)}cx.restore()}
function glitch(seed,amt){if(amt<=0)return;for(let k=0;k<9;k++){const y=rnd(seed+k)*H,h=18+rnd(seed+k+50)*70,o=(rnd(seed+k+90)-.5)*90*amt;cx.drawImage(cv,0,y,W,h,o,y,W,h)}
  cx.save();cx.globalCompositeOperation='screen';cx.globalAlpha=.35*amt;cx.fillStyle='#ff0050';cx.fillRect(-8*amt,0,W,H);cx.fillStyle='#00e5ff';cx.fillRect(8*amt,0,W,H);cx.restore()}

const GR=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
let GRP=null;
function filmFx(t){const f=Math.floor(t*24);if(!GRP)GRP=cx.createPattern(GR,'repeat');cx.save();cx.globalCompositeOperation='overlay';cx.globalAlpha=.13;const ox=(rnd(f)*256)|0,oy=(rnd(f+7)*256)|0;
  cx.translate(-ox,-oy);cx.fillStyle=GRP;cx.fillRect(ox,oy,W,H);cx.restore();
  if(rnd(Math.floor(t*10))>.72){const x=rnd(Math.floor(t*10)+3)*W;cx.fillStyle='rgba(255,255,255,.22)';cx.fillRect(x,0,1.5,H)}
  cx.fillStyle=`rgba(255,240,220,${.025*rnd(f+11)})`;cx.fillRect(0,0,W,H)}
function frame(t,beat){frameCore(t,beat);if(photos.length)filmFx(t)}
function frameCore(t,beat){const {n,C,T}=plan(),b=t/beat,fb=b-Math.floor(b),pulse=Math.exp(-fb*7);cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(!n){text('הוסיפו תמונות 📸',H/2,60,1,1);return}
  const last=photos[n-1];
  if(b<8){ // פתיחה
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#000');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.globalAlpha=.25;cover(last,1.25+b*.01,0,0);cx.globalAlpha=1;grade(.1);dust(t,60,'#fde68a');
    emoji(TH.e,W/2,H*.3,170,1+.06*pulse*(b>=4),clamp((b-1)/3,0,.9),Math.sin(t)*.08);
    if(b<4){const k=clamp((b-.6)/1.6,0,1);text(caps.intro,H*.58,78,1+(1-k)*.25,k)}
    else{const k=eob((b-4)/.7);text(caps.intro,H*.48,48,1,clamp(1-(b-4)*2,0,1));text(caps.name,H*.58,150,(.2+.8*k)*(1+.05*pulse),1,null,'#fde047')}
    letterbox(clamp(1.3-b/6,0,1));if(b>=4)flash(1-(b-4)*4,'#fff');return}
  if(b>=C-4&&b<C){drawRapid(b-(C-4),n,t);return}
  if(b<C){const i=Math.floor((b-8)/4),lb=(b-8)-i*4,img=photos[i],dir=i%2?-1:1,st=img.vid?'kb':styleOf(i,n);liveVideo(img,'m'+i,lb);
    if(st==='kb')kb(img,lb,i,pulse);else if(st==='freeze')drawFreeze(i,lb,pulse);else if(st==='polaroid')drawPolaroid(i,lb);else if(st==='collage')drawCollage(i,lb,pulse);else if(st==='carousel')drawCarousel(i,lb);
    else if(st==='flip')drawFlip(i,lb,pulse);else if(st==='iris')drawIris(i,lb,pulse);else if(st==='zoomthru')drawZoomThru(i,lb,pulse);else if(st==='film')drawFilm(i,lb);else if(st==='shapeframe')drawShapeFrame(i,lb,pulse);else if(st==='colorpop')drawColorPop(i,lb,pulse);else if(st==='duo')drawDuo(i,lb,pulse);else if(st==='triple')drawTriple(i,lb,pulse);else drawKaleido(i,lb,pulse);
    grade(.12);dust(t,30,'#fff7cc');if(st==='kb')whip(dir,lb);leak(1-lb/.6);
    const ct=st==='triple'?1.4:st==='collage'?2.4:st==='kaleido'?1.6:st==='freeze'?1.25:.3,k=eob((lb-ct)/.55);text(words(caps.mont[i],lb,ct),H*.82,60,.5+.5*k,clamp((lb-ct)*4,0,1),st==='freeze'?'rgba(220,38,38,.92)':['rgba(219,39,119,.88)','rgba(124,58,237,.88)','rgba(234,88,12,.88)'][i%3]);
    emoji(TH.e,W-80,110,70,1+.15*pulse,.85,0);
    if(st==='kb')flash(1-lb*5,'#fff');return}
  if(b<C+8){const lb=b-C,sh=14*pulse;liveVideo(last,'hero',1.5);cx.save();cx.translate((rnd(Math.floor(b)*3)-.5)*sh,(rnd(Math.floor(b)*7)-.5)*sh);photo(last,1.1+lb*.03+.06*pulse,0,0,0);cx.restore();grade(.25);dust(t,70,'#fde047');
    cx.fillStyle=`rgba(253,224,71,${.12*pulse})`;cx.fillRect(0,0,W,H);
    text(caps.c1,H*.55,70,eob(lb/.5),clamp(lb*4,0,1),'rgba(0,0,0,.5)');
    text(caps.c2,H*.71,118,eob((lb-1)/.6)*(1+.05*pulse),clamp((lb-1)*4,0,1),'rgba(124,58,237,.9)','#fde047');
    if(lb>=4){const k=eob((lb-4)/.6);emoji(TH.ce,W/2,H*.3,200,k*(1+.08*pulse),1,Math.sin(t*20)*.08*Math.exp(-(lb-4)*2));text(caps.tag,H*.86,54,k,1,'rgba(219,39,119,.85)')}
    confetti(lb*beat);glitch(Math.floor(b)*13,(lb<6?1:0)*clamp(1-fb/.14,0,1));flash(1-lb*2.5,'#fff');return}
  const lb=b-C-8;drawMosaic(lb,n);dust(t,50,'#fde68a');cx.fillStyle=`rgba(0,0,0,${clamp((lb-1)*.4,0,.55)})`;cx.fillRect(0,H*.37,W,H*.2);
  text(caps.outro,H*.46,74,eob((lb-1)/.6),clamp((lb-1)*3,0,1),null,'#fde047');text('ערכה: רוני מודן · שחקים',H*.9,30,1,clamp(lb-1,0,1)*.9);letterbox(clamp(lb/2,0,1))}

/* ======= הפעלה והקלטה ======= */
let fxSrc=null,playing=false,src=null,raf=0,rec=null,cur={beat:.6,T:0};
function status(s){$('status').textContent=s}
function drawIdle(){if(!caps)regen();const {C}=plan(),beat=60/STYLES.epic.bpm;frame((C+5.5)*beat,beat)}
async function prepare(){const ac=getAC(),{n,T}=plan();if(!n){toast('📸 קודם מוסיפים תמונות');return null}
  if(music==='own'){if(!song){toast('📁 בחרו שיר מהטלפון');return null}const off=+$('start').value,bt=detectBeat(song.buf,off);return{buf:song.buf,offset:off+bt.phase,beat:bt.beat,T}}
  status('🎵 מלחינה את השיר…');const buf=await renderTrack(music,T);status('');return{buf,offset:0,beat:60/STYLES[music].bpm,T}}
async function start(recording){if(playing)stop();const m=await prepare();if(!m)return false;const ac=getAC();
  status('🎚️ מכינה אפקטים קוליים…');let fxBuf=null;try{fxBuf=await renderSfx(m.beat)}catch(e){}status('');
  src=ac.createBufferSource();src.buffer=m.buf;const g=ac.createGain(),t0=ac.currentTime+.2,dur=m.T*m.beat;src.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(1,t0+dur-1.6);g.gain.linearRampToValueAtTime(0,t0+dur);
  let dest=null;if(recording){dest=ac.createMediaStreamDestination();g.connect(dest)}
  let fx=null;if(fxBuf){fx=ac.createBufferSource();fx.buffer=fxBuf;fx.connect(g)}
  src.start(t0,m.offset);if(fx)fx.start(t0);fxSrc=fx;playing=true;cur={beat:m.beat,T:m.T,t0,dur,dest};$('hint').textContent='👆 לחיצה על המסך = עצירה';
  const tick=()=>{if(!playing)return;const t=ac.currentTime-t0;frame(Math.max(0,t),m.beat);
    if(recording)status('🎬 מקליטה… '+Math.min(100,Math.round(t/dur*100))+'%');
    if(t>=dur){stop();return}raf=requestAnimationFrame(tick)};tick();return true}
function stop(){playing=false;stopVideos();cancelAnimationFrame(raf);try{src&&src.stop();fxSrc&&fxSrc.stop()}catch(e){}src=null;$('hint').textContent='👆 לחיצה על המסך = צפייה';if(rec&&rec.state==='recording')rec.stop();else drawIdle()}
function togglePlay(){getAC();playing?stop():start(false)}
async function record(){getAC();if(!window.MediaRecorder||!cv.captureStream){toast('הדפדפן הזה לא יודע לשמור וידאו. נסו בכרום או בספארי מעודכן.');return}
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'],type=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  $('bMake').disabled=true;const ok=await start(true);if(!ok){$('bMake').disabled=false;return}
  const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...cur.dest.stream.getAudioTracks()]);const chunks=[];
  rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:6e6}:{});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{const mt=rec.mimeType||type||'video/webm',ext=mt.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:mt}),fn=`חלום-${(caps.name||'קליפ').replace(/\s+/g,'-')}.${ext}`;
    $('bMake').disabled=false;status('✅ הקליפ מוכן!');rec=null;drawIdle();const file=new File([blob],fn,{type:mt});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});return}catch(e){}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
    if(ext==='webm')toast('הקליפ נשמר. אם הוא לא נפתח בוואטסאפ, שמרו אותו מספארי באייפון (שם הוא נשמר כ־MP4).',6000)};
  rec.start(250)}


regen();drawIdle();
</script>
